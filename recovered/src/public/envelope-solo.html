<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envelope — solo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #fafafa;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px;
      }

      .card {
        position: relative;
        width: min(434px, 92vw);
        height: min(428px, 92vw);
        background: #fafafa;
        overflow: visible;
      }

      .stage {
        position: absolute;
        left: 6%;
        top: 4%;
        width: 88%;
        height: 78%;
      }

      /* Closed: host hit-tests. Open: covers the viewport. */
      #envelope {
        border: 0;
        display: block;
        background: transparent;
      }
      #envelope.is-docked {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 3;
      }
      #envelope.is-breakout {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: auto;
        z-index: 2147483000;
      }

      .frost {
        position: fixed;
        inset: 0;
        z-index: 2147482999;
        pointer-events: none;
        opacity: 0;
        background: linear-gradient(
          180deg,
          rgba(32, 34, 38, 0.12) 0%,
          rgba(22, 24, 28, 0.16) 100%
        );
        backdrop-filter: blur(0px) saturate(1.05);
        -webkit-backdrop-filter: blur(0px) saturate(1.05);
        transition: none;
      }
      .frost.is-active {
        pointer-events: auto;
        cursor: pointer;
      }

      .hint {
        position: absolute;
        left: 50%;
        bottom: 7%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgb(0 0 0 / 0.6);
        font-family: "Caveat", cursive;
        font-size: 18px;
        line-height: 1.15;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
        z-index: 2;
      }
      .hint.is-hidden { visibility: hidden; }

      .hint__arrow {
        position: absolute;
        right: 100%;
        top: 0;
        width: 26px;
        height: 23px;
        margin-right: 4px;
        transform: translateY(-8px) scaleY(-1) rotate(90deg);
        transform-origin: center center;
        opacity: 0.6;
      }

      .hint__arrow-fill {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        -webkit-mask-image: url("/assets/images/FV4kycU8B4v8ARnFe3KPd0eobN4.svg");
        mask-image: url("/assets/images/FV4kycU8B4v8ARnFe3KPd0eobN4.svg");
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
      }

      .hint p { margin: 0; }
    </style>
  </head>
  <body>
    <div class="frost" id="frost" aria-hidden="true"></div>

    <div class="card" id="card" aria-label="Read my design manifesto">
      <div class="stage" id="stage">
        <iframe
          id="envelope"
          class="is-docked"
          title="About Cherry — envelope"
          allowTransparency
        ></iframe>
      </div>
      <div class="hint" id="hint">
        <span class="hint__arrow" aria-hidden="true">
          <span class="hint__arrow-fill"></span>
        </span>
        <p>Read my design manifesto</p>
      </div>
    </div>

    <script>
      const SOURCE = "about-envelope";
      const ENVELOPE_STACK_W = 420;
      const ENVELOPE_STACK_H = 496;

      const stage = document.getElementById("stage");
      const card = document.getElementById("card");
      const iframe = document.getElementById("envelope");
      const frost = document.getElementById("frost");
      const hint = document.getElementById("hint");

      let letterOpen = false;
      let blurProgress = 0;
      let hovered = false;
      let layoutFrame = 0;

      const clamp = (min, n, max) => Math.max(min, Math.min(max, n));

      function breakout() {
        return letterOpen || blurProgress > 0.001;
      }

      /** Where the envelope graphic sits inside the stage — same math as AboutEnvelope. */
      function envelopeHitRect(width, height, viewportHeight) {
        const sw = Math.max(width || 1, 1);
        const sh = Math.max(height || 1, 1);
        const padX = Math.max(12, sw * 0.05);
        const padY = Math.max(20, sh * 0.1);
        const stageFit = Math.min(
          (sw - padX * 2) / ENVELOPE_STACK_W,
          (sh - padY * 2) / ENVELOPE_STACK_H
        );
        const vhBoost = Math.min(1.45, Math.max(0.9, viewportHeight / 820));
        const maxFit =
          Math.min((sw - 4) / ENVELOPE_STACK_W, (sh - 4) / ENVELOPE_STACK_H) * 0.9;
        const fitScale = Math.min(maxFit, Math.max(0.45, stageFit * vhBoost * 0.9));
        const scale = Number.isFinite(fitScale) && fitScale > 0 ? fitScale : 1;
        const w = ENVELOPE_STACK_W * scale;
        const h = ENVELOPE_STACK_H * scale;
        return { left: (sw - w) / 2, top: (sh - h) / 2, width: w, height: h };
      }

      function stageBox() {
        const r = stage.getBoundingClientRect();
        return {
          left: r.left,
          top: r.top,
          width: Math.max(1, Math.round(r.width)),
          height: Math.max(1, Math.round(r.height)),
        };
      }

      function send(msg) {
        iframe.contentWindow?.postMessage({ source: SOURCE, ...msg }, "*");
      }

      function postLayout() {
        const r = stageBox();
        send({
          type: "layout",
          left: r.left,
          top: r.top,
          width: r.width,
          height: r.height,
          breakout: breakout(),
          viewH: window.innerHeight,
        });
      }

      function scheduleLayout() {
        if (layoutFrame) return;
        layoutFrame = requestAnimationFrame(() => {
          layoutFrame = 0;
          postLayout();
        });
      }

      function applyBreakout() {
        const on = breakout();
        iframe.classList.toggle("is-breakout", on);
        iframe.classList.toggle("is-docked", !on);
        hint.classList.toggle("is-hidden", on);

        const p = Math.max(0, Math.min(1, blurProgress));
        const blurPx = 12 * p;
        frost.style.opacity = String(p);
        frost.style.background = `linear-gradient(180deg, rgba(32, 34, 38, ${0.12 * p}) 0%, rgba(22, 24, 28, ${0.16 * p}) 100%)`;
        frost.style.backdropFilter = `blur(${blurPx}px) saturate(1.05)`;
        frost.style.webkitBackdropFilter = `blur(${blurPx}px) saturate(1.05)`;
        frost.classList.toggle("is-active", letterOpen);
        frost.setAttribute("aria-hidden", letterOpen ? "false" : "true");
        frost.setAttribute("role", letterOpen ? "button" : "presentation");
        if (letterOpen) frost.setAttribute("aria-label", "Close the letter");
        else frost.removeAttribute("aria-label");

        scheduleLayout();
      }

      function hitRect() {
        const r = stage.getBoundingClientRect();
        const hit = envelopeHitRect(r.width, r.height, window.innerHeight);
        return {
          left: r.left + hit.left,
          top: r.top + hit.top,
          width: hit.width,
          height: hit.height,
        };
      }

      function insideEnvelope(x, y) {
        const rect = hitRect();
        return (
          x >= rect.left &&
          x <= rect.left + rect.width &&
          y >= rect.top &&
          y <= rect.top + rect.height
        );
      }

      function insideCard(x, y) {
        const r = card.getBoundingClientRect();
        return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
      }

      function onMove(e) {
        if (breakout()) return;
        if (window.innerWidth <= 1199.98) return;
        const next = insideEnvelope(e.clientX, e.clientY);
        if (next !== hovered) {
          hovered = next;
          send({ type: "hover", active: next });
        }
      }

      function clearHover() {
        if (!hovered) return;
        hovered = false;
        send({ type: "hover", active: false });
      }

      function onClick(e) {
        if (breakout()) return;
        if (!insideEnvelope(e.clientX, e.clientY) && !insideCard(e.clientX, e.clientY)) {
          return;
        }
        clearHover();
        letterOpen = true;
        applyBreakout();
        send({ type: "autoOpen" });
      }

      function closeLetter() {
        send({ type: "autoClose" });
      }

      // Boot iframe sized to the stage.
      {
        const r = stageBox();
        iframe.src =
          `/about-envelope/index.html?embed=1&theme=light&v=71&w=${r.width}&h=${r.height}`;
      }

      iframe.addEventListener("load", postLayout);
      window.addEventListener("resize", scheduleLayout);
      window.addEventListener("scroll", scheduleLayout, { passive: true });

      window.addEventListener("message", (e) => {
        const data = e.data;
        if (!data || data.source !== SOURCE) return;
        if (data.type === "ready") postLayout();
        if (data.type === "letterState" && typeof data.open === "boolean") {
          letterOpen = data.open;
          applyBreakout();
        }
        if (data.type === "blurProgress" && typeof data.progress === "number") {
          blurProgress = Math.max(0, Math.min(1, data.progress));
          applyBreakout();
        }
        if (
          (data.type === "wheel" || data.type === "scrollBy") &&
          typeof data.deltaY === "number"
        ) {
          window.scrollBy(0, data.deltaY);
        }
      });

      document.addEventListener("mousemove", onMove, { passive: true });
      document.addEventListener("click", onClick, true);
      document.addEventListener("mouseleave", clearHover);
      window.addEventListener("blur", clearHover);
      frost.addEventListener("click", (e) => {
        e.stopPropagation();
        if (letterOpen) closeLetter();
      });
      frost.addEventListener("keydown", (e) => {
        if (!letterOpen) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          closeLetter();
        }
      });
    </script>
  </body>
</html>
