      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      } catch (_err) {
        /* ignore quota / private mode */
      }
    }

    function syncEntryToCloud(entry) {
      if (!window.GuestbookApi) return;
      GuestbookApi.createEntry(entry).catch(function (err) {
        if (err && err.code === 'PROFANITY') {
          showMessageError(err.message);
        }
      });
    }

    /** Re-measure + re-place every note on a page (rotated AABB, 16px gap). */
    function relayoutPageNotes(pageIndex, persist) {
      var NP = window.NotePlacement;
      if (!NP) return;
      var list = getEntriesList(pageIndex);
      if (!list) return;
      var notes = Array.prototype.slice.call(
        list.querySelectorAll('.scatter-note')
      );
      if (!notes.length) return;

      var cw = list.clientWidth;
      var ch = list.clientHeight;
      if (cw <= 0 || ch <= 0) return;

      var sizes = notes.map(function (n) {
        return NP.measureUnrotatedSize(n);
      });
      var rotations = notes.map(function (n) {
        var r = parseFloat(n.dataset.rotation);
        return isFinite(r) ? r : 0;
      });
      /* Where each note already sits, so a relayout keeps valid notes where they
         are instead of reshuffling the whole page. */
      var preferred = notes.map(function (n, i) {
        if (!n.style.left && !n.style.top) return null;
        var lx = parseFloat(n.style.left), ty = parseFloat(n.style.top);
        if (!isFinite(lx) || !isFinite(ty)) return null;
        return {
          cx: (lx / 100) * cw + sizes[i].width / 2,
          cy: (ty / 100) * ch + sizes[i].height / 2
        };
      });

      var placements = NP.placeNotes({
        containerWidth: cw,
        containerHeight: ch,
        sizes: sizes,
        rotations: rotations,
        strict: true,
        preferred: preferred
      });

      /*
       * Notes are never stacked on top of one another. A note that does not fit
       * here goes to the NEXT page — left page -> right page of the same spread
       * -> the next spread's left page — so overflow reads in page order. Notes
       * are placed oldest-first, so it is the newest ones that move on. Only the
       * very last page, with nowhere left to go, falls back to overlapping.
       */
      var nextPage = pageIndex + 1;
      var canEvict = isContentPage(nextPage);
      var nextList = canEvict ? getEntriesList(nextPage) : null;
      var evicted = [];

      var entries = persist ? loadEntries() : null;
      notes.forEach(function (note, i) {
        var p = placements[i];
        if (!p) return;
        if (p.fitted === false && canEvict && nextList) {
          // Cleared so the target page places it afresh when it next measures.
          note.style.left = '';
          note.style.top = '';
          note.classList.remove('is-placed');
          nextList.appendChild(note);
          evicted.push(note);
          if (entries) {
            var mid = note.dataset.entryId;
            for (var m = 0; m < entries.length; m++) {
              if (entries[m].id !== mid) continue;
              entries[m].pageIndex = nextPage;
              break;
            }
          }
          return;
        }
        applyPlacementToNote(note, p);
        note.classList.add('is-placed');
        if (!entries) return;
        var id = note.dataset.entryId;
        for (var e = 0; e < entries.length; e++) {
          if (entries[e].id !== id) continue;
          entries[e].pageIndex = pageIndex;
          entries[e].vibe = Object.assign({}, entries[e].vibe || {}, {
            top: p.yPercent.toFixed(2) + '%',
            left: p.xPercent.toFixed(2) + '%',
            rotation: p.rotation
          });
          break;
        }
      });
      if (entries) persistEntries(entries);

      // Give the page that just received notes the chance to place (or pass on)
      // what it was handed. If it is off-screen it has no size yet and simply
      // waits — it lays out the moment it is turned to.
      if (evicted.length) {
        requestAnimationFrame(function () {
          relayoutPageNotes(nextPage, persist);
        });
      }
    }

    function relayoutAllPages(persist) {
      if (!bookEl) return;
      var lists = bookEl.querySelectorAll('.entries-list');
      lists.forEach(function (list) {
        relayoutPageNotes(Number(list.dataset.flipIndex), persist);
      });
    }

    var pageResizeDisconnectors = [];

    function bindPageResizeObservers() {
      var NP = window.NotePlacement;
      pageResizeDisconnectors.forEach(function (off) { off(); });
      pageResizeDisconnectors = [];
      if (!NP || !bookEl) return;
      bookEl.querySelectorAll('.entries-list').forEach(function (list) {
        var off = NP.observeContainerResize(list, function () {
          relayoutPageNotes(Number(list.dataset.flipIndex), true);
        });
        pageResizeDisconnectors.push(off);
      });
    }

    function paintEntriesOntoPages() {
      if (!bookEl) return;
      var lists = bookEl.querySelectorAll('.entries-list');
      lists.forEach(function (list) { list.innerHTML = ''; });
      /*
       * Pack the book from the first page on every paint, ignoring whichever
       * page a note was saved on. Everything starts on page 1; the relayout
       * keeps what fits there and passes the rest to page 2, which passes its
       * overflow to page 3, and so on. So notes only spill onto a later page
       * once the earlier one is truly full — no half-empty spreads.
       * Stable sort by saved page keeps the existing reading order.
       */
      var firstList = getEntriesList(1);
      if (firstList) {
        loadEntries()
          .filter(isBookCoverEntry)
          .map(function (entry, i) { return { entry: entry, i: i }; })
          .sort(function (a, b) {
            return ((Number(a.entry.pageIndex) || 0) - (Number(b.entry.pageIndex) || 0)) || (a.i - b.i);
          })
          .forEach(function (item) {
            firstList.appendChild(createScatterNote(item.entry));
          });
      }
      // Measure real sizes, place with rotated AABB, then fade in
      requestAnimationFrame(function () {
        relayoutAllPages(true);
        bindPageResizeObservers();
      });
    }

    function collectOccupiedBoxes(list) {
      var NP = window.NotePlacement;
      var cw = list.clientWidth;
      var ch = list.clientHeight;
      var notes = Array.prototype.slice.call(
        list.querySelectorAll('.scatter-note.is-placed, .scatter-note')
      );
      var sizes = [];
      var placements = [];
      notes.forEach(function (n) {
        if (!n.style.left && !n.style.top) return;
        sizes.push(NP.measureUnrotatedSize(n));
        placements.push({
          xPercent: parseFloat(n.style.left) || 0,
          yPercent: parseFloat(n.style.top) || 0,
          rotation: parseFloat(n.dataset.rotation) || 0
        });
      });
      return {
        cw: cw,
        ch: ch,
        boxes: NP.boxesFromPlacements(sizes, placements, cw, ch)
      };
    }

    /**
     * Try to fit one new note on a page using real measured size + rotated AABB.
     * Returns { note, entry, placement } or null if the page is full.
     */
    function tryFitNoteOnPage(pageIndex, draft) {
      var NP = window.NotePlacement;
      if (!NP || !isContentPage(pageIndex)) return null;
      var list = getEntriesList(pageIndex);
      if (!list) return null;

      var occupied = collectOccupiedBoxes(list);
      if (occupied.cw <= 0 || occupied.ch <= 0) return null;

      var note = createScatterNote({
        id: draft.id,
        message: draft.message,
        name: draft.name,
        date: draft.date,
        vibe: { rotation: draft.rotation, color: draft.color }
      });
      list.appendChild(note);
      var size = NP.measureUnrotatedSize(note);

      var placed = NP.tryPlaceOneNote({
        containerWidth: occupied.cw,
        containerHeight: occupied.ch,
        size: size,
        rotation: draft.rotation,
        occupied: occupied.boxes
      });

      if (!placed) {
        list.removeChild(note);
        return null;
      }

      applyPlacementToNote(note, placed.placement);
      revealNote(note);

      var entry = {
        id: draft.id,
        message: draft.message,
        name: draft.name,
        date: draft.date,
        pageIndex: pageIndex,
        vibe: {
          font: 'Ugly Dave',
          color: draft.color,
          rotation: placed.placement.rotation,
          weight: 400,
          fontSize: 14,
          top: placed.placement.yPercent.toFixed(2) + '%',
          left: placed.placement.xPercent.toFixed(2) + '%'
        },
        source: 'book-cover'
      };

      var entries = loadEntries();
      var replaced = false;
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].id === entry.id) {
          entries[i] = entry;
          replaced = true;
          break;
        }
      }
      if (!replaced) entries.push(entry);
      persistEntries(entries);
      syncEntryToCloud(entry);

      return { note: note, entry: entry, placement: placed.placement, pageIndex: pageIndex };
    }

    /** Force-place via full relayout (grid fallback) when a page must accept the note. */
    function forcePlaceOnPage(pageIndex, draft) {
      var list = getEntriesList(pageIndex);
      if (!list || !isContentPage(pageIndex)) return null;

      var note = createScatterNote({
        id: draft.id,
        message: draft.message,
        name: draft.name,
        date: draft.date,
        vibe: { rotation: draft.rotation, color: draft.color }
      });
      list.appendChild(note);

      var entry = {
        id: draft.id,
        message: draft.message,
        name: draft.name,
        date: draft.date,
        pageIndex: pageIndex,
        vibe: {
          font: 'Ugly Dave',
          color: draft.color,
          rotation: draft.rotation,
          weight: 400,
          fontSize: 14,
          top: '12%',
          left: '12%'
        },
        source: 'book-cover'
      };
      var entries = loadEntries();
      entries.push(entry);
      persistEntries(entries);
      syncEntryToCloud(entry);

      relayoutPageNotes(pageIndex, true);
      revealNote(note);
      return { note: note, entry: entry, pageIndex: pageIndex };
    }

    function ensurePageVisible(pageIndex) {
      if (!pageFlip || !isContentPage(pageIndex)) return;
      var current = pageFlip.getCurrentPageIndex();
      // For a right page R, turn to R; for left L, turn to L (shows L|L+1)
      var turnTo = pageIndex;
      if (turnTo === current) return;
      try {
        if (Math.abs(turnTo - current) === 1) {
          if (turnTo > current) pageFlip.flipNext();
          else pageFlip.flipPrev();
        } else {
          pageFlip.turnToPage(turnTo);
        }
      } catch (_e) {
        try { pageFlip.turnToPage(turnTo); } catch (_e2) {}
      }
    }

    /*
     * The two pages currently on screen.
     *
     * StPageFlip's real spreads (showCover, landscape) are (1|2), (3|4), (5|6):
     * the ODD page is the LEFT leaf and the even one the right. The earlier
     * helpers above assume the opposite (an odd page as a lone right leaf), so
     * they never tried the right leaf before turning the page. This reads the
     * spread straight from the book's current index instead.
     */
    function currentSpreadLeaves() {
      var cur = pageFlip ? pageFlip.getCurrentPageIndex() : 1;
      var left = cur % 2 === 1 ? cur : cur - 1;
      if (left < 1) left = 1;
      return [left, left + 1].filter(isContentPage);
    }

    /*
     * Put a note on the open spread: LEFT page first; if it has no room, the
     * RIGHT page; only when neither can take it, turn the page and try the next
     * spread. It keeps turning until something has space — stacking it on top of
     * existing notes is the last resort, when the book has no pages left.
     */
    /** Highest page holding any note — where the book's writing currently ends. */
    function lastFilledPage() {
      var last = 1;
      if (!bookEl) return last;
      bookEl.querySelectorAll('.entries-list').forEach(function (list) {
        var idx = Number(list.dataset.flipIndex);
        if (idx > last && list.querySelector('.scatter-note')) last = idx;
      });
      return last;
    }

    function placeOnSpreadOrFlip(draft, attempt, done) {
      done = done || function () {};
      var leaves = currentSpreadLeaves();
      /*
       * A new note continues where the writing ends, not on whatever spread the
       * visitor has flipped to — otherwise it lands on a blank spread ahead of
       * (or a full one behind) the last notes and leaves gaps in the book.
       */
      if (attempt === 0 && pageFlip) {
        var frontier = lastFilledPage();
        var frontierLeft = frontier % 2 === 1 ? frontier : frontier - 1;
        if (leaves.length && leaves[0] !== frontierLeft && isContentPage(frontierLeft)) {
          try { pageFlip.flip(frontierLeft); } catch (_e) { pageFlip.turnToPage(frontierLeft); }
          var wait = prefersReducedMotion.matches ? 0 : FLIPPING_TIME + 60;
          setTimeout(function () { placeOnSpreadOrFlip(draft, 1, done); }, wait);
          return null;
        }
      }
      for (var i = 0; i < leaves.length; i++) {
        var fitted = tryFitNoteOnPage(leaves[i], draft);
        if (fitted) { done(); return fitted; }
      }
      var nextLeft = leaves.length ? leaves[0] + 2 : null;
      if (nextLeft != null && isContentPage(nextLeft) && attempt < 40 && pageFlip) {
        try { pageFlip.flipNext(); } catch (_e) { done(); return forcePlaceOnPage(leaves[leaves.length - 1], draft); }
        var delay = prefersReducedMotion.matches ? 0 : FLIPPING_TIME + 60;
        setTimeout(function () { placeOnSpreadOrFlip(draft, attempt + 1, done); }, delay);
        return null;
      }
      done();
      return forcePlaceOnPage(leaves.length ? leaves[leaves.length - 1] : 1, draft);
    }

    /*
     * One placement at a time. A placement can wait out page turns, and two
     * running at once each turned the book on their own — notes skipped whole
     * spreads. Later notes wait for the one before them to land.
     */
    var placementQueue = [];
    var placementBusy = false;
    function runNextPlacement() {
      if (placementBusy || !placementQueue.length) return;
      placementBusy = true;
      var draft = placementQueue.shift();
      placeOnSpreadOrFlip(draft, 0, function () {
        placementBusy = false;
        runNextPlacement();
      });
    }

    /**
     * Place on the open spread (left, then right) → only flip when both sides
     * are full.
     */
    function placeEntryWithOverflow(message, name) {
      var id = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);

      var draft = {
        id: id,
        message: message,
        name: String(name || '').trim() || '—',
        date: getTodayStamp(),
        rotation: Math.random() * 14 - 7,
        color: NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)]
      };

      placementQueue.push(draft);
      runNextPlacement();
    }

    function clearNameHintTimer() {
      clearTimeout(nameHintTimer);
      nameHintTimer = null;
    }

    function setNameHint(on) {
      nameHinted = !!on;
      messageForm.classList.toggle('is-hinted', nameHinted);
      if (nameSlot) nameSlot.setAttribute('aria-hidden', nameHinted ? 'false' : 'true');
      if (nameInput) nameInput.tabIndex = nameHinted ? 0 : -1;
      if (!nameHinted && nameInput) nameInput.value = '';
    }

    function scheduleNameHint() {
      clearNameHintTimer();
      nameHintTimer = setTimeout(function () {
        nameHintTimer = null;
        if (phase !== 'open' && phase !== 'opening') return;
        if (!messageInput.value.trim()) return;
        setNameHint(true);
      }, NAME_HINT_MS);
    }

    function syncMessageMirror() {
      var raw = messageInput.value;
      var empty = raw.length === 0;
      var canSend = !!raw.trim();
      var focused = messageForm.classList.contains('is-focused');
      messageForm.classList.toggle('is-empty', empty);
      messageForm.classList.toggle('is-ready', canSend);
      messageMirror.classList.toggle('is-empty', empty);
      /* Placeholder only when idle+empty; hide on focus so caret is left-most */
      messageMirrorText.textContent = empty
        ? (focused ? '' : PLACEHOLDER)
        : raw;
      messageSend.disabled = !canSend;
      messageSend.classList.toggle('is-ready', canSend);
    }

    function resetMessageField() {
      clearNameHintTimer();
      setNameHint(false);
      messageInput.value = '';
      if (nameInput) nameInput.value = '';
      syncMessageMirror();
      messageForm.classList.remove('is-focused');
    }

    function scheduleMessageInputShow() {
      clearTimeout(inputShowTimer);
      var delay = prefersReducedMotion.matches ? 0 : INPUT_SHOW_DELAY_MS;
      inputShowTimer = setTimeout(function () {
        if (phase !== 'opening' && phase !== 'open') return;
        messageDock.classList.add('is-visible');
        messageDock.setAttribute('aria-hidden', 'false');
      }, delay);
    }

    function hideMessageInput() {
      clearTimeout(inputShowTimer);
      clearNameHintTimer();
      messageDock.classList.remove('is-visible');
      messageDock.setAttribute('aria-hidden', 'true');
      resetMessageField();
    }

    function commitMessage() {
      if (phase !== 'open' && phase !== 'opening') return;
      var raw = String(messageInput.value || '').trim();
      var cleaned = sanitizeEnglishOnly(messageInput.value).trim();
      if (!cleaned) {
        // Typing something the book cannot letter used to clear the field and
        // drop the message without a word. Keep the text and explain instead.
        if (raw) {
          showMessageError(UNSUPPORTED_MSG);
          return;
        }
        resetMessageField();
        return;
      }

      var name = sanitizeEnglishOnly(nameInput ? nameInput.value : '').trim();

      if (window.ProfanityFilter) {
        var gate = ProfanityFilter.checkProfanity(cleaned, name);
        if (!gate.ok) {
          showMessageError(gate.reason);
          return;
        }
      }

      clearMessageError();
      placeEntryWithOverflow(cleaned, name);
      resetMessageField();
    }

    /** Unclip stage while hard cover flaps open/closed */
    function setCoverFlipping(active) {
      document.body.classList.toggle('is-cover-flipping', active);
    }

    /** Click-open stage — right-page notebook art + spine-square radii */
    function setBookOpening(active) {
      document.body.classList.toggle('is-book-opening', active);
    }

    /**
     * Reveal/hide the split open-spread on #open-staging (is-notebook).
     * For initial open: call ONLY when the cover flap lands (see flip handler).
     * Decode is pre-warmed offscreen via warmNotebookBackground / #notebook-paint-warm.
     */
    function setNotebookVisible(on) {
      bookWrapper.classList.toggle('is-notebook', on);
      if (!on) bookWrapper.classList.remove('is-hiding-left');
    }

    /** Clear left half immediately so cover can flap closed without fighting bg */
    function hideLeftNotebook() {
      bookWrapper.classList.add('is-hiding-left');
    }

    /**
     * Cover 0→1 open just finished — show BOTH OpenNotebookLeft + Right
     * in this same callback frame (no setTimeout). Opening flag off; staging
     * stays via is-notebook. Idempotent; only acts while opening.
     */
    function revealNotebookOnCoverLand() {
      if (phase !== 'opening') return;
      clearTimeout(openTimer);
      phase = 'open';
      setBookOpening(false);
      setCoverFlipping(false);
      bookWrapper.classList.remove('is-hiding-left');
      setNotebookVisible(true);
    }

    /** Decode-safe preload — decodeURI for spaces; resolve after decode when possible */
    function preloadImage(src) {
      return new Promise(function (resolve) {
        var img = new Image();
        var finish = function () { resolve(img); };
        var afterLoad = function () {
          if (typeof img.decode === 'function') {
            img.decode().then(finish).catch(finish);
          } else {
            finish();
          }
        };
        img.onload = afterLoad;
        img.onerror = finish;
        img.src = src;
      });
    }

    /** Wait until PageFlip cover/back imgs have painted pixels */
    function waitForBookImages() {
      var imgs = bookEl.querySelectorAll('img');
      if (!imgs.length) return Promise.resolve();
      return Promise.all(
        Array.prototype.map.call(imgs, function (img) {
          if (img.complete && img.naturalWidth > 0) {
            return typeof img.decode === 'function'
              ? img.decode().catch(function () {})
              : Promise.resolve();
          }
          return new Promise(function (resolve) {
            var done = function () { resolve(); };
            img.addEventListener('load', done, { once: true });
            img.addEventListener('error', done, { once: true });
          });
        })
      );
    }

    /**
     * Warm Cover / Back / open-spread halves (decode + CSS paint) before any click.
     * Halves are ~6–10KB WebP at display size — still warm so open never
     * waits on a cold background-image decode mid-flip.
     */
    function setCssUrlVar(name, src) {
      document.documentElement.style.setProperty(
        name,
        'url("' + src.replace(/"/g, '\\"') + '")'
      );
    }

    /**
     * Prefer .webp; fall back to .png if webp fails to decode.
     * Sets the given CSS custom property for staging / warm paint.
     */
    function resolveNotebookHalf(webpSrc, pngSrc, cssVar) {
      return preloadImage(webpSrc).then(function (img) {
        if (img && img.naturalWidth > 0) {
          setCssUrlVar(cssVar, webpSrc);
          return webpSrc;
        }
        return preloadImage(pngSrc).then(function () {
          setCssUrlVar(cssVar, pngSrc);
          return pngSrc;
        });
      });
    }

    function resolveNotebookLeftAsset() {
      return resolveNotebookHalf(
        ASSETS.notebookLeft,
        ASSETS.notebookLeftPng,
        '--open-notebook-left-img'
      );
    }

    function resolveNotebookRightAsset() {
      return resolveNotebookHalf(
        ASSETS.notebookRight,
        ASSETS.notebookRightPng,
        '--open-notebook-right-img'
      );
    }

    function warmNotebookBackground() {
      if (!document.documentElement.style.getPropertyValue('--open-notebook-left-img')) {
        setCssUrlVar('--open-notebook-left-img', ASSETS.notebookLeft);
      }
      if (!document.documentElement.style.getPropertyValue('--open-notebook-right-img')) {
        setCssUrlVar('--open-notebook-right-img', ASSETS.notebookRight);
      }
      // #notebook-paint-warm already paints both halves offscreen via CSS vars
    }

    function preloadOpenAssets() {
      if (assetsPromise) return assetsPromise;
      // Only the two hard covers are bitmaps now — the spread is CSS, so the
      // first open no longer blocks on decoding two full-page images.
      assetsPromise = Promise.all([
        preloadImage(ASSETS.cover),
        preloadImage(ASSETS.back)
      ]).then(function () {
        assetsReady = true;
      });
      return assetsPromise;
    }

    // Start immediately on parse — do not wait for click
    preloadOpenAssets();

    /**
     * One page size for closed CSS cover and PageFlip pages.
     * Stage is always 2×pageWidth × pageHeight, spine-centered.
     */
    function applyBookSize() {
      var maxSpreadW = Math.min(window.innerWidth * 0.92, 900);
      var maxH = Math.min(window.innerHeight * 0.72, 640);

      var pageWidth = Math.min(Math.floor(maxSpreadW / 2), 440);
      var pageHeight = Math.round(pageWidth * PAGE_ASPECT);

      if (pageHeight > maxH) {
        pageHeight = Math.floor(maxH);
        pageWidth = Math.round(pageHeight / PAGE_ASPECT);
      }

      // Keep depth roughly proportional on small screens
      var depth = pageWidth < 220 ? 22 : 28;

      document.documentElement.style.setProperty('--book-w', pageWidth + 'px');
      document.documentElement.style.setProperty('--book-h', pageHeight + 'px');
      document.documentElement.style.setProperty('--book-depth', depth + 'px');

      bookSize = { pageWidth: pageWidth, pageHeight: pageHeight };
      return bookSize;
    }

    applyBookSize();

    function hardCover(src, alt, isFront) {
      var page = document.createElement('div');
      page.className = 'page page--hard-cover' + (isFront ? ' page--hard-front' : '');
      page.dataset.density = 'hard';
      /*
       * Front art + solid pink (#FF53C4) verso panel (no paper layer).
       * Note: during open curl PageFlip also pairs page index 1 as the
       * hard-board backface — that leaf is painted pink via CSS
       * (body.is-book-opening .page--opening-right).
       */
      page.innerHTML =
        '<div class="cover-front">' +
          '<img class="cover-img" src="' + src + '" alt="' + alt + '" ' +
            'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'" />' +
          '<div class="cover-placeholder" aria-hidden="true"></div>' +
        '</div>' +
        '<div class="cover-verso" aria-hidden="true"></div>';
      return page;
    }

    function notebookPage(isLeft, isOpeningRight, flipIndex) {
      var page = document.createElement('div');
      /*
       * showCover: page index 1 is the first RIGHT leaf under the cover.
       * Remaining inners alternate left/right for spreads.
       */
      page.className = 'page ' + (isLeft ? '--left' : '--right');
      if (isOpeningRight) page.classList.add('page--opening-right');

      var inner = document.createElement('div');
      inner.className = 'entry-page-inner';

      var ruled = document.createElement('div');
      ruled.className = 'ruled-lines';
      inner.appendChild(ruled);

      var list = document.createElement('div');

      if (probeClass !== null) closedProbe.className = probeClass;

      var scale = br.width > 0 ? d.width / br.width : 1;
      var sc = { x: sr.left + sr.width / 2, y: sr.top + sr.height / 2 };
      var bc = { x: br.left + br.width / 2, y: br.top + br.height / 2 };
      var tx = (d.left + d.width / 2) - (sc.x + (bc.x - sc.x) * scale);
      var ty = (d.top + d.height / 2) - (sc.y + (bc.y - sc.y) * scale);
      var txCss = tx.toFixed(2) + 'px';
      var tyCss = ty.toFixed(2) + 'px';
      var scaleCss = String(scale);

      var root = document.documentElement.style;
      root.setProperty('--dock-scale', scaleCss);
      root.setProperty('--dock-tx', txCss);
      root.setProperty('--dock-ty', tyCss);

      if (animateHome && !wasDocked) {
        flyStageHome(stage, txCss, tyCss, scaleCss);
      } else {
        document.body.classList.add('is-docked');
        stage.style.transform = '';
        stage.style.transition = 'none';
        // Already home: correct immediately. Arriving keeps the animated path above.
        if (wasDocked) fitToSlot(d);
      }
      return;
    }
    if (d.type === 'refit') { fitToSlot(d); return; }
    if (d.type === 'undock') {
      /*
       * Snap, don't animate: standalone the book is already centred at rest, so
       * gliding it in from the slot would be motion the source never had. The
       * cover flip that follows is the real animation.
       */
      var stage = document.getElementById('stage');
      if (stage) {
        clearTimeout(stage.__homeTimer);
        stage.style.transition = 'none';
        stage.style.transform = '';
        document.body.classList.remove('is-docked');
        void stage.offsetWidth;
        stage.style.transition = '';
      } else {
        document.body.classList.remove('is-docked');
      }
      return;
    }
    if (d.type === 'open') {
      var el = document.getElementById('css-book');
      if (el && !document.body.classList.contains('is-book-open')) el.click();
    }
  });
  function syncEmbedClass() {
    if (document.documentElement.classList.contains('is-embed')) {
      document.body.classList.add('is-embed');
    }
  }
  if (document.body) syncEmbedClass();
  else document.addEventListener('DOMContentLoaded', syncEmbedClass);

  /* Hover hint: the frame is full-viewport at 0,0, so client coords are the
     host's viewport coords. The host draws the "Click to sign" pill. */
  var hovering = false;
  function postHover(type, e) {
    try { parent.postMessage({ source: SRC, type: type, x: e ? e.clientX : 0, y: e ? e.clientY : 0 }, '*'); } catch (err) {}
  }
  function overBook(e) {
    return document.body.classList.contains('is-docked') &&
      e.target && e.target.closest && !!e.target.closest('#css-book');
  }
  document.addEventListener('mousemove', function (e) {
    if (overBook(e)) {
      postHover(hovering ? 'hoverMove' : 'hoverStart', e);
      hovering = true;
    } else if (hovering) {
      hovering = false;
      postHover('hoverEnd');
    }
  }, true);
  document.addEventListener('mouseleave', function () {
    if (hovering) { hovering = false; postHover('hoverEnd'); }
  });

  document.addEventListener('click', function (e) {
    if (!document.body.classList.contains('is-docked')) return;
    if (hovering) { hovering = false; postHover('hoverEnd'); }
    if (!e.target || !e.target.closest) return;
    if (!e.target.closest('#css-book')) return;
    // Capture phase, so this lands before the page's own click handler runs
    // openBook() -> initPageFlip(): #book must be back in the DOM by then.
    restoreBook();
    // Host expands the iframe to fullscreen; it will undock us, and the book's
    // own openBook() runs from its real click handler as usual.
    post('requestOpen');
  }, true);

  /*
   * PageFlip's destroy() takes #book out of the DOM, but the page captured
   * `bookEl` once at startup — so after a close that reference is detached, and
   * the next open builds its pages into a node that is no longer on the page
   * (blank spread, no dotted paper, zero .stf__item). Put it back before the
   * next open can run.
   */
  var bookEl = null;
  var bookParent = null;
  function rememberBook() {
    var el = document.getElementById('book');
    if (el) { bookEl = el; bookParent = el.parentNode; }
  }
  function restoreBook() {
    if (!bookEl || !bookParent) return;
    if (!document.getElementById('book')) {
      bookEl.className = bookEl.className.replace(/\bstf__\S+/g, '').trim();
      bookEl.removeAttribute('style');
      bookEl.innerHTML = '';
      bookParent.appendChild(bookEl);
    }
  }

  /*
   * Announce a dismiss as it is requested, not after it finishes, so the host
   * can start the book travelling home while the cover is still flipping back —
   * one gesture rather than three in sequence. Capture phase so this runs
   * alongside the page's own handlers, never after them.
   */
  function announceClosing() {
    // Only while the book is actually open, and only once per dismiss —
    // double Escape (host close + key) used to post `closing` twice.
    if (last !== true) return;
    if (document.body.classList.contains('is-closing-home')) return;
    document.body.classList.add('is-closing-home');
    post('closing');
  }
  // Esc keycap must start the same host shrink as frost / Escape.
  window.__guestbookAnnounceClosing = announceClosing;
  function bindDismissWatch() {
    var frost = document.getElementById('frost');
    if (frost) frost.addEventListener('click', announceClosing, true);
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') announceClosing();
    }, true);
  }
  if (document.body) bindDismissWatch();
  else document.addEventListener('DOMContentLoaded', bindDismissWatch);

  /*
   * Fit the docked book to the slot. .book-wrap carries perspective:1200px, so
   * the rendered size is not linear in --dock-scale and one correction
   * under-shoots; iterate until it converges. Transition off throughout, so this
   * is a measurement pass rather than a second animation.
   */
  /*
   * A cached fit is only good for the book it was measured against. Opening
   * runs applyBookSize(), which rewrites --book-w (320 -> 440), so the closed
   * book that comes home is a different size from the one the cache was built
   * for. Keyed on the slot alone, the shrink used to animate to the stale
   * scale and then get snapped to the real one by the refit that follows —
   * the jump in the footer at the end of every close. Keying on the book size
   * too simply misses the stale entry, so the dock re-measures and the shrink
   * travels to its true target.
   */
  function dockFitKey(d) {
    var bw = getComputedStyle(document.documentElement)
      .getPropertyValue('--book-w').trim();
    return Math.round(d.left) + ':' + Math.round(d.top) + ':' +
           Math.round(d.width) + ':' + bw;
  }

  /*
   * Fly #stage from centre into the footer slot with a real transform
   * transition. Driving `transform` through CSS variables (the usual docked
   * rule) creates a pending WAAPI animation that never starts — currentTime
   * stays 0, the book sits at identity, and the host's later refit snaps it
   * down. Concrete inline values interpolate reliably; once the flight ends we
   * clear the inline transform so scroll-tracking can keep updating via vars.
   */
  function flyStageHome(stage, txCss, tyCss, scaleCss) {
    clearTimeout(stage.__homeTimer);
    stage.style.transition = 'none';
    stage.style.transform = 'translate(0px, 0px) scale(1)';
    document.body.classList.add('is-docked');
    void stage.offsetWidth;
    // Closing flight home: a touch slower and a gentler ease-out than the
    // open curve, so the book settles into its slot rather than snapping.
    stage.style.transition = 'transform 540ms cubic-bezier(0.34, 0.86, 0.4, 1)';
    stage.style.transform =
      'translate(' + txCss + ', ' + tyCss + ') scale(' + scaleCss + ')';

    var finish = function (e) {
      if (e && e.propertyName && e.propertyName !== 'transform') return;
      stage.removeEventListener('transitionend', finish);
      clearTimeout(stage.__homeTimer);
      if (!document.body.classList.contains('is-docked')) return;
      stage.style.transition = 'none';
      stage.style.transform = '';
      void stage.offsetWidth;
      stage.style.transition = '';
    };
    stage.addEventListener('transitionend', finish);
    stage.__homeTimer = setTimeout(finish, 620);
  }

  function fitToSlot(d) {
    var st = document.getElementById('stage');
    var bk = document.getElementById('css-book');
    if (!st || !bk || !(d.width > 0)) return;
    clearTimeout(st.__homeTimer);
    var pv = st.style.transition;
    st.style.transition = 'none';
    st.style.transform = '';
    var rt = document.documentElement.style;
    for (var pass = 0; pass < 6; pass++) {
      var cur = bk.getBoundingClientRect().width;
      if (!(cur > 0) || Math.abs(cur - d.width) < 0.5) break;
      var s0 = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dock-scale')) || 1;
      rt.setProperty('--dock-scale', String(s0 * (d.width / cur)));
      void st.offsetWidth;
    }
    var r2 = bk.getBoundingClientRect();
    rt.setProperty('--dock-tx',
      (parseFloat(rt.getPropertyValue('--dock-tx')) + ((d.left + d.width / 2) - (r2.left + r2.width / 2))).toFixed(2) + 'px');
    rt.setProperty('--dock-ty',
      (parseFloat(rt.getPropertyValue('--dock-ty')) + ((d.top + d.height / 2) - (r2.top + r2.height / 2))).toFixed(2) + 'px');
    void st.offsetWidth;
    st.style.transition = pv;
    // Remember the converged values: the next dock for this same slot can go
    // straight there, so the shrink animates to its true target rather than
    // overshooting and being snapped back afterwards.
    window.__dockFit = {
      key: dockFitKey(d),
      scale: rt.getPropertyValue('--dock-scale'),
      tx: rt.getPropertyValue('--dock-tx'),
      ty: rt.getPropertyValue('--dock-ty')
    };
  }

  var last = null;
  function report() {
    // "Open" spans the whole sequence, from the first cover-flip frame until the
    // closed CSS book has been restored (finishClose re-adds .is-closed after
    // its 210ms beat). Reporting on `is-book-open` alone fires while the cover
    // is still flipping back, and the host would re-dock mid-animation.
    var closedWrap = document.getElementById('closed-book');
    var restored = closedWrap && closedWrap.classList.contains('is-closed');
    var body = document.body.classList;
    var open = body.contains('is-book-open') ||
               body.contains('is-cover-flipping') ||
               body.contains('is-book-opening') ||
               !restored;
    if (open !== last) {
      last = open;
      if (open) {
        rememberBook();
        document.body.classList.remove('is-closing-home');
      } else {
        // Close finished — drop the in-flight flag so the next open starts clean.
        document.body.classList.remove('is-closing-home');
      }
      post(open ? 'opened' : 'closed');
    }
  }
  /*
   * finishClose() hides PageFlip instantly (#book-wrapper loses .is-visible,
   * which has transition:none) but only restores the closed CSS book 210ms
   * later — nothing is painted in between. Standalone that hole sits behind the
   * frost; docked, the book has just landed in the slot, so it reads as a
   * blink. Hand over the moment PageFlip goes; the page's own timeout then
   * re-applies the same classes harmlessly.
   */
  function bindHandoff() {
    var bw = document.getElementById('book-wrapper');
    if (!bw) return;
    new MutationObserver(function () {
      if (!document.body.classList.contains('is-closing-home')) return;
      if (bw.classList.contains('is-visible')) return;
      var cw = document.getElementById('closed-book');
      if (!cw || !cw.classList.contains('is-hidden')) return;
      var bk = document.getElementById('css-book');
      var bkPrev = bk ? bk.style.transition : null;
      if (bk) bk.style.transition = 'none';
      cw.classList.remove('is-hidden', 'is-opening', 'is-swap');
      cw.classList.add('is-closed');
      if (bk) {
        /*
         * Square for the whole trip. The docked book is only squared up by
         * `body.is-docked .book-wrap.is-closed`, which does not settle until
         * part-way through the travel — so the book arrived tilted, then
         * snapped square a few frames later at a scale solved for the square
         * one, a ~13px pop right at the landing. Pinned here, it is the same
         * shape the scale was measured against from the first frame.
         */
        bk.style.transform = 'rotateX(0deg) rotateY(0deg)';
        void bk.offsetWidth;
        /*
         * Hold the easing off until the book is home and the host's refit has
         * run. Restored on the next frame instead, .book spent 0.7s easing
         * rotateY(-10deg) -> 0 *while* the shrink was measuring it: the fit
         * read a narrow, still-turning book, cached that scale, and the book
         * swelled ~13px and then got snapped back — the flicker in the footer
         * at the end of every close. Hover gets its easing back afterwards.
         */
        clearTimeout(bk.__easeTimer);
        bk.__easeTimer = setTimeout(function () {
          bk.style.transform = '';
          bk.style.transition = bkPrev || '';
        }, 900);
      }
    }).observe(bw, { attributes: true, attributeFilter: ['class'] });
  }
  if (document.body) bindHandoff();
  else document.addEventListener('DOMContentLoaded', bindHandoff);

  var mo = new MutationObserver(report);
  mo.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  function watchClosedWrap() {
    var el = document.getElementById('closed-book');
    if (el) mo.observe(el, { attributes: true, attributeFilter: ['class'] });
  }
  if (document.body) { watchClosedWrap(); rememberBook(); }
  else document.addEventListener('DOMContentLoaded', function () { watchClosedWrap(); rememberBook(); });
  post('ready');
  report();
})();
</script>
</body>
</html>
