<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestbook</title>
  <!-- The open spread is drawn in CSS (see "CODED OPEN SPREAD"), so only the
       two hard covers are bitmaps worth preloading. -->
  <link rel="preload" as="image" href="Assets/Images/Cover.png?v=1789859770" />
  <link rel="preload" as="image" href="Assets/Images/Back.png?v=1785618989" />
  <meta name="guestbook-cloud" content="auto" />
  <script src="vendor/page-flip.browser.js"></script>
  <script src="js/notePlacement.js?v=20261012-gap"></script>
  <script src="js/profanityFilter.js"></script>
  <script src="js/seedEntries.js?v=live-2026-10-12-inks2"></script>
  <script src="js/guestbookApi.js?v=20261012-seed2"></script>
  <style>
    @font-face {
      font-family: 'Ugly Dave';
      src: url('Assets/Fonts/ugly-dave/ugly-dave.woff2') format('woff2'),
           url('Assets/Fonts/ugly-dave/ugly-dave.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Switzer';
      src: url('Assets/Fonts/switzer/Switzer-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Switzer';
      src: url('Assets/Fonts/switzer/Switzer-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 3.5vh, 36px);
      padding: 28px 16px 40px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      font-family: 'Ugly Dave', cursive, sans-serif;
    }

    /*
     * Backdrop — no fill at all, just a heavy blur of the page itself (40px,
     * up from the original 21px), so the page keeps its own colours and only
     * loses its detail behind the book.
     *
     * The full blur always sits on the layer and only opacity animates, so it
     * reads as the blur fading in rather than a radius recomputed every frame.
     * Enter 420ms on the drawer curve (0.32, 0.72, 0, 1): it starts at once
     * and eases into the last of the blur instead of snapping. Exit is
     * quicker and runs with the book's flight home (body.is-closing-home).
     * Click dismisses like the envelope frost overlay.
     */
    .frost-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      background: transparent;
      backdrop-filter: blur(40px) saturate(1.1);
      -webkit-backdrop-filter: blur(40px) saturate(1.1);
      will-change: opacity;
      /* Exit (base state = leaving .is-active): quicker than the enter. */
      transition: opacity 300ms cubic-bezier(0.23, 1, 0.32, 1);
      cursor: pointer;
    }

    .frost-overlay.is-active {
      opacity: 1;
      pointer-events: auto;
      /* Enter: across the cover flip, settling softly into the full blur. */
      transition: opacity 420ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* ── Stage ────────────────────────────────────────────────
       Fixed footprint = open spread (2 × page). Spine stays at
       horizontal center for closed cover AND open PageFlip, so
       open/close never shifts the book’s visual center.
       Sits above the frost so the book stays sharp.
       Clip when settled-open; stay visible while cover flaps so
       the hard cover isn’t trimmed by the stage box.
       ──────────────────────────────────────────────────────── */
    #stage {
      position: relative;
      z-index: 2;
      width: calc(var(--book-w) * 2);
      height: var(--book-h);
      flex-shrink: 0;
      /* Closed book 3D peek can extend slightly; clip only once open */
      overflow: visible;
    }

    body.is-book-open #stage {
      overflow: hidden;
      border-radius: 20px;
    }

    /* Cover flap open/close — let hard cover swing past spine into frost */
    body.is-cover-flipping #stage {
      overflow: visible !important;
    }

    /*
     * OPEN STAGING — split open-spread art under #book.
     * Left 50% OpenNotebookLeft + right 50% OpenNotebookRight, 0 gap.
     * Inside #book-wrapper so the hard cover curls over it and it never
     * peeks beside the closed CSS cover.
     * Visible while opening and while landed (is-notebook).
     * On close-to-cover: hide left immediately (is-hiding-left) so the
     * cover flap isn’t fighting the left bg.
     */
    #open-staging {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }

    body.is-book-opening #open-staging,
    #book-wrapper.is-notebook #open-staging {
      opacity: 1;
      visibility: visible;
    }

    /* Left half — OpenNotebookLeft (shown on land; cleared on close-to-cover) */
    .open-left-page-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      /* The cover board the sheets sit on. */
      background-color: #FF53C4;
      /* Match cover outer radius */
      border-radius: var(--cover-radius) 0 0 var(--cover-radius);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
    }

    /*
     * Landed open spread only.
     *
     * Nothing is painted on the left while the cover is still shut: a closed
     * book has nothing beside its cover, and pre-painting the left page there
     * made a cream leaf appear next to the cover before it had even begun to
     * turn. The cover IS the left page — it carries a cream verso, so it turns
     * onto paper and hands over to this one on landing without a colour
     * change. Pulled again on the way out, so the closing flap has a clear
     * left half to land on.
     */
    #book-wrapper.is-notebook:not(.is-hiding-left) .open-left-page-bg {
      opacity: 1;
      visibility: visible;
    }

    /* Right half — OpenNotebookRight (webp preferred; png via JS) */
    .open-right-page-bg {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      background-color: #FF53C4;
      border-radius: 0 20px 20px 0;
      overflow: hidden;
    }

    /*
     * ── CODED OPEN SPREAD ────────────────────────────────────────────────
     * Draws what OpenNotebookLeft/Right.webp used to: each half is the pink
     * cover board carrying a stack of sheets. Every sheet below the top page
     * is nudged towards the fore-edge, so the sliver of each one that escapes
     * the page above it lines up into the page block's edge — the same banding
     * the art had, but as real layers that shadow each other.
     *
     * Proportions are measured off the originals (2046x2639 per half): the
     * cover overhangs 3.85% of a half's width at the fore-edge, 0.95% of its
     * height above and 0.8% below, and the fore-edge band is ~3.4% wide.
     *
     * Drawn rather than decoded, so the spread is there on the first frame of
     * the cover flip instead of arriving after it.
     */
    .paper-stack {
      position: absolute;
      /* Top page's own box. The cover shows past it above and below; the sheets
         below fan out past it towards the fore-edge. */
      top: 1.3%;
      bottom: 1.7%;
      z-index: 0;
      pointer-events: none;
    }

    /* Fore-edge inset = cover overhang (3.85% / 3.9%) plus the band the stack's
       own edge fills (3.4% left, 2.6% right — the art is not quite symmetric). */
    .open-left-page-bg .paper-stack { left: 7.3%; right: 0; }
    .open-right-page-bg .paper-stack { right: 6.5%; left: 0; }

    /*
     * One sheet under the top page; --i is how deep it sits. Deeper sheets
     * stand slightly further out and slightly taller, which is what puts a
     * sliver of each along the fore-edge and a hairline along top and bottom.
     * The leading edge of each is drawn into its own background so the seam
     * stays a crisp sub-pixel line at any size.
     */
    .paper-sheet {
      position: absolute;
      top: calc(var(--i) * -0.0215%);
      bottom: calc(var(--i) * -0.0215%);
    }

    .open-left-page-bg .paper-sheet {
      right: 0;
      left: calc(var(--i) * -0.26%);
      border-radius: 12px 0 0 12px;
      background: linear-gradient(
        90deg,
        rgba(86, 68, 62, 0.34) 0 0.75px,
        #F2EDE7 0.75px
      );
    }

    .open-right-page-bg .paper-sheet {
      left: 0;
      right: calc(var(--i) * -0.195%);
      border-radius: 0 12px 12px 0;
      background: linear-gradient(
        270deg,
        rgba(86, 68, 62, 0.34) 0 0.75px,
        #F2EDE7 0.75px
      );
    }

    /*
     * The first page is glued to the inside of the cover, so it comes over
     * with it as one panel instead of being a separate leaf that turns after.
     * See .cover-verso below.
     */

    @media (prefers-reduced-motion: reduce) {
    }

    /* The page being read — hides all but the edge of the stack under it. */
    .paper-top {
      position: absolute;
      inset: 0;
      background: #FCF9F5;
      /* The dark seam where the block meets the cover beneath it. */
      box-shadow: 0 2.5px 3px rgba(48, 34, 32, 0.4);
    }

    .open-left-page-bg .paper-top { border-radius: 12px 0 0 12px; }
    .open-right-page-bg .paper-top { border-radius: 0 12px 12px 0; }

    /* ══════════════════════════════════════════════════════════
       CLOSED PHASE — Vault CSS 3D book (hover peek only)
       Sized to match one PageFlip page; parked on the RIGHT half
       of the stage (same as StPageFlip showCover cover).
       ══════════════════════════════════════════════════════════ */
    :root {
      /* Defaults; JS overwrites to stay in sync with PageFlip */
      --book-w: 320px;
      --book-h: 425px;
      /* Page-block thickness (Framer ref ≈ 28px between covers) */
      --book-depth: 28px;
      /*
       * Front-cover outer corner radius (spine side stays 0).
       * Closed CSS was 8px · PageFlip hard front was 20px · both ×1.4.
       */
      --cover-radius: 28px;
      --cover-radius-closed: 11.2px;
      --page-x: 0deg;
      --page-y: 38deg;
      --page-z: 0deg;
      --page-tx: -21px;
      --page-ty: 0px;
      --page-tz: 6px;
      /* Frost fades during cover flip-open; exit ~25% faster */
      --modal-ease: cubic-bezier(0.23, 1, 0.32, 1);
      --modal-enter: 400ms;
      --modal-exit: 195ms;
      /*
       * Message input: fade begins at 50% of frost enter.
       * delay = 400ms × 0.5 = 200ms (wired in JS as INPUT_SHOW_DELAY_MS).
       */
      /* 220ms -> 286ms (30% slower), then 150ms off. Exit is unchanged. */
      --input-fade: 136ms;
      --input-exit: 140ms;
      --input-ease: cubic-bezier(0.23, 1, 0.32, 1);
    }

    .book-wrap {
      position: absolute;
      inset: 0;
      perspective: 1200px;
      perspective-origin: 50% 50%;
      z-index: 2;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }

    /* In-plane tilt for the closed book, on top of its rotateY peek. The rest and
       hover states both carry it, so hovering only turns the cover -- the tilt
       itself never moves. Centre origin, so the book leans in place rather than
       swinging about its spine. Open state is unaffected: the wrapper is hidden
       once PageFlip takes over. */
    .book-wrap.is-closed {
      transform: rotate(5deg);
      transform-origin: 50% 50%;
    }

    .book-wrap.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      /* Instant handoff to PageFlip enter — no fade lag behind frost */
      transition: none;
    }

    .book {
      /* Spine at stage center — matches PageFlip cover (right page) */
      position: absolute;
      left: 50%;
      top: 0;
      width: var(--book-w);
      height: var(--book-h);
      transform-style: preserve-3d;
      transform-origin: left center;
      transform: rotateX(0deg) rotateY(-10deg);
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: pointer;
    }

    /* No ring: closing refocuses the book, and a flat outline on a 3D-rotated
       element draws as a stray pink frame. The focus peek (flap open) below
       still marks keyboard focus. */
    .book:focus-visible {
      outline: none;
    }

    .book-back {
      position: absolute;
      inset: 0;
      /* Flat back colour; the Book Back art is no longer used here. */
      background: #DF3EAB;
      /* Same outer corners as the front cover (spine left stays square). */
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
      transform: translateZ(calc(var(--book-depth) * -1));
      /* Hairline same-colour rim softens 3D raster “毛边” on the rotated edge. */
      outline: 1px solid #DF3EAB;
      outline-offset: -0.5px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow:
        0 28px 70px rgba(0,0,0,0.18),
        0 10px 28px rgba(0,0,0,0.12),
        0 0 0 0.75px #DF3EAB;
    }

    /*
     * Page block — Framer-inspired inner volume:
     * cream stack between covers, striped fore-edge + top edge,
     * and a few shelf faces so the closed book reads as many pages.
     * Does not alter .book / .book-cover rotation angles.
     */
    .book-pages {
      position: absolute;
      top: 7px;
      bottom: 7px;
      left: 3px;
      /* Stay inside the cover's outer radius so cream pages never peek
         past the rounded right edge at rest. */
      right: 12px;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    /* Closed at rest: no page-block fringe behind the cover. Hover/focus
       brings the stack back as the cover flaps open. */
    .book-wrap.is-closed .book:not(:hover):not(:focus-visible):not(.is-peek) .book-pages {
      opacity: 0;
    }

    /* Closed at rest there is no stroke round the book: the back board's rim
       goes and it keeps only its drop shadow. Both come back once the cover
       turns, when the back board is what shows behind it. */
    .book-wrap.is-closed .book:not(:hover):not(:focus-visible):not(.is-peek) .book-back {
      background: transparent;
      outline-color: transparent;
      box-shadow:
        0 28px 70px rgba(0,0,0,0.18),
        0 10px 28px rgba(0,0,0,0.12);
    }

    .book-pages-front {
      position: absolute;
      inset: 0;
      border-radius: 1px 5px 5px 1px;
      background:
        linear-gradient(90deg, #E359B4 0%, #FDF8F6 38%, #F7F0EC 100%);
      transform: translateZ(-2px);
      box-shadow:
        inset 5px 0 12px rgba(212, 0, 139, 0.14),
        inset -2px 0 6px rgba(0, 0, 0, 0.04);
    }

    /* Stacked sheet faces — subtle shelves between cover and back */
    .book-pages-shelf {
      position: absolute;
      top: 1px;
      bottom: 1px;
      left: 0;
      right: 0;
      border-radius: 1px 4px 4px 1px;
      background: linear-gradient(90deg, #EA80C5 0%, #FDF8F6 55%, #F5EEE9 100%);
      box-shadow: 0 0 0 0.5px rgba(212, 0, 139, 0.35);
      transform: translateZ(var(--shelf-z));
    }

    .book-pages-shelf:nth-child(2) { --shelf-z: -7px;  opacity: 0.95; }
    .book-pages-shelf:nth-child(3) { --shelf-z: -13px; opacity: 0.9; }
    .book-pages-shelf:nth-child(4) { --shelf-z: -19px; opacity: 0.85; }
    .book-pages-shelf:nth-child(5) { --shelf-z: -24px; opacity: 0.8; }

    /* Fore-edge (right) — page lines / layered paper block */
    .book-pages-edge {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 100%;
      width: var(--book-depth);
      transform-origin: left center;
      transform: rotateY(90deg);
      border-radius: 0 1px 1px 0;
      background-color: #F7F0EC;
      background-image:
        linear-gradient(
          90deg,
          rgba(212, 0, 139, 0.14) 0%,
          transparent 14%,
          transparent 86%,
          rgba(0, 0, 0, 0.07) 100%
        ),
        repeating-linear-gradient(
          90deg,
          #FDF8F6 0px,
          #FDF8F6 1.6px,
          #E8DDD6 1.6px,
          #E8DDD6 2.6px
        );
      box-shadow: inset 0 0 8px rgba(212, 0, 139, 0.1);
    }

    /* Top edge — same cream page-stack cue from above */
    .book-pages-top {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: var(--book-depth);
      transform-origin: center bottom;
      transform: rotateX(90deg);
      background-color: #F7F0EC;
      background-image:
        linear-gradient(180deg, rgba(0, 0, 0, 0.06) 0%, transparent 35%),
        repeating-linear-gradient(
          180deg,
          #FDF8F6 0px,
          #FDF8F6 1.6px,
          #E8DDD6 1.6px,
          #E8DDD6 2.6px
        );
    }

    .book-cover {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      /* Spine left (square) · outer right rounded */
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
    }

    .book-cover-face {
      position: absolute;
      inset: 0;
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      /* No rim, outline or inner shadow here. Cover.png carries its own rounded
         corners (~17px at this size, vs the box's 11.2px) and a hairline
         transparent strip down its right edge, so anything drawn on this box
         showed as a stray stroke outside the art when the cover turned: the
         outline/ring off its corners, the inset shadow through the strip. */
    }

    .book-cover-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
    }

    .book-cover-inner {
      position: absolute;
      inset: 0;
      /* Open / flipping cover verso — lighter pink than closed peek */
      background: #FF53C4;
      /* Same cover board shape in local space (spine at left) */
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
    }

    .book-right-page {
      position: absolute;
      /* One plain rectangle, full cover height, same outer radius as the cover. */
      top: 0;
      left: var(--book-w);
      width: 24px;
      height: var(--book-h);
      transform-origin: left center;
      /* Match front cover outer radius so the hover flap lines up. */
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
      /* No overflow clip: the flap has no children, and overflow:hidden + radius
         on a 3D-rotated layer is what rasterised its edges jagged. A hairline
         same-colour shadow gives the rotated edge an antialiased rim instead. */
      background: #D4008B;
      box-shadow: 0 0 0 0.75px #D4008B;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      opacity: 0;
      pointer-events: none;
    }

    .book-shadow {
      position: absolute;
      bottom: -14px;
      left: 10%;
      width: 80%;
      height: 28px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.10) 0%, transparent 70%);
      filter: blur(12px);
      transform: rotateX(90deg) translateZ(calc(var(--book-depth) * -1));
      pointer-events: none;
    }

    /* Vault hover peek — only while closed (not opening/open).
       Modest flap so more of the back reads without over-opening. */
    .book-wrap.is-closed .book:hover,
    .book-wrap.is-closed .book:focus-visible,
    .book-wrap.is-closed .book.is-peek {
      transform: rotateX(0deg) rotateY(-26deg);
    }

    .book-wrap.is-closed .book:hover .book-cover,
    .book-wrap.is-closed .book:focus-visible .book-cover,
    .book-wrap.is-closed .book.is-peek .book-cover {
      transform: rotateY(-16deg);
    }

    .book-wrap.is-closed .book:hover .book-right-page,
    .book-wrap.is-closed .book:focus-visible .book-right-page,
    .book-wrap.is-closed .book.is-peek .book-right-page {
      opacity: 1;
      background: #D4008B;
      transform:
        rotateX(var(--page-x))
        rotateY(var(--page-y))
        rotateZ(var(--page-z))
        translate3d(var(--page-tx), var(--page-ty), var(--page-tz));
      transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity 0.2s ease;
    }

    /* ══════════════════════════════════════════════════════════
       OPEN PHASE — StPageFlip guestbook
       Same stage box as the closed book (2 × page). No extra
       width/centering so the spine stays put across the swap.
       Face-on flat spread (no residual rotateY / book tilt).
       Enter: instant show on cover (no scale) → PageFlip flipNext.
       Exit: brief opacity fade after cover flip lands, then CSS book.
       ══════════════════════════════════════════════════════════ */
    #book-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 1;
      /* Contain PageFlip curl within the book footprint (guestbook pattern) */
      overflow: hidden;
      border-radius: 20px;
      perspective: none;
      will-change: opacity;
      /* Exit only — open motion is the cover flip, not a scale/fade */
      transition:
        opacity var(--modal-exit) var(--modal-ease),
        visibility var(--modal-exit);
    }

    #book-wrapper.is-visible {
      opacity: 1;
      visibility: visible;
      /*
       * Only the book itself takes clicks (see #book below). The wrapper is
       * inset:0, so with pointer-events:auto it swallowed every click in the
       * empty space around the book - including under the message bar, where
       * elementFromPoint returned #book-wrapper rather than the frost. Those
       * clicks never reached the frost's dismiss handler, so the host was
       * never told the book was closing and it went home late and
       * uncoordinated instead of shrinking into its slot. Clicks further out
       * to the left and right missed the wrapper and closed it correctly,
       * which is where the asymmetry came from.
       */
      pointer-events: none;
      z-index: 3;
      /* Instant appear at cover; flipNext is the open animation */
      transition: none;
    }

    /*
     * is-notebook = landed open spread (split halves live on #open-staging).
     * No full Open Notebook.webp on wrapper/#book — halves are the bg.
     */
    #book-wrapper.is-notebook {
      background-image: none;
    }

    #book-wrapper.is-visible #book {
      pointer-events: auto;
    }

    #book {
      position: relative;
      /* Above #open-staging — the static halves AND the leaves turning with the
         cover. The hard cover is the outermost surface of the book, so it is
         the last layer: nothing inside the block may paint over it. */
      z-index: 2;
      width: 100%;
      height: 100%;
      background: transparent;
      border-radius: 20px;
      overflow: hidden;
      transform: translateZ(0);
    }

    /*
     * Offscreen paint of both open-spread halves — forces decoded bitmaps
     * at display resolution before first open.
     */
    #notebook-paint-warm {
      position: fixed;
      left: -9999px;
      top: 0;
      display: flex;
      width: min(92vw, 900px);
      height: min(72vh, 640px);
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    #notebook-paint-warm .warm-left,
    #notebook-paint-warm .warm-right {
      flex: 1 1 50%;
      width: 50%;
      height: 100%;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* Nothing to pre-decode now that the spread is drawn in CSS; the node is
       kept so the rest of the open sequence keeps its element. */
    #notebook-paint-warm .warm-left {
      background-color: #FF53C4;
      border-radius: var(--cover-radius) 0 0 var(--cover-radius);
      overflow: hidden;
    }

    #notebook-paint-warm .warm-right {
      background-color: #FF53C4;
    }

    /* PageFlip parent fills the fixed stage — no autosize reflow */
    #book.stf__parent,
    #book .stf__wrapper {
      position: relative;
      display: block;
      box-sizing: border-box;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      min-width: 0 !important;
      min-height: 0 !important;
      padding-bottom: 0 !important;
      overflow: hidden !important;
      border-radius: 20px;
      transform: translateZ(0);
      background: transparent !important;
    }

    #book .stf__block {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      perspective: 2000px;
      /* No overflow clip on perspective node — wrappers above contain paint */
      border-radius: 20px;
      /* Keep transparent so #open-staging (spine + right page) shows through */
      background: transparent !important;
    }

    #book .stf__item {
      display: none;
      position: absolute;
      transform-style: preserve-3d;
    }

    /*
     * Kill PageFlip's gray slab / hard shadow bars. The soft inner/outer
     * shadows stay on: they are anchored to the moving fold, so the curl reads
     * darkest where the paper bends and fades out toward the lifted corner.
     */
    #book .stf__hardShadow,
    #book .stf__hardInnerShadow {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      background: none !important;
      filter: none !important;
    }

    /* While cover flaps — do not clip the swinging hard cover */
    body.is-cover-flipping #book-wrapper,
    body.is-cover-flipping #book,
    body.is-cover-flipping #book.stf__parent,
    body.is-cover-flipping #book .stf__wrapper {
      overflow: visible !important;
    }

    .page {
      background: transparent;
      overflow: hidden;
      position: relative;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-style: preserve-3d;
    }
    .page.--left  { border-radius: 20px 0 0 20px; }
    .page.--right { border-radius: 0 20px 20px 0; }
    .page[data-density="hard"] { border-radius: 20px; background: #FDF8F6; }

    /*
     * Hard cover = two faces (matches CSS .book-cover / .book-cover-inner).
     * PageFlip sets backface-visibility:hidden inline on the page — override
     * so the pink verso is visible when the cover rotates past 90°.
     */
    .page.page--hard-cover {
      background: transparent !important;
      overflow: visible !important;
      backface-visibility: visible !important;
      -webkit-backface-visibility: visible !important;
      transform-style: preserve-3d !important;
    }

    .page.page--hard-cover .cover-front,
    .page.page--hard-cover .cover-verso {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /*
     * Front cover (closed / right half): square on spine (LEFT),
     * radius only on outer RIGHT — 0 var(--cover-radius) var(--cover-radius) 0.
     */
    .page.page--hard-front,
    .page.page--hard-front[data-density="hard"] {
      border-radius: 0 var(--cover-radius) var(--cover-radius) 0;
    }

    .page.page--hard-front .cover-front {
      overflow: hidden;
      background: #FDF8F6;
      border-radius: 0 var(--cover-radius) var(--cover-radius) 0;
    }

    .page.page--hard-front .cover-front .cover-img,
    .page.page--hard-front .cover-front .cover-placeholder {
      border-radius: 0 var(--cover-radius) var(--cover-radius) 0;
    }

    .page.page--hard-cover .cover-verso {
      /*
       * Cover board. The page is stuck to it (::after) rather than following
       * as a loose leaf, so the whole panel — board plus paper — swings over
       * together and already matches the settled left half when it lands.
       */
      background: #FF53C4 !important;
      background-image: none !important;
      transform: rotateY(180deg);
      border-radius: var(--cover-radius);
      box-shadow: none;
    }

    /*
     * The page glued inside the cover. Same proportions as .paper-stack on the
     * settled left half — cover overhang 1.3% above, 1.7% below, 7.3% at the
     * fore-edge — and the same dotted paper as the inner pages, so the panel
     * the cover carries over is the page the spread lands on.
     */
    .page.page--hard-cover .cover-verso::after {
      content: '';
      position: absolute;
      top: 1.3%;
      bottom: 1.7%;
      left: 7.3%;
      right: 0;
      border-radius: 12px 0 0 12px;
      background-color: #FCF9F5;
      background-image: radial-gradient(#E0DDDB 1px, transparent 1px);
      background-size: 16px 16px;
      box-shadow: 0 2.5px 3px rgba(48, 34, 32, 0.4);
    }

    /*
     * CLICK-OPEN: binding (center) edges stay square.
     * Cover board front stays 0 R R 0 (spine LEFT in local space).
     * Once flapping / settled open, cover is the LEFT leaf → page + verso
     * use R 0 0 R (spine RIGHT square). Soft right page radii unchanged.
     */
    body.is-cover-flipping .page.page--hard-front,
    body.is-book-open .page.page--hard-front {
      border-radius: var(--cover-radius) 0 0 var(--cover-radius);
    }

    body.is-cover-flipping .page.page--hard-front .cover-verso,
    body.is-book-open .page.page--hard-front .cover-verso,
    body.is-book-opening .page.page--hard-front .cover-verso {
      border-radius: var(--cover-radius) 0 0 var(--cover-radius);
    }

    /* Front art never rounds the spine (left) edge */
    .page.page--hard-front .cover-front,
    .page.page--hard-front .cover-front .cover-img,
    body.is-cover-flipping .page.page--hard-front .cover-front,
    body.is-book-open .page.page--hard-front .cover-front {
      border-radius: 0 var(--cover-radius) var(--cover-radius) 0;
    }

    /*
     * COVER VERSO DURING OPEN CURL
     * PageFlip hard-flip pairs cover (rightPage) with page index 1
     * (flippingPage / .page--opening-right) as one board: page 1 IS the
     * visible backside past ~90°. Paint that leaf solid pink (#FF53C4) only —
     * no OpenNotebookRight, no beige hard fill, no dotted paper.
     * OpenNotebookRight stays on #open-staging (under the flap).
     * OpenNotebookLeft joins on flap land (split spread); cleared on close.
     * Radii match cover verso as left leaf: spine RIGHT square.
     */
    body.is-book-opening .page.page--opening-right,
    body.is-book-opening .page.page--opening-right.--hard,
    body.is-book-opening .page.page--opening-right.--soft {
      background: #FF53C4 !important;
      background-image: none !important;
      background-color: #FF53C4 !important;
      overflow: hidden;
      border-radius: var(--cover-radius) 0 0 var(--cover-radius);
    }

    body.is-book-opening .page.page--opening-right .entry-page-inner,
    body.is-book-opening .page.page--opening-right .ruled-lines,
    body.is-book-opening .page.page--opening-right .page-crease {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      background: transparent !important;
      background-image: none !important;
    }

    .cover-img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .entry-page-inner {
      position: absolute;
      inset: 12px 34px;
      background: #FDF8F6;
      border-radius: 20px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
    }

    .ruled-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(#E0DDDB 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .entries-list {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      container-type: inline-size;
    }

    /*
     * Every note size below is multiplied by --note-scale: 1 on desktop, 0.8
     * on tablet, 0.6 on phone (set at the end of this block), so the written
     * notes shrink as one on smaller books. Stickers are em-sized and follow.
     */
    .scatter-note {
      --note-scale: 1;
      position: absolute;
      max-width: min(220px, 42%);
      line-height: 1.15;
      font-family: 'Ugly Dave', cursive, sans-serif;
      /* Fluid type — shrinks on narrower page containers */
      font-size: calc(clamp(12px, 3.2vw, 14pt) * var(--note-scale));
      font-size: calc(clamp(12px, 5.5cqi, 14pt) * var(--note-scale));
      /* Black ink; meta sits gray via opacity below. */
      color: #1C1C1C;
      pointer-events: none;
      text-wrap: pretty;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      opacity: 0;
      transition: opacity 0.35s ease;
      transform-origin: center center;
    }

    .scatter-note.is-placed {
      opacity: 1;
    }

    .scatter-note .entry-message {
      display: inline;
      font-size: calc(clamp(12px, 3.2vw, 14pt) * var(--note-scale));
      font-size: calc(clamp(12px, 5.5cqi, 14pt) * var(--note-scale));
      /* The note's ink, set inline from the pen it was written with. */
      color: inherit;
    }

    .scatter-note .entry-line {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.18em;
    }

    .scatter-note .entry-meta {
      display: block;
      color: #6B6B6B;
      /* Same pen, lighter hand: black ink lands on the original #6B6B6B. */
      color: color-mix(in srgb, currentColor 66%, #FCF9F5);
      opacity: 1;
      font-size: calc(clamp(6px, 2.6vw, 10.5pt) * var(--note-scale));
      font-size: calc(clamp(6px, 4.4cqi, 10.5pt) * var(--note-scale));
    }

    /* Heart (Figma 2475:843), happy face (Figma 2475:844),
       sunglasses (Figma 2475:887), fire (Figma 2476:901), sparkle
       (Figma 2486:33), drawn at
       0.88 of those frames. The strokes are #F5F5F5, made for a dark
       tray; on the cream page they read as the same ink as the note. */
    /* Inline so stickers trail the last word, not the wrapped box's edge. */
    .scatter-note .entry-message-row {
      display: block;
    }

    .scatter-note .entry-stickers {
      display: inline-flex;
      align-items: flex-end;
      gap: 0.12em;
      pointer-events: none;
    }

    .scatter-note .entry-message + .entry-stickers {
      margin-left: 0.15em;
    }

    .scatter-note .entry-sticker {
      display: block;
      flex: none;
    }

    /* Stroke art as a mask; the fill is the note's ink (currentColor). */
    .scatter-note .entry-sticker-ink {
      display: block;
      flex: none;
      background-color: currentColor;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    /* Outer flame plus the inner tongue, in the frame's own offsets. */
    /* Frame and core offsets at STICKER_SCALE (0.04em) of the Figma values. */
    .scatter-note .entry-sticker--fire {
      position: relative;
      width: calc(15.4521em * 0.04);
      height: calc(19.9084em * 0.04);
    }

    .scatter-note .entry-sticker--fire .entry-sticker-ink {
      position: absolute;
      left: 0;
      top: 0;
    }

    .scatter-note .entry-sticker--fire .entry-sticker__fire-core {
      left: calc(2.6497em * 0.04);
      top: calc(9.335em * 0.04);
    }

    /* Desktop: message + name/date 4px smaller than the fluid caps above. */
    @media (min-width: 1200px) {
      .scatter-note,
      .scatter-note .entry-message {
        font-size: clamp(8px, calc(5.5cqi - 4px), calc(14pt - 4px));
      }
      .scatter-note .entry-meta {
        font-size: clamp(6px, calc(4.4cqi - 4px), calc(10.5pt - 4px));
      }
    }

    /*
     * Message size by word count (data-size, set in createScatterNote):
     * under 4 words 22px, 4–12 words 16px, 13+ words 12px. Those are the sizes
     * on the 372px-wide desktop page; cqi keeps the same ratio on smaller books.
     * The px floors sit low on purpose: higher floors (13 / 10 / 8px) held the
     * text up on small books until a note took half the page width and only
     * one column fitted. Proportional text keeps two (or three) to a row.
     */
    /* Stickers share the message size; their em dimensions scale from it. */
    .scatter-note[data-size="lg"] .entry-message,
    .scatter-note[data-size="lg"] .entry-stickers {
      font-size: calc(clamp(7px, calc(22cqi / 3.72), 22px) * var(--note-scale));
    }
    .scatter-note[data-size="md"] .entry-message,
    .scatter-note[data-size="md"] .entry-stickers {
      font-size: calc(clamp(6px, calc(16cqi / 3.72), 16px) * var(--note-scale));
    }
    .scatter-note[data-size="sm"] .entry-message,
    .scatter-note[data-size="sm"] .entry-stickers {
      font-size: calc(clamp(5px, calc(12cqi / 3.72), 12px) * var(--note-scale));
    }

    /* Name + date, 2px smaller on tablet and phone. On phone the old size was
       already sitting on its 10px floor, so the floor drops to 8px with it —
       otherwise the clamp would swallow the change. */
    @media (max-width: 1199.98px) {
      .scatter-note .entry-meta {
        font-size: calc(clamp(5px, calc(2.6vw - 2px), calc(10.5pt - 2px)) * var(--note-scale));
        font-size: calc(clamp(5px, calc(4.4cqi - 2px), calc(10.5pt - 2px)) * var(--note-scale));
      }
    }

    /* Written notes, all text together: 80% on tablet. */
    @media (max-width: 1199.98px) {
      .scatter-note { --note-scale: 0.8; }
    }

    /*
     * Phone: a spread on a ~390px screen leaves each page ~180px wide, so the
     * proportional sizes above land at 3-6px. Phones get readable floors
     * instead. Bigger notes fit fewer to a page; the relayout passes the
     * overflow on to the next page, so the book just runs a few pages longer.
     */
    @media (max-width: 640px) {
      .scatter-note { --note-scale: 1; }
      .scatter-note[data-size="lg"] .entry-message,
      .scatter-note[data-size="lg"] .entry-stickers {
        font-size: max(13px, calc(22cqi / 3.72));
      }
      .scatter-note[data-size="md"] .entry-message,
      .scatter-note[data-size="md"] .entry-stickers {
        font-size: max(11px, calc(16cqi / 3.72));
      }
      .scatter-note[data-size="sm"] .entry-message,
      .scatter-note[data-size="sm"] .entry-stickers {
        font-size: max(10px, calc(12cqi / 3.72));
      }
      .scatter-note .entry-meta {
        font-size: max(8px, calc(4.4cqi - 2px));
      }
      .scatter-note {
        max-width: min(220px, 48%);
      }
    }

    /* ── Message input (Figma 1551:28298 / 1551:28306) ─────────── */
    /*
     * Dock keeps a fixed collapsed footprint in the body flex column.
     * The pill is absolutely pinned inside
     * .message-dock-slot so the name row expands downward into empty
     * space without shifting #stage / frost / book.
     */
    .message-dock {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(480pt, 92vw);
      /* Placeholder and typed message share this size. */
      --message-size: 14px;
      /* Chosen pen. Typed message and name pick this up; placeholders stay gray. */
      --ink: #1C1C1C;
      flex-shrink: 0;
      margin-top: -8px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.97);
      transform-origin: top center;
      transition:
        opacity var(--input-exit) var(--input-ease),
        transform var(--input-exit) var(--input-ease),
        visibility var(--input-exit);
    }

    .message-dock.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1);
      transition:
        opacity var(--input-fade) var(--input-ease),
        transform var(--input-fade) var(--input-ease),
        visibility var(--input-fade);
    }

    /* One-line arrow-key tip, pinned 32px above the bottom of the viewport.
       A sibling of the dock rather than inside it: the dock's scale transform
       would turn position: fixed into dock-relative. It shows with the dock.
       Hidden while body lacks .show-page-turn-hint (SHOW_PAGE_TURN_HINT in JS). */
    body:not(.show-page-turn-hint) .page-turn-hint {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .page-turn-hint {
      display: none;
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity var(--input-exit) var(--input-ease),
        visibility var(--input-exit);
      margin: 0;
      padding: 0;
      /* Light on the gray frost, in step with the glass key caps. */
      color: rgb(255 255 255 / 0.6);
      font-family: 'Switzer', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
      white-space: nowrap;
      text-align: center;
      pointer-events: none;
      user-select: none;
    }

    .page-turn-hint.is-visible {
      opacity: 1;
      visibility: visible;
      transition:
        opacity var(--input-fade) var(--input-ease),
        visibility var(--input-fade);
    }

    /* Narrow windows: the hint and the ink-picker menu (lower left) would
       share a line, so the hint steps up above the menu. */
    @media (max-width: 880px) {
      .page-turn-hint { bottom: 64px; }
    }

    /* Pens racked along the bottom edge: lift the hint clear of them. */
    body.has-bottom-pens .page-turn-hint { bottom: 96px; }

    /* Tablet and phone: no keyboard hint (and no tap hint) at all. */
    @media (max-width: 1199.98px) {
      .page-turn-hint { display: none !important; }
    }

    body.is-docked .page-turn-hint {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    .page-turn-hint--touch { display: block; }

    @media (hover: hover) and (pointer: fine) {
      .page-turn-hint--touch { display: none; }
      .page-turn-hint--desktop {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
    }

    .page-turn-hint__key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 4px;
      /* Glass caps, the same recipe as the Bar ink picker: a light white wash
         over a small blur, a white rim, a bright top lip and a dark hairline. */
      border: 1px solid rgb(255 255 255 / 0.30);
      background:
        linear-gradient(180deg, rgb(255 255 255 / 0.18) 0%, rgb(255 255 255 / 0.10) 100%);
      backdrop-filter: blur(6px) saturate(1.8);
      -webkit-backdrop-filter: blur(6px) saturate(1.8);
      color: rgb(255 255 255 / 0.9);
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / 0.35),
        0 0 0 0.5px rgb(0 0 0 / 0.16),
        0 1px 2px rgb(0 0 0 / 0.18);
      /* Real buttons: clicking a key cap turns the page like the arrow key. */
      padding: 0;
      font: inherit;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 120ms ease-out,
        background-color 120ms ease-out,
        color 120ms ease-out;
    }

    /* Word key (esc): same cap, sized to its label instead of square. */
    .page-turn-hint__key--text {
      width: auto;
      padding: 0 4px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0;
    }

    @media (hover: hover) and (pointer: fine) {
      .page-turn-hint__key:hover {
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.28) 0%, rgb(255 255 255 / 0.18) 100%);
        color: #FFFFFF;
      }
    }
    .page-turn-hint__key:active { transform: scale(0.9); }
    .page-turn-hint__key:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }

    .page-turn-hint__key svg {
      display: block;
      width: 10px;
      height: 10px;
    }

    .message-dock-slot {
      position: relative;
      width: 100%;
      /* At least the original row, and taller when the active step needs it. */
      height: max(42pt, calc(var(--message-size) * 1.15 + 18px));
    }

    .message-error {
      display: none;
      margin: 8px 4px 0;
      padding: 0 6px;
      color: #B42318;
      font-family: 'Switzer', sans-serif;
      font-size: 12px;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .message-dock.is-error .message-error {
      display: block;
    }

    .message-dock.is-error .message-pill {
      animation: message-pill-shake 0.42s ease;
    }

    @keyframes message-pill-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(2px); }
    }

    /* Pill = column of row1 (message+send) + optional name row */
    .message-pill {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 16px;
      overflow: hidden;
      background: #F4F4F4;
      box-shadow: none;
      cursor: text;
      transform-origin: top center;
    }

    .message-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      /* Grows with the active type step so 32px display type is not clipped.
         The 42pt floor keeps the resting pill at its original height. */
      height: max(42pt, calc(var(--message-size) * 1.15 + 18px));
      min-height: max(42pt, calc(var(--message-size) * 1.15 + 18px));
      box-sizing: border-box;
      padding: 8px calc(16pt - 8px) 8px 14px; /* 8px off each side from the original 16pt / 22px */
    }

    /* Collapse/expand name row (~180ms) without fighting dock fade */
    .message-name-slot {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
      transition:
        grid-template-rows 180ms ease,
        opacity 180ms ease;
    }

    .message-pill.is-hinted .message-name-slot {
      grid-template-rows: 1fr;
      opacity: 1;
      pointer-events: auto;
    }

    .message-name-inner {
      overflow: hidden;
      min-height: 0;
      border-top: 1px solid rgba(28, 28, 28, 0.08);
    }

    /* Left edge matches .message-row, so the name field and its placeholder
       line up with the message input above rather than sitting indented. */
    .message-name-row {
      /* 4px -> 2px top/bottom: tighten gap to the divider and pill edge. */
      padding: 2px calc(16pt - 8px) 2px 14px;
    }

    #name-input,
    .name-native {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 10px 0 12px;
      height: fit-content;
      border: 0;
      outline: none;
      background: transparent;
      /* Same pen as the message, at 80% of that ink. */
      color: color-mix(in srgb, var(--ink, #1C1C1C) 80%, transparent);
      font-family: 'Switzer', sans-serif;
      /* 4px under the message line above it. */
      font-size: calc(var(--message-size) - 4px);
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    #name-input::placeholder,
    .name-native::placeholder {
      color: #A3A3A3;
      opacity: 1;
    }

    .message-field-wrap {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      min-height: 28px;
    }

    .message-mirror {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 28px;
      font-family: 'Switzer', sans-serif;
      /* Placeholder and typed text are the same element, so this sets both. */
      font-size: var(--message-size);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.01em;
      white-space: pre;
      overflow: hidden;
      pointer-events: none;
    }

    .message-mirror-text {
      color: var(--ink, #1C1C1C);
    }

    .message-mirror.is-empty .message-mirror-text {
      color: #A3A3A3;
    }

    /* Hide placeholder while focused+empty so caret sits at left-most start */
    .message-pill.is-empty.is-focused .message-mirror-text {
      display: none;
    }

    .message-caret {
      display: none;
      flex: 0 0 auto;
      width: 1.25pt; /* thinner stroke than the original 2pt */
      height: 1.05em;
      margin-left: 2pt; /* Figma typed state: 2pt gap after last glyph */
      background: var(--ink, #1C1C1C);
      border-radius: 999px; /* round/pill caps on short vertical bar */
      animation: message-caret-blink 1.05s steps(1, end) infinite;
    }

    .message-pill.is-focused .message-caret {
      display: inline-block;
    }

    .message-pill.is-empty.is-focused .message-caret {
      margin-left: 0;
    }

    /*
     * Touch: the field takes focus as the book opens (keyboard up by default),
     * so the placeholder stays put while it is empty and the caret blinks in
     * front of it. The 16px input size that stops iOS zooming sits after the
     * base #message-input rule below, which would otherwise win.
     */
    @media (pointer: coarse) {
      .message-pill.is-empty.is-focused .message-mirror-text { display: inline; }
      .message-pill.is-empty.is-focused .message-caret {
        order: -1;
        margin: 0 2pt 0 0;
      }
    }

    @keyframes message-caret-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    #message-input,
    .message-native {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-family: 'Switzer', sans-serif;
      font-size: var(--message-size); /* keep in step with .message-mirror */
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    /*
     * Touch: native inputs at 16px or more. iOS zooms the whole page into any
     * field under 16px on focus, and once zoomed the keyboard fit gives up, so
     * the book and field end up cropped. This has to come after the base rules
     * above (same specificity, so the later one wins). The message field's own
     * text is transparent (the mirror draws it), so only the name field
     * visibly grows.
     */
    @media (pointer: coarse) {
      #message-input,
      .message-native { font-size: max(16px, var(--message-size)); }
    }

    #message-input::selection,
    .message-native::selection {
      background: rgba(28, 28, 28, 0.14);
      color: transparent;
    }

    /* Send = 28pt hit area; 16pt icon only (no empty fill); 16pt from pill right */
    .message-send {
      flex: 0 0 auto;
      width: 28pt;
      height: 28pt;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 8pt;
      background: transparent;
      color: #DDDDDD; /* empty: icon only, no fill */
      cursor: default;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.18s ease, color 0.18s ease;
    }

    /* Ready = the plane's stroke goes black. No filled chip behind it — the
       icon alone carries the state. */
    .message-send.is-ready,
    .message-pill.is-ready .message-send {
      background: transparent;
      /* The plane is drawn in the chosen pen, like the message it sends. */
      color: var(--ink, #1C1C1C);
      cursor: pointer;
    }

    .message-send.is-ready:hover,
    .message-send.is-ready:focus-visible,
    .message-pill.is-ready .message-send:hover,
    .message-pill.is-ready .message-send:focus-visible {
      background: transparent;
      color: var(--ink, #1C1C1C);
      outline: none;
    }

    .message-send:disabled {
      cursor: default;
    }

    .send-icon {
      display: block;
      width: 16pt;
      height: 16pt;
      overflow: visible;
      pointer-events: none;
    }

    .send-plane {
      transform-origin: 70% 30%;
      transform-box: fill-box;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .send-trail {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      stroke-dasharray: 2 2;
      stroke-dashoffset: 40;
      opacity: 0;
      transform: translate(-3px, 3px);
      transition:
        opacity 0.3s ease,
        transform 0.3s ease,
        stroke-dashoffset 0.3s ease;
    }

    .message-send.is-ready:hover .send-plane,
    .message-send.is-animating .send-plane {
      transform: translate(3px, -3px) scale(0.8);
    }

    .message-send.is-ready:hover .send-trail,
    .message-send.is-animating .send-trail {
      opacity: 1;
      transform: translate(0, 0);
      stroke-dashoffset: 0;
      transition:
        opacity 0.55s ease 0.1s,
        transform 0.55s ease 0.1s,
        stroke-dashoffset 0.55s ease 0.1s;
    }

    /* ── Pen rack ──────────────────────────────────────────────
     * Ink picker parked on the viewport's right edge; only the tip, collar
     * and a sliver of barrel show. Two layers so motions never fight:
     *   .pen        enter/exit slide (staggered by --i)
     *   .pen__body  hover / selected nudge (--nudge)
     * Pen art is 640x78.
     */
    .pen-rack {
      --pen-h: 24px;
      --pen-w: calc(var(--pen-h) * 640 / 78);
      --pen-peek: 58px;
      --pen-hover: 10px;
      --pen-selected: 26px;
      --pen-gap: 14px;
      --pen-enter: 460ms;
      --pen-enter-delay: 80ms;
      --pen-enter-stagger: 35ms;
      --pen-enter-ease: cubic-bezier(0.32, 0.72, 0, 1);
      --pen-exit: 220ms;
      --pen-exit-stagger: 12ms;
      --pen-exit-ease: cubic-bezier(0.23, 1, 0.32, 1);
      position: fixed;
      top: 50%;
      right: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: var(--pen-gap);
      transform: translateY(-50%);
      pointer-events: none;
      visibility: hidden;
      /* Stay painted until the last pen has slid off. */
      transition: visibility 0s linear calc(var(--pen-exit) + 6 * var(--pen-exit-stagger));
    }

    .pen-rack.is-visible {
      visibility: visible;
      /* bottom: rides on top of the phone keyboard (fitAboveKeyboard). */
      transition:
        visibility 0s,
        bottom 280ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    .pen {
      position: relative;
      display: block;
      flex: 0 0 auto;
      width: var(--pen-w);
      height: var(--pen-h);
      /* Hang the barrel off the edge so only --pen-peek is on screen. */
      margin-right: calc(var(--pen-peek) - var(--pen-w));
      padding: 0;
      border: 0;
      background: none;
      appearance: none;
      cursor: pointer;
      pointer-events: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transform: translateX(calc(var(--pen-peek) + var(--pen-selected) + 12px));
      transition: transform var(--pen-exit) var(--pen-exit-ease)
        calc(var(--i) * var(--pen-exit-stagger));
    }

    .pen-rack.is-visible .pen {
      pointer-events: auto;
      transform: translateX(0);
      transition: transform var(--pen-enter) var(--pen-enter-ease)
        calc(var(--pen-enter-delay) + var(--i) * var(--pen-enter-stagger));
    }

    .pen__body {
      --nudge: 0px;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      transform: translateX(calc(var(--nudge) * -1));
      transition: transform 260ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    .pen__body img {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 1px 1.5px rgb(0 0 0 / 0.14));
    }

    @media (hover: hover) and (pointer: fine) {
      .pen:hover .pen__body { --nudge: var(--pen-hover); }
    }
    .pen:focus-visible .pen__body { --nudge: var(--pen-hover); }
    .pen:active .pen__body { --nudge: calc(var(--pen-hover) + 6px); }
    /* After hover/active so the chosen pen never slides back on press. */
    .pen[aria-pressed="true"] .pen__body { --nudge: var(--pen-selected); }

    .pen:focus-visible .pen__body {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }

    @media (max-width: 1199.98px) {
      .pen-rack {
        --pen-h: 20px;
        --pen-peek: 46px;
        --pen-hover: 8px;
        --pen-selected: 20px;
        --pen-gap: 12px;
      }
    }

    /*
     * No room beside the book (phones, portrait tablets): the same rack turned
     * a quarter, so the pens rise from the bottom edge pointing up and every
     * slide/nudge above becomes vertical. Black stays leftmost.
     */
    .pen-rack.is-bottom {
      top: auto;
      right: auto;
      bottom: 0;
      left: calc(50% - (7 * var(--pen-h) + 6 * var(--pen-gap)) / 2 - var(--pen-peek));
      flex-direction: column-reverse;
      transform: rotate(90deg);
      transform-origin: 100% 100%;
    }

    @media (prefers-reduced-motion: reduce) {
      .pen,
      .pen-rack.is-visible .pen {
        transform: none;
        opacity: 0;
        transition: opacity 150ms ease;
      }
      .pen-rack.is-visible .pen { opacity: 1; }
      .pen-rack { transition: visibility 0s linear 150ms; }
      .pen__body { transition-duration: 0.01ms; }
    }

    /* ── Ink picker variants ──────────────────────────────────
     * body[data-pen-ui] picks how ink is chosen (switched from the menu in the
     * lower left):
     *   rack  pens peeking in from the right edge (above)
     *   tile  one pen in a tile left of the message field; hover it for swatches
     *   bar   the same rack, held inside a bar on the right
     */
    :root {
      --pe-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --pe-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    }

    body[data-pen-ui="tile"] .pen-rack { display: none; }

    /* ── tile: pen tile + swatches ── */
    .pen-picker { display: none; }

    body[data-pen-ui="tile"] .message-dock {
      /* Square, and as tall as the resting message row. */
      --tile-w: 42pt;
      --tile-gap: 12px;
      width: min(calc(480pt + var(--tile-w) + var(--tile-gap)), 92vw);
    }

    body[data-pen-ui="tile"] .message-pill {
      left: calc(var(--tile-w) + var(--tile-gap));
      width: calc(100% - var(--tile-w) - var(--tile-gap));
    }

    body[data-pen-ui="tile"] .message-error {
      margin-left: calc(var(--tile-w) + var(--tile-gap) + 4px);
    }

    /* Tile and bar: placeholders take a light wash of the chosen ink (typed
       text already uses it everywhere). Black lands on the original #A3A3A3. */
    body[data-pen-ui="tile"] .message-mirror.is-empty .message-mirror-text,
    body[data-pen-ui="bar"] .message-mirror.is-empty .message-mirror-text {
      color: color-mix(in srgb, var(--ink, #1C1C1C) 38%, #F4F4F4);
      transition: color 200ms ease;
    }
    /* Idle send plane too: a faint wash of the ink (black lands near the
       original #DDDDDD). */
    body[data-pen-ui="tile"] .message-send:not(.is-ready),
    body[data-pen-ui="bar"] .message-send:not(.is-ready) {
      color: color-mix(in srgb, var(--ink, #1C1C1C) 14%, #F4F4F4);
    }
    body[data-pen-ui="tile"] #name-input::placeholder,
    body[data-pen-ui="tile"] .name-native::placeholder,
    body[data-pen-ui="bar"] #name-input::placeholder,
    body[data-pen-ui="bar"] .name-native::placeholder {
      color: color-mix(in srgb, var(--ink, #1C1C1C) 38%, #F4F4F4);
    }

    body[data-pen-ui="tile"] .pen-picker {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      width: var(--tile-w);
      height: var(--tile-w);
      --swatch: calc(var(--tile-w) * 0.27);
    }

    /* Bridges the gaps between tile and swatches so the pointer can travel
       across them without the picker closing. layoutSwatches() sizes it to
       whichever dot layout is showing. */
    .pen-picker.is-open::before {
      content: '';
      position: absolute;
      left: var(--bridge-l, -12px);
      top: var(--bridge-t, -12px);
      right: var(--bridge-r, -12px);
      bottom: var(--bridge-b, -12px);
    }

    .pen-picker__tile {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 16px;
      overflow: hidden;
      background: #F4F4F4;
      --well-inset: calc(var(--tile-w) * 0.068);
      appearance: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 160ms var(--pe-ease-out);
    }

    /* Hover / open: a tinted inner well, inset from the tile's edge (Figma).
       The frame itself stays #F4F4F4; the pen stands in front of the well. */
    .pen-picker__tile::before {
      content: '';
      position: absolute;
      inset: var(--well-inset);
      border-radius: calc(16px - var(--well-inset));
      background: color-mix(in srgb, var(--ink, #1C1C1C) 10%, #F4F4F4);
      opacity: 0;
      transform: scale(0.94);
      transition:
        opacity 150ms ease,
        transform 200ms var(--pe-ease-out),
        background-color 200ms ease;
    }

    .pen-picker.is-open .pen-picker__tile::before {
      opacity: 1;
      transform: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .pen-picker__tile:hover::before {
        opacity: 1;
        transform: none;
      }
    }

    .pen-picker__tile:active { transform: scale(0.96); }

    .pen-picker__tile:focus-visible {
      box-shadow: 0 0 0 2px #FFFFFF;
    }

    /* Pen stands up out of the tile's bottom edge: tip, collar and a little
       barrel. Two layers so the hover lift and the colour swap never fight:
         .pen-picker__pen  lift on hover / open
         .pen-picker__ink  one per ink; a swap crossfades a new layer in (WAAPI) */
    .pen-picker__pen {
      --pen-t: calc(var(--tile-w) * 0.26);
      position: absolute;
      top: 29%;
      left: calc(50% - var(--pen-t) / 2);
      width: var(--pen-t);
      height: calc(var(--pen-t) * 640 / 78);
      pointer-events: none;
      transition: transform 260ms var(--pe-ease-out);
    }

    .pen-picker.is-open .pen-picker__pen { transform: translateY(-3px); }

    @media (hover: hover) and (pointer: fine) {
      .pen-picker__tile:hover .pen-picker__pen { transform: translateY(-3px); }
    }

    .pen-picker__ink {
      position: absolute;
      inset: 0;
    }

    .pen-picker__ink img {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--pen-t) * 640 / 78);
      height: var(--pen-t);
      /* Pen art points left; a quarter turn stands the tip up. */
      transform: translate(-50%, -50%) rotate(90deg);
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(1px 0 1.5px rgb(0 0 0 / 0.14));
    }

    /* Swatches wrap the tile's bottom-left corner. Each one starts tucked
       toward the tile (--x/--y are fractions of the tile), so they grow out of
       the pen rather than out of nowhere. */
    .pen-picker__swatches {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .pen-picker__swatch {
      --x: var(--wx);
      --y: var(--wy);
      position: absolute;
      top: calc(var(--tile-w) * var(--y) - var(--swatch) / 2);
      left: calc(var(--tile-w) * var(--x) - var(--swatch) / 2);
      width: var(--swatch);
      height: var(--swatch);
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--swatch-c);
      appearance: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      /* Faint rim so the black swatch still reads on the dark backdrop. */
      box-shadow:
        0 0 0 0 #FFFFFF,
        inset 0 0 0 1px rgb(255 255 255 / 0.16),
        0 1px 2px rgb(0 0 0 / 0.2);
      opacity: 0;
      pointer-events: none;
      /* Resting a quarter of the way in toward the tile, slightly shrunk:
         enough to read as growing out of the pen, small enough that the dots
         drift into place instead of shooting out. */
      transform:
        translate(
          calc((0.5 - var(--x)) * var(--tile-w) * var(--pull, 0.25)),
          calc((0.5 - var(--y)) * var(--tile-w) * var(--pull, 0.25))
        )
        scale(0.8);
      /* Exit: faster than the enter, tucking back in the reverse order
         (purple first, black last) so the fan folds rather than blinks out. */
      transition:
        opacity 160ms ease calc((5 - var(--i)) * 12ms),
        transform 200ms var(--pe-ease-out) calc((5 - var(--i)) * 12ms),
        box-shadow 160ms ease;
    }

    .pen-picker.is-open .pen-picker__swatch {
      opacity: 1;
      pointer-events: auto;
      transform: none;
      /* Enter: staggered round the corner, black first, on the softer
         drawer curve so each dot glides the last few pixels. */
      transition:
        opacity 200ms ease calc(var(--i) * 24ms),
        transform 300ms cubic-bezier(0.32, 0.72, 0, 1) calc(var(--i) * 24ms),
        box-shadow 160ms ease;
    }

    /* Toggled again mid-motion (pointer slips out and back in): retarget
       straight away. A stagger delay here would freeze each dot where it is
       before it turns round. */
    .pen-picker.is-quick .pen-picker__swatch {
      transition-delay: 0ms !important;
    }

    .pen-picker__swatch[aria-pressed="true"] {
      box-shadow:
        0 0 0 2px #FFFFFF,
        inset 0 0 0 1px rgb(255 255 255 / 0),
        0 1px 3px 2px rgb(0 0 0 / 0.18);
    }

    @media (hover: hover) and (pointer: fine) {
      .pen-picker.is-open .pen-picker__swatch:hover {
        transform: scale(1.14);
        transition:
          opacity 180ms ease,
          transform 160ms var(--pe-ease-out),
          box-shadow 160ms ease;
      }
    }

    .pen-picker.is-open .pen-picker__swatch:active {
      transform: scale(0.92);
      transition:
        transform 100ms var(--pe-ease-out),
        box-shadow 160ms ease;
    }

    .pen-picker__swatch:focus-visible {
      box-shadow:
        0 0 0 2px #FFFFFF,
        0 0 0 4px rgb(255 255 255 / 0.4);
    }

    @media (max-width: 1199.98px) {
      body[data-pen-ui="tile"] .message-dock { --tile-w: 48px; }
      .pen-picker__tile { border-radius: 12px; }
      .pen-picker__tile::before { border-radius: calc(12px - var(--well-inset)); }
    }

    @media (min-height: 1400px) {
      body[data-pen-ui="tile"] .message-dock { --tile-w: 64pt; }
    }

    /* Tray layout: the dots stand in a pill that rises out of the tile, same
       fill and corner as the tile. It grows up from the tile (origin-aware)
       and the dots follow, nearest first. */
    .pen-picker__tray {
      display: none;
      position: absolute;
      left: 0;
      bottom: calc(100% + var(--tray-gap, 8px));
      width: var(--tile-w);
      height: var(--tray-h, 160px);
      border-radius: 16px;
      background: #F4F4F4;
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.18);
      transform-origin: bottom center;
      opacity: 0;
      transform: translateY(6px) scale(0.92);
      transition:
        opacity 140ms ease 60ms,
        transform 180ms var(--pe-ease-out) 60ms;
    }

    body[data-swatch-layout="tray"] .pen-picker__tray { display: block; }

    .pen-picker.is-open .pen-picker__tray {
      opacity: 1;
      transform: none;
      transition:
        opacity 160ms ease,
        transform 260ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    .pen-picker.is-quick .pen-picker__tray { transition-delay: 0ms; }

    @media (max-width: 1199.98px) {
      .pen-picker__tray { border-radius: 12px; }
    }

    /* A white ring vanishes on the light tray: ring in the dot's own colour,
       with a tray-coloured gap. */
    body[data-swatch-layout="tray"] .pen-picker__swatch[aria-pressed="true"] {
      box-shadow:
        0 0 0 2px #F4F4F4,
        inset 0 0 0 1px rgb(255 255 255 / 0),
        0 0 0 3.5px var(--swatch-c);
    }

    @media (prefers-reduced-motion: reduce) {
      .pen-picker__tray,
      .pen-picker.is-open .pen-picker__tray { transform: none; }
      .pen-picker__swatch,
      .pen-picker.is-open .pen-picker__swatch {
        transform: none;
        transition: opacity 150ms ease, box-shadow 150ms ease;
      }
      .pen-picker__pen,
      .pen-picker.is-open .pen-picker__pen { transform: none; }
    }

    /* ── bar: the rack, contained ──
     * Same pens, sizes and nudges as the rack. The bar clips the barrels, so
     * pens slide in and out of its right edge, and the bar itself floats in
     * from the right. */
    body[data-pen-ui="bar"] .pen-rack {
      /* Tighter than the rack: tip and collar show, the chosen pen only
         leans out a little, and the bar hugs that. */
      --pen-peek: 50px;
      --pen-hover: 5px;
      --pen-selected: 12px;
      --bar-pad-y: 14px;
      --bar-pad-l: 8px;
      --bar-inset: 16px;
      --bar-w: calc(var(--pen-peek) + var(--pen-selected) + var(--bar-pad-l));
      right: var(--bar-inset);
      box-sizing: border-box;
      width: var(--bar-w);
      padding: var(--bar-pad-y) 0;
      /* Same corner as the message field. Clear glass: the fill is a light
         white wash (and a small sheen top-left) over a light blur, so what's
         behind shows through. The edges do the work of making the bar
         apparent: a crisp white rim, a bright top lip, a glint along
         the bottom, and a dark hairline outside so it holds its shape on
         light backgrounds too. */
      border-radius: 16px;
      background:
        radial-gradient(110% 50% at 15% 0%, rgb(255 255 255 / 0.16) 0%, rgb(255 255 255 / 0) 65%),
        linear-gradient(180deg, rgb(255 255 255 / 0.14) 0%, rgb(255 255 255 / 0.08) 100%);
      backdrop-filter: blur(6px) saturate(1.8);
      -webkit-backdrop-filter: blur(6px) saturate(1.8);
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.38),
        inset 0 1.5px 0 rgb(255 255 255 / 0.7),
        inset 0 -1px 0 rgb(255 255 255 / 0.22),
        0 0 0 0.5px rgb(0 0 0 / 0.12),
        0 6px 20px rgb(0 0 0 / 0.10);
      overflow: hidden;
      opacity: 0;
      translate: 16px 0;
      transition:
        opacity 180ms ease 60ms,
        translate 240ms var(--pen-exit-ease) 60ms,
        visibility 0s linear 300ms;
    }

    /* No backdrop blur available: fall back to a near-solid fill. */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      body[data-pen-ui="bar"] .pen-rack { background: rgb(244 244 244 / 0.92); }
    }

    body[data-pen-ui="bar"] .pen-rack.is-visible {
      opacity: 1;
      translate: 0 0;
      transition:
        opacity 220ms ease,
        translate 420ms var(--pen-enter-ease),
        visibility 0s,
        bottom 280ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* No room beside the book: the bar turns a quarter like the rack and sits
       on the bottom edge as a tray, rounded only on the side facing up. */
    body[data-pen-ui="bar"] .pen-rack.is-bottom {
      --bar-pad-l: 6px;
      right: auto;
      bottom: 0;
      border-radius: 16px 0 0 16px;
      left: calc(50% - (7 * var(--pen-h) + 6 * var(--pen-gap) + 2 * var(--bar-pad-y)) / 2 - var(--bar-w));
      translate: 0 16px;

    @media (max-width: 1199.98px) {
      body[data-pen-ui="bar"] .pen-rack {
        --pen-peek: 42px;
        --pen-hover: 4px;
        --pen-selected: 10px;
        border-radius: 12px;
      }
      body[data-pen-ui="bar"] .pen-rack.is-bottom { border-radius: 12px 0 0 12px; }
    }

    /* Phone tray: about 0.8x the tablet bar all round, and shorter still — less
       of each pen pokes up (30px peek, 7px lean for the chosen one), so the tray
       stands ~42px tall instead of ~58px and ~192px wide instead of ~240px. */
    @media (max-width: 640px) {
      body[data-pen-ui="bar"] .pen-rack.is-bottom {
        --pen-h: 16px;
        --pen-gap: 10px;
        --pen-peek: 30px;
        --pen-hover: 3px;
        --pen-selected: 7px;

    /* ── Close (top right of the viewport) ──
     * Same corner close as the Other Designs preview (.od-preview__close in

     * wash and corner sheen over a small blur, white rim, bright top lip and a
     * dark hairline. Fades in with the message dock, out faster than it came. */
    .book-close {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 6;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;

        radial-gradient(110% 50% at 15% 0%, rgb(255 255 255 / 0.16) 0%, rgb(255 255 255 / 0) 65%),

      backdrop-filter: blur(6px) saturate(1.8);
      -webkit-backdrop-filter: blur(6px) saturate(1.8);
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.38),
        inset 0 1.5px 0 rgb(255 255 255 / 0.7),
        inset 0 -1px 0 rgb(255 255 255 / 0.22),
        0 0 0 0.5px rgb(0 0 0 / 0.12),
        0 6px 20px rgb(0 0 0 / 0.10);
      /* The backdrop is only a blur of the page, so the X follows the page's
         theme: dark over the light page, white at night (body.host-dark). */
      color: #1C1C1C;
      appearance: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      visibility: visible;
      pointer-events: auto;
      transition:
        opacity 200ms ease,
        scale 120ms ease,
        visibility 0s;
    }

    body.host-dark .book-close { color: #FFFFFF; }

    body.is-docked .book-close {
      opacity: 0 !important;
      visibility: hidden !important;

    @media (hover: hover) and (pointer: fine) {

      .book-close:hover {

    }

    .pen-ui-menu__trigger:active { transform: scale(0.97); }

    .pen-ui-menu__trigger:focus-visible {

    }

    .pen-ui-menu__label { color: #8A8A8A; font-weight: 400; }

    .pen-ui-menu__list {

        visibility 0s linear 120ms;
    }

    .pen-ui-menu.is-open .pen-ui-menu__list {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;

      transition:

        transform 220ms var(--pe-ease-out),
        visibility 0s;
    }

    .pen-ui-menu__item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 0;
      padding: 8px 10px 8px 8px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #1C1C1C;
      font: inherit;
      text-align: left;
      appearance: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:

    .pen-ui-menu__num {

      align-items: center;

    /* Phones: the bottom edge belongs to the pens (and the keyboard), so the

    @media (max-width: 640px) {
      .pen-ui-menu { left: 12px; top: 12px; bottom: auto; translate: 0 -6px; }
      .pen-ui-menu.is-visible { translate: 0 0; }
      .pen-ui-menu__list {
        top: calc(100% + 8px);
        bottom: auto;
        transform-origin: top left;
        transform: translateY(-4px) scale(0.96);
        max-height: calc(100vh - 80px);
        overflow-y: auto;
      }

      .pen-ui-menu.is-open .pen-ui-menu__chevron { transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pen-ui-menu,
      .pen-ui-menu.is-visible { translate: 0 0; }
      .pen-ui-menu__list,
      .pen-ui-menu.is-open .pen-ui-menu__list { transform: none; }
    }

    .page-crease { position: absolute; top: 0; bottom: 0; width: 34px; pointer-events: none; z-index: 20; }
    .page-crease.left  { left: 0;  background: linear-gradient(to right, rgba(0,0,0,0.05), transparent); }
    .page-crease.right { right: 0; background: linear-gradient(to left,  rgba(0,0,0,0.05), transparent); }

    .cover-placeholder {
      position: absolute; inset: 0;
      display: none;
      background: #FDF8F6;
    }

    @media (max-width: 640px) {
      :root {
        --book-depth: 22px;
        --page-tx: -18px;
      }
      .book-right-page { width: 18px; }

    /* Tall viewports: larger default input field */
    @media (min-height: 1400px) {
      .message-dock-slot,
      .message-row {
        height: max(64pt, calc(var(--message-size) * 1.15 + 18px));

      }
    }

    @media (prefers-reduced-motion: reduce) {
      .book,
      .book-cover,
      .book-right-page,
      .book-wrap,
      .frost-overlay,
      .message-dock,
      .message-name-slot,
      .send-plane,
      .send-trail {
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;
      }

      .message-caret {
        animation: none !important;
        opacity: 1;
      }

      #book-wrapper {
        transition:
          opacity 0.01ms ease-out !important,
          visibility 0.01ms !important;
      }
    }
  
    /* --- Tablet / mobile -------------------------------------------------
     * Tighter corners all round — the desktop radii read as very round once
     * the book and the dock are this small — and a shorter input row.
     */

      :root,
      .book-cover {
        --cover-radius: 16px;
        --cover-radius-closed: 10px;
      }

      #book,
      #book-wrapper,
      #book.stf__parent,
      #book .stf__block,
      body.is-book-open #stage,
      .page[data-density="hard"] {

      }

      .page.--right { border-radius: 0 16px 16px 0; }

      .message-pill { border-radius: 12px; }

        background-size: var(--dot-step) var(--dot-step);
