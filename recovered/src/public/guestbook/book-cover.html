<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestbook</title>
  <!-- The open spread is drawn in CSS (see "CODED OPEN SPREAD"), so only the
       two hard covers are bitmaps worth preloading. -->
  <link rel="preload" as="image" href="Assets/Images/Cover.png?v=1789859770" />
  <link rel="preload" as="image" href="Assets/Images/Back.png?v=1785618989" />
  <meta name="guestbook-cloud" content="auto" />
  <script src="vendor/page-flip.browser.js"></script>
  <script src="js/notePlacement.js"></script>
  <script src="js/profanityFilter.js"></script>
  <script src="js/guestbookApi.js?v=20260921-persist"></script>
  <style>
    @font-face {
      font-family: 'Ugly Dave';
      src: url('Assets/Fonts/ugly-dave/ugly-dave.woff2') format('woff2'),
           url('Assets/Fonts/ugly-dave/ugly-dave.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Switzer';
      src: url('Assets/Fonts/switzer/Switzer-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Switzer';
      src: url('Assets/Fonts/switzer/Switzer-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 3.5vh, 36px);
      padding: 28px 16px 40px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      font-family: 'Ugly Dave', cursive, sans-serif;
    }

    /*
     * Frost scrim — lighter/airier than envelope dark gray
     * (blur still matches About me: blur(14px) saturate(1.05))
     * Soft warm gray-cream tint — more presence than a cream wash,
     * lighter than the original heavy gray dim.
     * Click dismisses like the envelope frost overlay.
     *
     * Full blur always on the layer; opacity 0→1 reads as
     * “blur fading in” and overlaps the cover flip-open (~600ms).
     */
    .frost-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(60, 55, 52, 0.10) 0%,
        rgba(40, 38, 36, 0.14) 100%
      );
      backdrop-filter: blur(21px) saturate(1.05);
      -webkit-backdrop-filter: blur(21px) saturate(1.05);
      will-change: opacity;
      /* Exit: ~25% faster than enter (base state = leaving .is-active) */
      transition: opacity var(--modal-exit) var(--modal-ease);
      cursor: pointer;
    }

    .frost-overlay.is-active {
      opacity: 1;
      pointer-events: auto;
      /* Enter: fades across the start of the cover flip */
      transition: opacity var(--modal-enter) var(--modal-ease);
    }

    /* ── Stage ────────────────────────────────────────────────
       Fixed footprint = open spread (2 × page). Spine stays at
       horizontal center for closed cover AND open PageFlip, so
       open/close never shifts the book’s visual center.
       Sits above the frost so the book stays sharp.
       Clip when settled-open; stay visible while cover flaps so
       the hard cover isn’t trimmed by the stage box.
       ──────────────────────────────────────────────────────── */
    #stage {
      position: relative;
      z-index: 2;
      width: calc(var(--book-w) * 2);
      height: var(--book-h);
      flex-shrink: 0;
      /* Closed book 3D peek can extend slightly; clip only once open */
      overflow: visible;
    }

    body.is-book-open #stage {
      overflow: hidden;
      border-radius: 20px;
    }

    /* Cover flap open/close — let hard cover swing past spine into frost */
    body.is-cover-flipping #stage {
      overflow: visible !important;
    }

    /*
     * OPEN STAGING — split open-spread art under #book.
     * Left 50% OpenNotebookLeft + right 50% OpenNotebookRight, 0 gap.
     * Inside #book-wrapper so the hard cover curls over it and it never
     * peeks beside the closed CSS cover.
     * Visible while opening and while landed (is-notebook).
     * On close-to-cover: hide left immediately (is-hiding-left) so the
     * cover flap isn’t fighting the left bg.
     */
    #open-staging {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }

    body.is-book-opening #open-staging,
    #book-wrapper.is-notebook #open-staging {
      opacity: 1;
      visibility: visible;
    }

    /* Left half — OpenNotebookLeft (shown on land; cleared on close-to-cover) */
    .open-left-page-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      /* The cover board the sheets sit on. */
      background-color: #FF53C4;
      /* Match cover outer radius */
      border-radius: var(--cover-radius) 0 0 var(--cover-radius);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
    }

    /*
     * Landed open spread only.
     *
     * Nothing is painted on the left while the cover is still shut: a closed
     * book has nothing beside its cover, and pre-painting the left page there
     * made a cream leaf appear next to the cover before it had even begun to
     * turn. The cover IS the left page — it carries a cream verso, so it turns
     * onto paper and hands over to this one on landing without a colour
     * change. Pulled again on the way out, so the closing flap has a clear
     * left half to land on.
     */
    #book-wrapper.is-notebook:not(.is-hiding-left) .open-left-page-bg {
      opacity: 1;
      visibility: visible;
    }

    /* Right half — OpenNotebookRight (webp preferred; png via JS) */
    .open-right-page-bg {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      background-color: #FF53C4;
      border-radius: 0 20px 20px 0;
      overflow: hidden;
    }

    /*
     * ── CODED OPEN SPREAD ────────────────────────────────────────────────
     * Draws what OpenNotebookLeft/Right.webp used to: each half is the pink
     * cover board carrying a stack of sheets. Every sheet below the top page
     * is nudged towards the fore-edge, so the sliver of each one that escapes
     * the page above it lines up into the page block's edge — the same banding
     * the art had, but as real layers that shadow each other.
     *
     * Proportions are measured off the originals (2046x2639 per half): the
     * cover overhangs 3.85% of a half's width at the fore-edge, 0.95% of its
     * height above and 0.8% below, and the fore-edge band is ~3.4% wide.
     *
     * Drawn rather than decoded, so the spread is there on the first frame of
     * the cover flip instead of arriving after it.
     */
    .paper-stack {
      position: absolute;
      /* Top page's own box. The cover shows past it above and below; the sheets
         below fan out past it towards the fore-edge. */
      top: 1.3%;
      bottom: 1.7%;
      z-index: 0;
      pointer-events: none;
    }

    /* Fore-edge inset = cover overhang (3.85% / 3.9%) plus the band the stack's
       own edge fills (3.4% left, 2.6% right — the art is not quite symmetric). */
    .open-left-page-bg .paper-stack { left: 7.3%; right: 0; }
    .open-right-page-bg .paper-stack { right: 6.5%; left: 0; }

    /*
     * One sheet under the top page; --i is how deep it sits. Deeper sheets
     * stand slightly further out and slightly taller, which is what puts a
     * sliver of each along the fore-edge and a hairline along top and bottom.
     * The leading edge of each is drawn into its own background so the seam
     * stays a crisp sub-pixel line at any size.
     */
    .paper-sheet {
      position: absolute;
      top: calc(var(--i) * -0.0215%);
      bottom: calc(var(--i) * -0.0215%);
    }

    .open-left-page-bg .paper-sheet {
      right: 0;
      left: calc(var(--i) * -0.26%);
      border-radius: 12px 0 0 12px;
      background: linear-gradient(
        90deg,
        rgba(86, 68, 62, 0.34) 0 0.75px,
        #F2EDE7 0.75px
      );
    }

    .open-right-page-bg .paper-sheet {
      left: 0;
      right: calc(var(--i) * -0.195%);
      border-radius: 0 12px 12px 0;
      background: linear-gradient(
        270deg,
        rgba(86, 68, 62, 0.34) 0 0.75px,
        #F2EDE7 0.75px
      );
    }

    /*
     * The first page is glued to the inside of the cover, so it comes over
     * with it as one panel instead of being a separate leaf that turns after.
     * See .cover-verso below.
     */

    @media (prefers-reduced-motion: reduce) {
    }

    /* The page being read — hides all but the edge of the stack under it. */
    .paper-top {
      position: absolute;
      inset: 0;
      background: #FCF9F5;
      /* The dark seam where the block meets the cover beneath it. */
      box-shadow: 0 2.5px 3px rgba(48, 34, 32, 0.4);
    }

    .open-left-page-bg .paper-top { border-radius: 12px 0 0 12px; }
    .open-right-page-bg .paper-top { border-radius: 0 12px 12px 0; }

    /* ══════════════════════════════════════════════════════════
       CLOSED PHASE — Vault CSS 3D book (hover peek only)
       Sized to match one PageFlip page; parked on the RIGHT half
       of the stage (same as StPageFlip showCover cover).
       ══════════════════════════════════════════════════════════ */
    :root {
      /* Defaults; JS overwrites to stay in sync with PageFlip */
      --book-w: 320px;
      --book-h: 425px;
      /* Page-block thickness (Framer ref ≈ 28px between covers) */
      --book-depth: 28px;
      /*
       * Front-cover outer corner radius (spine side stays 0).
       * Closed CSS was 8px · PageFlip hard front was 20px · both ×1.4.
       */
      --cover-radius: 28px;
      --cover-radius-closed: 11.2px;
      --page-x: 0deg;
      --page-y: 38deg;
      --page-z: 0deg;
      --page-tx: -21px;
      --page-ty: 0px;
      --page-tz: 6px;
      /* Frost fades during cover flip-open; exit ~25% faster */
      --modal-ease: cubic-bezier(0.23, 1, 0.32, 1);
      --modal-enter: 400ms;
      --modal-exit: 195ms;
      /*
       * Message input: fade begins at 50% of frost enter.
       * delay = 400ms × 0.5 = 200ms (wired in JS as INPUT_SHOW_DELAY_MS).
       */
      /* 220ms -> 286ms (30% slower), then 150ms off. Exit is unchanged. */
      --input-fade: 136ms;
      --input-exit: 140ms;
      --input-ease: cubic-bezier(0.23, 1, 0.32, 1);
    }

    .book-wrap {
      position: absolute;
      inset: 0;
      perspective: 1200px;
      perspective-origin: 50% 50%;
      z-index: 2;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }

    /* In-plane tilt for the closed book, on top of its rotateY peek. The rest and
       hover states both carry it, so hovering only turns the cover -- the tilt
       itself never moves. Centre origin, so the book leans in place rather than
       swinging about its spine. Open state is unaffected: the wrapper is hidden
       once PageFlip takes over. */
    .book-wrap.is-closed {
      transform: rotate(5deg);
      transform-origin: 50% 50%;
    }

    .book-wrap.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      /* Instant handoff to PageFlip enter — no fade lag behind frost */
      transition: none;
    }

    .book {
      /* Spine at stage center — matches PageFlip cover (right page) */
      position: absolute;
      left: 50%;
      top: 0;
      width: var(--book-w);
      height: var(--book-h);
      transform-style: preserve-3d;
      transform-origin: left center;
      transform: rotateX(0deg) rotateY(-10deg);
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: pointer;
    }

    /* No ring: closing refocuses the book, and a flat outline on a 3D-rotated
       element draws as a stray pink frame. The focus peek (flap open) below
       still marks keyboard focus. */
    .book:focus-visible {
      outline: none;
    }

    .book-back {
      position: absolute;
      inset: 0;
      /* Flat back colour; the Book Back art is no longer used here. */
      background: #DF3EAB;
      /* Same outer corners as the front cover (spine left stays square). */
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
      transform: translateZ(calc(var(--book-depth) * -1));
      /* Hairline same-colour rim softens 3D raster “毛边” on the rotated edge. */
      outline: 1px solid #DF3EAB;
      outline-offset: -0.5px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow:
        0 28px 70px rgba(0,0,0,0.18),
        0 10px 28px rgba(0,0,0,0.12),
        0 0 0 0.75px #DF3EAB;
    }

    /*
     * Page block — Framer-inspired inner volume:
     * cream stack between covers, striped fore-edge + top edge,
     * and a few shelf faces so the closed book reads as many pages.
     * Does not alter .book / .book-cover rotation angles.
     */
    .book-pages {
      position: absolute;
      top: 7px;
      bottom: 7px;
      left: 3px;
      /* Stay inside the cover's outer radius so cream pages never peek
         past the rounded right edge at rest. */
      right: 12px;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    /* Closed at rest: no page-block fringe behind the cover. Hover/focus
       brings the stack back as the cover flaps open. */
    .book-wrap.is-closed .book:not(:hover):not(:focus-visible):not(.is-peek) .book-pages {
      opacity: 0;
    }

    /* Closed at rest there is no stroke round the book: the back board's rim
       goes and it keeps only its drop shadow. Both come back once the cover
       turns, when the back board is what shows behind it. */
    .book-wrap.is-closed .book:not(:hover):not(:focus-visible):not(.is-peek) .book-back {
      background: transparent;
      outline-color: transparent;
      box-shadow:
        0 28px 70px rgba(0,0,0,0.18),
        0 10px 28px rgba(0,0,0,0.12);
    }

    .book-pages-front {
      position: absolute;
      inset: 0;
      border-radius: 1px 5px 5px 1px;
      background:
        linear-gradient(90deg, #E359B4 0%, #FDF8F6 38%, #F7F0EC 100%);
      transform: translateZ(-2px);
      box-shadow:
        inset 5px 0 12px rgba(212, 0, 139, 0.14),
        inset -2px 0 6px rgba(0, 0, 0, 0.04);
    }

    /* Stacked sheet faces — subtle shelves between cover and back */
    .book-pages-shelf {
      position: absolute;
      top: 1px;
      bottom: 1px;
      left: 0;
      right: 0;
      border-radius: 1px 4px 4px 1px;
      background: linear-gradient(90deg, #EA80C5 0%, #FDF8F6 55%, #F5EEE9 100%);
      box-shadow: 0 0 0 0.5px rgba(212, 0, 139, 0.35);
      transform: translateZ(var(--shelf-z));
    }

    .book-pages-shelf:nth-child(2) { --shelf-z: -7px;  opacity: 0.95; }
    .book-pages-shelf:nth-child(3) { --shelf-z: -13px; opacity: 0.9; }
    .book-pages-shelf:nth-child(4) { --shelf-z: -19px; opacity: 0.85; }
    .book-pages-shelf:nth-child(5) { --shelf-z: -24px; opacity: 0.8; }

    /* Fore-edge (right) — page lines / layered paper block */
    .book-pages-edge {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 100%;
      width: var(--book-depth);
      transform-origin: left center;
      transform: rotateY(90deg);
      border-radius: 0 1px 1px 0;
      background-color: #F7F0EC;
      background-image:
        linear-gradient(
          90deg,
          rgba(212, 0, 139, 0.14) 0%,
          transparent 14%,
          transparent 86%,
          rgba(0, 0, 0, 0.07) 100%
        ),
        repeating-linear-gradient(
          90deg,
          #FDF8F6 0px,
          #FDF8F6 1.6px,
          #E8DDD6 1.6px,
          #E8DDD6 2.6px
        );
      box-shadow: inset 0 0 8px rgba(212, 0, 139, 0.1);
    }

    /* Top edge — same cream page-stack cue from above */
    .book-pages-top {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: var(--book-depth);
      transform-origin: center bottom;
      transform: rotateX(90deg);
      background-color: #F7F0EC;
      background-image:
        linear-gradient(180deg, rgba(0, 0, 0, 0.06) 0%, transparent 35%),
        repeating-linear-gradient(
          180deg,
          #FDF8F6 0px,
          #FDF8F6 1.6px,
          #E8DDD6 1.6px,
          #E8DDD6 2.6px
        );
    }

    .book-cover {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      /* Spine left (square) · outer right rounded */
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
    }

    .book-cover-face {
      position: absolute;
      inset: 0;
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      /* No rim, outline or inner shadow here. Cover.png carries its own rounded
         corners (~17px at this size, vs the box's 11.2px) and a hairline
         transparent strip down its right edge, so anything drawn on this box
         showed as a stray stroke outside the art when the cover turned: the
         outline/ring off its corners, the inset shadow through the strip. */
    }

    .book-cover-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
    }

    .book-cover-inner {
      position: absolute;
      inset: 0;
      /* Open / flipping cover verso — lighter pink than closed peek */
      background: #FF53C4;
      /* Same cover board shape in local space (spine at left) */
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
    }

    .book-right-page {
      position: absolute;
      /* One plain rectangle, full cover height, same outer radius as the cover. */
      top: 0;
      left: var(--book-w);
      width: 24px;
      height: var(--book-h);
      transform-origin: left center;
      /* Match front cover outer radius so the hover flap lines up. */
      border-radius: 0 var(--cover-radius-closed) var(--cover-radius-closed) 0;
      /* No overflow clip: the flap has no children, and overflow:hidden + radius
         on a 3D-rotated layer is what rasterised its edges jagged. A hairline
         same-colour shadow gives the rotated edge an antialiased rim instead. */
      background: #D4008B;
      box-shadow: 0 0 0 0.75px #D4008B;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      opacity: 0;
      pointer-events: none;
    }

    .book-shadow {
      position: absolute;
      bottom: -14px;
      left: 10%;
      width: 80%;
      height: 28px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.10) 0%, transparent 70%);
      filter: blur(12px);
      transform: rotateX(90deg) translateZ(calc(var(--book-depth) * -1));
      pointer-events: none;
    }

    /* Vault hover peek — only while closed (not opening/open).
       Modest flap so more of the back reads without over-opening. */
    .book-wrap.is-closed .book:hover,
    .book-wrap.is-closed .book:focus-visible,
    .book-wrap.is-closed .book.is-peek {
      transform: rotateX(0deg) rotateY(-26deg);
    }

    .book-wrap.is-closed .book:hover .book-cover,
    .book-wrap.is-closed .book:focus-visible .book-cover,
    .book-wrap.is-closed .book.is-peek .book-cover {
      transform: rotateY(-16deg);
    }

    .book-wrap.is-closed .book:hover .book-right-page,
    .book-wrap.is-closed .book:focus-visible .book-right-page,
    .book-wrap.is-closed .book.is-peek .book-right-page {
      opacity: 1;
      background: #D4008B;
      transform:
        rotateX(var(--page-x))
        rotateY(var(--page-y))
        rotateZ(var(--page-z))
        translate3d(var(--page-tx), var(--page-ty), var(--page-tz));
      transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity 0.2s ease;
    }

    /* ══════════════════════════════════════════════════════════
       OPEN PHASE — StPageFlip guestbook
       Same stage box as the closed book (2 × page). No extra
       width/centering so the spine stays put across the swap.
       Face-on flat spread (no residual rotateY / book tilt).
       Enter: instant show on cover (no scale) → PageFlip flipNext.
       Exit: brief opacity fade after cover flip lands, then CSS book.
       ══════════════════════════════════════════════════════════ */
    #book-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 1;
      /* Contain PageFlip curl within the book footprint (guestbook pattern) */
      overflow: hidden;
      border-radius: 20px;
      perspective: none;
      will-change: opacity;
      /* Exit only — open motion is the cover flip, not a scale/fade */
      transition:
        opacity var(--modal-exit) var(--modal-ease),
        visibility var(--modal-exit);
    }

    #book-wrapper.is-visible {
      opacity: 1;
      visibility: visible;
      /*
       * Only the book itself takes clicks (see #book below). The wrapper is
       * inset:0, so with pointer-events:auto it swallowed every click in the
       * empty space around the book - including under the message bar, where
       * elementFromPoint returned #book-wrapper rather than the frost. Those
       * clicks never reached the frost's dismiss handler, so the host was
       * never told the book was closing and it went home late and
       * uncoordinated instead of shrinking into its slot. Clicks further out
       * to the left and right missed the wrapper and closed it correctly,
       * which is where the asymmetry came from.
       */
      pointer-events: none;
      z-index: 3;
      /* Instant appear at cover; flipNext is the open animation */
      transition: none;
    }

    /*
     * is-notebook = landed open spread (split halves live on #open-staging).
     * No full Open Notebook.webp on wrapper/#book — halves are the bg.
     */
    #book-wrapper.is-notebook {
      background-image: none;
    }

    #book-wrapper.is-visible #book {
      pointer-events: auto;
    }

    #book {
      position: relative;
      /* Above #open-staging — the static halves AND the leaves turning with the
         cover. The hard cover is the outermost surface of the book, so it is
         the last layer: nothing inside the block may paint over it. */
      z-index: 2;
      width: 100%;
      height: 100%;
      background: transparent;
      border-radius: 20px;
      overflow: hidden;
      transform: translateZ(0);
    }

    /*
     * Offscreen paint of both open-spread halves — forces decoded bitmaps
     * at display resolution before first open.
     */
    #notebook-paint-warm {
      position: fixed;
      left: -9999px;
      top: 0;
      display: flex;
      width: min(92vw, 900px);
      height: min(72vh, 640px);
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    #notebook-paint-warm .warm-left,
    #notebook-paint-warm .warm-right {
      flex: 1 1 50%;
      width: 50%;
      height: 100%;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* Nothing to pre-decode now that the spread is drawn in CSS; the node is
       kept so the rest of the open sequence keeps its element. */
    #notebook-paint-warm .warm-left {
      background-color: #FF53C4;
      border-radius: var(--cover-radius) 0 0 var(--cover-radius);
      overflow: hidden;
    }

    #notebook-paint-warm .warm-right {
      background-color: #FF53C4;
    }

    /* PageFlip parent fills the fixed stage — no autosize reflow */
    #book.stf__parent,
    #book .stf__wrapper {
      position: relative;
      display: block;
      box-sizing: border-box;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      min-width: 0 !important;
      min-height: 0 !important;
      padding-bottom: 0 !important;
      overflow: hidden !important;
      border-radius: 20px;
      transform: translateZ(0);
      background: transparent !important;
    }

    #book .stf__block {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      perspective: 2000px;
      /* No overflow clip on perspective node — wrappers above contain paint */
      border-radius: 20px;
      /* Keep transparent so #open-staging (spine + right page) shows through */
      background: transparent !important;
    }

    #book .stf__item {
      display: none;
      position: absolute;
      transform-style: preserve-3d;
    }

    /*
     * Kill PageFlip's gray slab / hard shadow bars. The soft inner/outer
     * shadows stay on: they are anchored to the moving fold, so the curl reads
     * darkest where the paper bends and fades out toward the lifted corner.
     */
    #book .stf__hardShadow,
    #book .stf__hardInnerShadow {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      background: none !important;
      filter: none !important;
    }

    /* While cover flaps — do not clip the swinging hard cover */
    body.is-cover-flipping #book-wrapper,
    body.is-cover-flipping #book,
    body.is-cover-flipping #book.stf__parent,
    body.is-cover-flipping #book .stf__wrapper {
      overflow: visible !important;
    }

    .page {
      background: transparent;
      overflow: hidden;
      position: relative;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-style: preserve-3d;
    }
    .page.--left  { border-radius: 20px 0 0 20px; }
    .page.--right { border-radius: 0 20px 20px 0; }
    .page[data-density="hard"] { border-radius: 20px; background: #FDF8F6; }

    /*
     * Hard cover = two faces (matches CSS .book-cover / .book-cover-inner).
     * PageFlip sets backface-visibility:hidden inline on the page — override
     * so the pink verso is visible when the cover rotates past 90°.
     */
    .page.page--hard-cover {
      background: transparent !important;
      overflow: visible !important;
      backface-visibility: visible !important;
      -webkit-backface-visibility: visible !important;
      transform-style: preserve-3d !important;
    }

    .page.page--hard-cover .cover-front,
    .page.page--hard-cover .cover-verso {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /*
     * Front cover (closed / right half): square on spine (LEFT),
     * radius only on outer RIGHT — 0 var(--cover-radius) var(--cover-radius) 0.
     */
    .page.page--hard-front,
    .page.page--hard-front[data-density="hard"] {
      border-radius: 0 var(--cover-radius) var(--cover-radius) 0;
    }

    .page.page--hard-front .cover-front {
      overflow: hidden;
      background: #FDF8F6;
      border-radius: 0 var(--cover-radius) var(--cover-radius) 0;
    }

    .page.page--hard-front .cover-front .cover-img,
    .page.page--hard-front .cover-front .cover-placeholder {
      border-radius: 0 var(--cover-radius) var(--cover-radius) 0;
    }

    .page.page--hard-cover .cover-verso {
      /*
       * Cover board. The page is stuck to it (::after) rather than following
       * as a loose leaf, so the whole panel — board plus paper — swings over
       * together and already matches the settled left half when it lands.
       */
      background: #FF53C4 !important;
      background-image: none !important;
      transform: rotateY(180deg);
      border-radius: var(--cover-radius);
      box-shadow: none;
    }

    /*
     * The page glued inside the cover. Same proportions as .paper-stack on the
     * settled left half — cover overhang 1.3% above, 1.7% below, 7.3% at the
     * fore-edge — and the same dotted paper as the inner pages, so the panel
     * the cover carries over is the page the spread lands on.
     */
    .page.page--hard-cover .cover-verso::after {
      content: '';
      position: absolute;
      top: 1.3%;
      bottom: 1.7%;
      left: 7.3%;
      right: 0;
      border-radius: 12px 0 0 12px;
      background-color: #FCF9F5;
      background-image: radial-gradient(#E0DDDB 1px, transparent 1px);
      background-size: 16px 16px;
      box-shadow: 0 2.5px 3px rgba(48, 34, 32, 0.4);
    }

    /*
     * CLICK-OPEN: binding (center) edges stay square.
     * Cover board front stays 0 R R 0 (spine LEFT in local space).
     * Once flapping / settled open, cover is the LEFT leaf → page + verso
     * use R 0 0 R (spine RIGHT square). Soft right page radii unchanged.
     */
    body.is-cover-flipping .page.page--hard-front,
    body.is-book-open .page.page--hard-front {
      border-radius: var(--cover-radius) 0 0 var(--cover-radius);
    }

    body.is-cover-flipping .page.page--hard-front .cover-verso,
    body.is-book-open .page.page--hard-front .cover-verso,
    body.is-book-opening .page.page--hard-front .cover-verso {
      border-radius: var(--cover-radius) 0 0 var(--cover-radius);
    }

    /* Front art never rounds the spine (left) edge */
    .page.page--hard-front .cover-front,
    .page.page--hard-front .cover-front .cover-img,
    body.is-cover-flipping .page.page--hard-front .cover-front,
    body.is-book-open .page.page--hard-front .cover-front {
      border-radius: 0 var(--cover-radius) var(--cover-radius) 0;
    }

    /*
     * COVER VERSO DURING OPEN CURL
     * PageFlip hard-flip pairs cover (rightPage) with page index 1
     * (flippingPage / .page--opening-right) as one board: page 1 IS the
     * visible backside past ~90°. Paint that leaf solid pink (#FF53C4) only —
     * no OpenNotebookRight, no beige hard fill, no dotted paper.
     * OpenNotebookRight stays on #open-staging (under the flap).
     * OpenNotebookLeft joins on flap land (split spread); cleared on close.
     * Radii match cover verso as left leaf: spine RIGHT square.
     */
    body.is-book-opening .page.page--opening-right,
    body.is-book-opening .page.page--opening-right.--hard,
    body.is-book-opening .page.page--opening-right.--soft {
      background: #FF53C4 !important;
      background-image: none !important;
      background-color: #FF53C4 !important;
      overflow: hidden;
      border-radius: var(--cover-radius) 0 0 var(--cover-radius);
    }

    body.is-book-opening .page.page--opening-right .entry-page-inner,
    body.is-book-opening .page.page--opening-right .ruled-lines,
    body.is-book-opening .page.page--opening-right .page-crease {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      background: transparent !important;
      background-image: none !important;
    }

    .cover-img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .entry-page-inner {
      position: absolute;
      inset: 12px 34px;
      background: #FDF8F6;
      border-radius: 20px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
    }

    .ruled-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(#E0DDDB 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .entries-list {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      container-type: inline-size;
    }

    .scatter-note {
      position: absolute;
      max-width: min(220px, 42%);
      line-height: 1.15;
      font-family: 'Ugly Dave', cursive, sans-serif;
      /* Fluid type — shrinks on narrower page containers */
      font-size: clamp(12px, 3.2vw, 14pt);
      font-size: clamp(12px, 5.5cqi, 14pt);
      /* Black ink; meta sits gray via opacity below. */
      color: #1C1C1C;
      pointer-events: none;
      text-wrap: pretty;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      opacity: 0;
      transition: opacity 0.35s ease;
      transform-origin: center center;
    }

    .scatter-note.is-placed {
      opacity: 1;
    }

    .scatter-note .entry-message {
      display: block;
      font-size: clamp(12px, 3.2vw, 14pt);
      font-size: clamp(12px, 5.5cqi, 14pt);
      color: #1C1C1C;
    }

    .scatter-note .entry-line {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.18em;
    }

    .scatter-note .entry-meta {
      display: block;
      color: #6B6B6B;
      opacity: 1;
      font-size: clamp(10px, 2.6vw, 10.5pt);
      font-size: clamp(10px, 4.4cqi, 10.5pt);
    }

    /* Desktop: message + name/date 4px smaller than the fluid caps above. */
    @media (min-width: 1200px) {
      .scatter-note,
      .scatter-note .entry-message {
        font-size: clamp(8px, calc(5.5cqi - 4px), calc(14pt - 4px));
      }
      .scatter-note .entry-meta {
        font-size: clamp(6px, calc(4.4cqi - 4px), calc(10.5pt - 4px));
      }
    }

    /* Name + date, 2px smaller on tablet and phone. On phone the old size was
       already sitting on its 10px floor, so the floor drops to 8px with it —
       otherwise the clamp would swallow the change. */
    @media (max-width: 1199.98px) {
      .scatter-note .entry-meta {
        font-size: clamp(8px, calc(2.6vw - 2px), calc(10.5pt - 2px));
        font-size: clamp(8px, calc(4.4cqi - 2px), calc(10.5pt - 2px));
      }
    }

    /* ── Message input (Figma 1551:28298 / 1551:28306) ─────────── */
    /*
     * Dock keeps a fixed collapsed footprint in the body flex column
     * (hint + message row). The pill is absolutely pinned inside
     * .message-dock-slot so the name row expands downward into empty
     * space without shifting #stage / frost / book.
     */
    .message-dock {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(480pt, 92vw);
      flex-shrink: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.97);
      transform-origin: top center;
      transition:
        opacity var(--input-exit) var(--input-ease),
        transform var(--input-exit) var(--input-ease),
        visibility var(--input-exit);
    }

    .message-dock.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1);
      transition:
        opacity var(--input-fade) var(--input-ease),
        transform var(--input-fade) var(--input-ease),
        visibility var(--input-fade);
    }

    /* One-line arrow-key tip — desktop only; sits 24px above the pill. */
    .page-turn-hint {
      display: none;
      /* The body's column gap (same clamp) sets book → dock spacing; pull the
         hint back up so it sits 18px under the book instead. */
      margin: calc(18px - clamp(20px, 3.5vh, 36px)) 0 24px;
      padding: 0;
      color: #C7C7CC;
      font-family: 'Switzer', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
      white-space: nowrap;
      text-align: center;
      pointer-events: none;
      user-select: none;
    }

    .page-turn-hint--touch { display: block; }

    @media (hover: hover) and (pointer: fine) {
      .page-turn-hint--touch { display: none; }
      .page-turn-hint--desktop {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
    }

    .page-turn-hint__key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 4px;
      border: 1px solid rgb(0 0 0 / 0.18);
      background: #FAFAFA;
      color: rgb(0 0 0 / 0.55);
      box-shadow: 0 1px 0 rgb(0 0 0 / 0.06);
      /* Real buttons: clicking a key cap turns the page like the arrow key. */
      padding: 0;
      font: inherit;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      transition: transform 120ms ease-out, background-color 120ms ease-out;
    }

    /* Word key (esc): same cap, sized to its label instead of square. */
    .page-turn-hint__key--text {
      width: auto;
      padding: 0 4px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0;
    }

    .page-turn-hint__key:hover { background: #FFFFFF; }
    .page-turn-hint__key:active { transform: scale(0.9); }
    .page-turn-hint__key:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }

    .page-turn-hint__key svg {
      display: block;
      width: 10px;
      height: 10px;
    }

    .message-dock-slot {
      position: relative;
      width: 100%;
      height: 42pt; /* phone / tablet / small desktop; 64pt at tall viewports */
    }

    .message-error {
      display: none;
      margin: 8px 4px 0;
      padding: 0 6px;
      color: #B42318;
      font-family: 'Switzer', sans-serif;
      font-size: 12px;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .message-dock.is-error .message-error {
      display: block;
    }

    .message-dock.is-error .message-pill {
      animation: message-pill-shake 0.42s ease;
    }

    @keyframes message-pill-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(2px); }
    }

    /* Pill = column of row1 (message+send) + optional name row */
    .message-pill {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 16px;
      overflow: hidden;
      background: #F4F4F4;
      box-shadow: none;
      cursor: text;
      transform-origin: top center;
    }

    .message-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      /* 48pt (64px) less 8px — 4px off the top and 4px off the bottom. The
         padding is not the lever here: box-sizing is border-box and the height
         is fixed, so trimming padding only grows the field inside the same
         pill. */
      height: 42pt;
      min-height: 42pt;
      box-sizing: border-box;
      padding: 8px calc(16pt - 8px) 8px 14px; /* 8px off each side from the original 16pt / 22px */
    }

    /* Collapse/expand name row (~180ms) without fighting dock fade */
    .message-name-slot {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
      transition:
        grid-template-rows 180ms ease,
        opacity 180ms ease;
    }

    .message-pill.is-hinted .message-name-slot {
      grid-template-rows: 1fr;
      opacity: 1;
      pointer-events: auto;
    }

    .message-name-inner {
      overflow: hidden;
      min-height: 0;
      border-top: 1px solid rgba(28, 28, 28, 0.08);
    }

    /* Left edge matches .message-row, so the name field and its placeholder
       line up with the message input above rather than sitting indented. */
    .message-name-row {
      /* 4px -> 2px top/bottom: tighten gap to the divider and pill edge. */
      padding: 2px calc(16pt - 8px) 2px 14px;
    }

    #name-input,
    .name-native {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 10px 0 12px;
      height: fit-content;
      border: 0;
      outline: none;
      background: transparent;
      color: #1C1C1C;
      font-family: 'Switzer', sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    #name-input::placeholder,
    .name-native::placeholder {
      color: #A3A3A3;
      opacity: 1;
    }

    .message-field-wrap {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      min-height: 28px;
    }

    .message-mirror {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 28px;
      font-family: 'Switzer', sans-serif;
      /* 14px, matching #name-input below. Placeholder and typed text are the
         same element here, so this sets both. */
      font-size: 14px;
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: -0.01em;
      white-space: pre;
      overflow: hidden;
      pointer-events: none;
    }

    .message-mirror-text {
      color: #1C1C1C;
    }

    .message-mirror.is-empty .message-mirror-text {
      color: #A3A3A3;
    }

    /* Hide placeholder while focused+empty so caret sits at left-most start */
    .message-pill.is-empty.is-focused .message-mirror-text {
      display: none;
    }

    .message-caret {
      display: none;
      flex: 0 0 auto;
      width: 1.25pt; /* thinner stroke than the original 2pt */
      height: 1.05em;
      margin-left: 2pt; /* Figma typed state: 2pt gap after last glyph */
      background: #1C1C1C;
      border-radius: 999px; /* round/pill caps on short vertical bar */
      animation: message-caret-blink 1.05s steps(1, end) infinite;
    }

    .message-pill.is-focused .message-caret {
      display: inline-block;
    }

    .message-pill.is-empty.is-focused .message-caret {
      margin-left: 0;
    }

    @keyframes message-caret-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    #message-input,
    .message-native {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-family: 'Switzer', sans-serif;
      font-size: 14px; /* keep in step with .message-mirror */
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    #message-input::selection,
    .message-native::selection {
      background: rgba(28, 28, 28, 0.14);
      color: transparent;
    }

    /* Send = 28pt hit area; 16pt icon only (no empty fill); 16pt from pill right */
    .message-send {
      flex: 0 0 auto;
      width: 28pt;
      height: 28pt;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 8pt;
      background: transparent;
      color: #DDDDDD; /* empty: icon only, no fill */
      cursor: default;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.18s ease, color 0.18s ease;
    }

    /* Ready = the plane's stroke goes black. No filled chip behind it — the
       icon alone carries the state. */
    .message-send.is-ready,
    .message-pill.is-ready .message-send {
      background: transparent;
      color: #000;
      cursor: pointer;
    }

    .message-send.is-ready:hover,
    .message-send.is-ready:focus-visible,
    .message-pill.is-ready .message-send:hover,
    .message-pill.is-ready .message-send:focus-visible {
      background: transparent;
      color: #000;
      outline: none;
    }

    .message-send:disabled {
      cursor: default;
    }

    .send-icon {
      display: block;
      width: 16pt;
      height: 16pt;
      overflow: visible;
      pointer-events: none;
    }

    .send-plane {
      transform-origin: 70% 30%;
      transform-box: fill-box;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .send-trail {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      stroke-dasharray: 2 2;
      stroke-dashoffset: 40;
      opacity: 0;
      transform: translate(-3px, 3px);
      transition:
        opacity 0.3s ease,
        transform 0.3s ease,
        stroke-dashoffset 0.3s ease;
    }

    .message-send.is-ready:hover .send-plane,
    .message-send.is-animating .send-plane {
      transform: translate(3px, -3px) scale(0.8);
    }

    .message-send.is-ready:hover .send-trail,
    .message-send.is-animating .send-trail {
      opacity: 1;
      transform: translate(0, 0);
      stroke-dashoffset: 0;
      transition:
        opacity 0.55s ease 0.1s,
        transform 0.55s ease 0.1s,
        stroke-dashoffset 0.55s ease 0.1s;
    }

    .page-crease { position: absolute; top: 0; bottom: 0; width: 34px; pointer-events: none; z-index: 20; }
    .page-crease.left  { left: 0;  background: linear-gradient(to right, rgba(0,0,0,0.05), transparent); }
    .page-crease.right { right: 0; background: linear-gradient(to left,  rgba(0,0,0,0.05), transparent); }

    .cover-placeholder {
      position: absolute; inset: 0;
      display: none;
      background: #FDF8F6;
    }

    @media (max-width: 640px) {
      :root {
        --book-depth: 22px;
        --page-tx: -18px;
      }
      .book-right-page { width: 18px; }
    }

    /* Tall viewports: larger default input field */
    @media (min-height: 1400px) {
      .message-dock-slot {
        height: 64pt;
      }

      .message-row {
        height: 64pt;
        min-height: 64pt;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .book,
      .book-cover,
      .book-right-page,
      .book-wrap,
      .frost-overlay,
      .message-dock,
      .message-name-slot,
      .send-plane,
      .send-trail {
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;
      }

      .message-caret {
        animation: none !important;
        opacity: 1;
      }

      #book-wrapper {
        transition:
          opacity 0.01ms ease-out !important,
          visibility 0.01ms !important;
      }
    }
  
    /* --- Tablet / mobile -------------------------------------------------
     * Tighter corners all round — the desktop radii read as very round once
     * the book and the dock are this small — and a shorter input row.
     */
    @media (max-width: 1199.98px) {
      :root,
      .book-cover {
        --cover-radius: 16px;
        --cover-radius-closed: 10px;
      }

      #book,
      #book-wrapper,
      #book.stf__parent,

<style id="dock-mode">
/* ── Docked mode ──────────────────────────────────────────────────────────
   The book is embedded in the portfolio footer. The iframe is ALWAYS the full
   viewport so the book's own layout (--book-w/--book-h, PageFlip sizing) never
   changes — resizing the frame mid-open would reflow the spread in the middle of
   the cover flip. Docking is purely a transform on #stage, so every animation
   below it is the source's own, untouched.

   Timings deliberately reuse the source's modal curve: opening (leaving docked)
   uses --modal-enter, closing (returning to docked) uses --modal-exit, matching
   the frost it moves with. */
body.is-embed {
  background: transparent;
  overflow: visible !important;
}
html:has(body.is-embed) {
  overflow: visible;
}

#stage {
  transition: transform var(--modal-enter) var(--modal-ease);
}
body.is-docked {
  /* Closed cover's outer corners — top-right and bottom-right; the spine side is
     already 0. Two 10% steps up from the source's 11.2px (11.2 -> 12.32 -> 13.55). */
  --cover-radius-closed: 13.55px;
}

body.is-docked #stage {
  transform: translate(var(--dock-tx, 0px), var(--dock-ty, 0px)) scale(var(--dock-scale, 1));
  transform-origin: center center;
  /* Returning home after the cover has flipped back: the book shrinks from the
     centre down into the footer slot. Longer than --modal-exit so the travel
     actually reads, on the same curve as the rest of the modal motion. */
  transition: transform 480ms var(--modal-ease);
}

/* Nothing but the book itself belongs on the page while docked. */
body.is-docked #message-dock,
body.is-docked #notebook-paint-warm {
  opacity: 0 !important;
  pointer-events: none !important;
}

/*
 * Closing: the frost leaves with the book rather than waiting for the cover flip
 * to finish. finishClose() only drops it at ~600ms, which left the blur hanging
 * over the page for ~300ms after the book had already gone home. Fading it from
 * the moment of dismiss lands the two together. ID selector so it outranks
 * .frost-overlay.is-active.
 */
body.is-closing-home #frost {
  opacity: 0;
  transition: opacity 380ms var(--modal-ease);
}

/* Docked, the book sits square to the page: the in-plane rotate(5deg) lean and
   the standalone -10deg resting rotateY both read as a tilt in the footer slot.
   Hover/focus are excluded so the peek below still gets its -20deg. */
body.is-docked .book-wrap.is-closed {
  transform: none;
}
body.is-docked .book-wrap.is-closed .book:not(:hover):not(:focus-visible):not(.is-peek) {
  transform: rotateX(0deg) rotateY(0deg);
}

/* Hover peek: the -20deg tilt exposes the page block, whose faces are cream
   (#F7F0EC / the paper gradient). Fill them with the flap's dark pink so the
   inner side reads as one colour instead of showing white. */
.book-wrap.is-closed .book:hover .book-pages-front,
.book-wrap.is-closed .book:focus-visible .book-pages-front,
.book-wrap.is-closed .book.is-peek .book-pages-front,
.book-wrap.is-closed .book:hover .book-pages-edge,
.book-wrap.is-closed .book:focus-visible .book-pages-edge,
.book-wrap.is-closed .book.is-peek .book-pages-edge,
.book-wrap.is-closed .book:hover .book-pages-top,
.book-wrap.is-closed .book:focus-visible .book-pages-top,
.book-wrap.is-closed .book.is-peek .book-pages-top {
  background-image: none;
  background-color: #D4008B;
  transition: background-color 0.2s ease;
}

/* Hover peek: the flap alone is the back of the book. The page block behind the
   cover is hidden so no second shape (fore-edge, top face, shelves) can show
   beside or through it. */
.book-wrap.is-closed .book:hover .book-pages,
.book-wrap.is-closed .book:focus-visible .book-pages,
.book-wrap.is-closed .book.is-peek .book-pages {
  opacity: 0;
}

/* The D4008B flap is retired: on hover the book's back is the Book Back art
   alone, with nothing pink-dark layered in front of it. */
.book-wrap.is-closed .book:hover .book-right-page,
.book-wrap.is-closed .book:focus-visible .book-right-page,
.book-wrap.is-closed .book.is-peek .book-right-page {
  opacity: 0 !important;
  visibility: hidden;
}

/* Underpaint behind the open notebook halves. The left already carries
   #FF53C4 (cover pink); the right was cream (#F8F0E8), which showed as a pale edge where the
   PNG's corners are transparent or clipped by the border radius. */
.open-right-page-bg {
  background-color: #FF53C4;
}
</style>

  <script>
    var INNER_SPREADS = 20; // 40 inner pages to flip through

    /** Must match PageFlip flippingTime — open/close cover curl duration */

    // frost is halfway in, which is as early as this can go without it
    // arriving ahead of the book.
    var INPUT_SHOW_DELAY_MS = Math.round(MODAL_ENTER_MS * 0.5) - 50; // 150

    var NOTE_COLORS = ['#1C1C1C', '#2E2E2E', '#3A3A3A', '#252525', '#4A4A4A'];

    // Accented Latin and everyday symbols are kept; only characters the
    // handwriting face cannot draw are dropped. Smart punctuation is folded to

    var ENGLISH_ONLY_RE = /[^A-Za-z0-9\u00C0-\u024F .,!?'"\-:;()&/+=@#*%_\[\]{}]/g;
    var ENGLISH_ONLY_TEST = /[^A-Za-z0-9\u00C0-\u024F .,!?'"\-:;()&/+=@#*%_\[\]{}]/;
    var UNSUPPORTED_MSG = 'This book can only letter English characters.';
    var ASSETS = {
      cover: 'Assets/Images/Cover.png?v=1789859770',
      back: 'Assets/Images/Back.png?v=1785618989',
      notebookLeft: 'Assets/Images/OpenNotebookLeft.webp?v=1785622900',
      notebookLeftPng: 'Assets/Images/OpenNotebookLeft.png',
      notebookRight: 'Assets/Images/OpenNotebookRight.webp?v=1785620413',
      notebookRightPng: 'Assets/Images/OpenNotebookRight.png'
    };
    var pageFlip = null;
    var totalPageCount = 0;
    /** @type {'closed'|'opening'|'open'|'closing'} */
    var phase = 'closed';
    var openTimer = null;
    var inputShowTimer = null;
    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var bookSize = { pageWidth: 320, pageHeight: 425 };
    var assetsReady = false;
    var assetsPromise = null;

    var closedWrap = document.getElementById('closed-book');
    var cssBook = document.getElementById('css-book');
    var bookWrapper = document.getElementById('book-wrapper');
    var bookEl = document.getElementById('book');
    var frostEl = document.getElementById('frost');
    var messageDock = document.getElementById('message-dock');
    var messageForm = document.getElementById('message-form');
    var messageInput = document.getElementById('message-input');
    var nameInput = document.getElementById('name-input');
    var nameSlot = messageForm.querySelector('.message-name-slot');
    var messageMirror = messageForm.querySelector('.message-mirror');
    var messageMirrorText = messageForm.querySelector('.message-mirror-text');
    var messageSend = document.getElementById('message-send');
    var PLACEHOLDER = 'Write your message ...';
    /** Pause after typing before revealing optional name row */
    var NAME_HINT_MS = 750; // was 900 — name slot appears 150ms sooner
    var nameHintTimer = null;
    var nameHinted = false;

    function setFrostActive(active) {
      frostEl.classList.toggle('is-active', active);
      frostEl.setAttribute('aria-hidden', active ? 'false' : 'true');
      frostEl.tabIndex = active ? 0 : -1;
      document.body.classList.toggle('is-book-open', active);

    /**
     * macOS and iOS substitute curly quotes, en/em dashes and an ellipsis while
     * you type. Those are outside the allowed set, so filtering alone quietly
     * ate them -- "I'm" came out "Im". Fold them to their ASCII equivalents
     * first, then filter.
     */
    var SMART_PUNCTUATION = [
      [/[\u2018\u2019\u201A\u201B]/g, "'"],
      [/[\u201C\u201D\u201E\u201F]/g, '"'],
      [/[\u2013\u2014\u2212]/g, '-'],
      [/\u2026/g, '...'],
      [/\u00A0/g, ' ']
    ];

    function foldPunctuation(value) {
      var out = String(value || '');
      for (var i = 0; i < SMART_PUNCTUATION.length; i++) {
        out = out.replace(SMART_PUNCTUATION[i][0], SMART_PUNCTUATION[i][1]);
      }
      return out;
    }

    function sanitizeEnglishOnly(value) {
      return foldPunctuation(value).replace(ENGLISH_ONLY_RE, '');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function loadEntries() {
      if (window.GuestbookApi) return GuestbookApi.readLocal();
      try {
        var parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (_err) {
        return [];
      }
    }

    function showMessageError(text) {
      if (messageErrorEl) messageErrorEl.textContent = text || '';
      messageDock.classList.add('is-error');
      clearTimeout(showMessageError._t);
      showMessageError._t = setTimeout(function () {
        messageDock.classList.remove('is-error');
      }, 3200);
    }

    function clearMessageError() {
      messageDock.classList.remove('is-error');
      if (messageErrorEl) messageErrorEl.textContent = '';
    }

    function getTodayStamp() {
      var now = new Date();
      var month = String(now.getMonth() + 1).padStart(2, '0');
      var day = String(now.getDate()).padStart(2, '0');
      return month + '/' + day + '/' + now.getFullYear();
    }

    function isContentPage(pageIndex) {
      var last = Math.max(0, totalPageCount - 1);
      return pageIndex > 0 && pageIndex < last;
    }

    /** Prefer the right leaf of the current open spread. */
    function getTargetPageIndex() {
      if (!pageFlip) return 1;
      var idx = pageFlip.getCurrentPageIndex();
      var last = Math.max(0, totalPageCount - 1);
      if (idx <= 0 || idx >= last) return Math.min(1, Math.max(0, last - 1));
      // showCover: odd indices are right pages (1, 3, 5…)
      if (idx % 2 === 1) return idx;
      if (idx + 1 < last) return idx + 1;
      return idx;
    }

    /**
     * Other leaf of the *same* open spread (no flip needed to show it).
     * Page indices: 1=right alone, then spreads (2|3), (4|5), …
     * Page 1 has no same-flap partner — overflow to 2 requires a flip.
     */
    function getSpreadPartner(pageIndex) {
      if (!isContentPage(pageIndex)) return null;
      if (pageIndex === 1) return null;
      if (pageIndex % 2 === 1) return pageIndex - 1; // right → left (same flap)
      return pageIndex + 1; // left → right (same flap)
    }

    /**
     * Try order on the currently open flap: current side first, then the
     * other side of the same spread (left↔right). No page turn for either.
     */
    function getSameSpreadTryOrder() {
      var preferred = getTargetPageIndex();
      var partner = getSpreadPartner(preferred);
      // On a full open spread, overflow left → right without flipping
      if (
        partner != null &&
        partner !== preferred &&
        isContentPage(partner) &&
        partner % 2 === 0 &&
        preferred % 2 === 1
      ) {
        return [partner, preferred];
      }
      var order = [preferred];
      if (partner != null && partner !== preferred && isContentPage(partner)) {
        order.push(partner);
      }
      return order;
    }

    /** Next content page after the current spread (requires a flip). */
    function getNextOverflowPage(pageIndex) {
      var right = pageIndex % 2 === 1 ? pageIndex : pageIndex + 1;
      if (pageIndex === 1) right = 1;
      var candidates = pageIndex === 1
        ? [2, 3]
        : [right + 2, right + 1, right + 3];
      for (var i = 0; i < candidates.length; i++) {
        if (isContentPage(candidates[i])) return candidates[i];
      }
      return null;
    }

    /** True when both pages are already visible on the open flap (no flip). */
    function isSameOpenSpread(pageIndex) {
      if (!pageFlip || !isContentPage(pageIndex)) return false;
      var current = pageFlip.getCurrentPageIndex();
      if (pageIndex === current) return true;
      // Open spread at even index L shows L|L+1
      if (current % 2 === 0) {
        return pageIndex === current || pageIndex === current + 1;
      }
      // At right page R (odd): alone for R===1; otherwise spread is (R-1)|R
      if (current === 1) return pageIndex === 1;
      return pageIndex === current || pageIndex === current - 1;
    }

    function getEntriesList(pageIndex) {
      if (!bookEl) return null;
      return bookEl.querySelector(
        '.entries-list[data-flip-index="' + pageIndex + '"]'
      );
    }

    function applyPlacementToNote(note, placement) {
      note.style.left = placement.xPercent.toFixed(2) + '%';
      note.style.top = placement.yPercent.toFixed(2) + '%';
      note.dataset.rotation = String(placement.rotation);
      note.style.transform = 'rotate(' + placement.rotation + 'deg)';
    }

    function revealNote(note) {
      requestAnimationFrame(function () {
        note.classList.add('is-placed');

    function createScatterNote(entry) {
      var note = document.createElement('div');
      note.className = 'scatter-note';
      note.dataset.entryId = entry.id || '';
      var vibe = entry.vibe || {};
      var rotation =
        typeof vibe.rotation === 'number' ? vibe.rotation : 0;
      note.dataset.rotation = String(rotation);
      if (vibe.top) note.style.top = vibe.top;
      if (vibe.left) note.style.left = vibe.left;
      note.style.transform = 'rotate(' + rotation + 'deg)';
      note.style.fontFamily = "'Ugly Dave', cursive, sans-serif";
      /* Always black/gray ink — ignore any stored chromatic vibe.color. */
      note.style.color = '#1C1C1C';
      var displayName =
        entry.name && entry.name !== '—' ? entry.name : 'Anonymous';
      var metaParts = [escapeHtml(displayName)];
      if (entry.date) metaParts.push(escapeHtml(entry.date));
      var metaHtml =
        '<span class="entry-meta">' + metaParts.join(' ') + '</span>';
      note.innerHTML =
        '<span class="entry-line">' +
        '<span class="entry-message">' + escapeHtml(entry.message) + '</span>' +
        metaHtml +
        '</span>';
      return note;
    }

    function isBookCoverEntry(entry) {
      return entry && entry.source === 'book-cover' && entry.vibe;
    }

    function persistEntries(entries) {
      if (window.GuestbookApi) {
        GuestbookApi.saveAllLocal(entries);
