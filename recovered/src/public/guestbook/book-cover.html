<style id="dock-mode">
/* ── Docked mode ──────────────────────────────────────────────────────────
   The book is embedded in the portfolio footer. The iframe is ALWAYS the full
   viewport so the book's own layout (--book-w/--book-h, PageFlip sizing) never
   changes — resizing the frame mid-open would reflow the spread in the middle of
   the cover flip. Docking is purely a transform on #stage, so every animation
   below it is the source's own, untouched.

   Timings deliberately reuse the source's modal curve: opening (leaving docked)
   uses --modal-enter, closing (returning to docked) uses --modal-exit, matching
   the frost it moves with. */
body.is-embed {
  background: transparent;
  overflow: visible !important;
}
html:has(body.is-embed) {
  overflow: visible;
}

#stage {
  /* translate / scale are the phone-keyboard fit (fitAboveKeyboard in JS). */
  transition:
    transform var(--modal-enter) var(--modal-ease),
    translate 280ms cubic-bezier(0.32, 0.72, 0, 1),
    scale 280ms cubic-bezier(0.32, 0.72, 0, 1);
  transform-origin: center center;
}

/* The message field rides up with the phone keyboard, on the same curve. */
.message-dock-slot {
  transition: translate 280ms cubic-bezier(0.32, 0.72, 0, 1);
}

@media (prefers-reduced-motion: reduce) {
  #stage,
  .message-dock-slot { transition-duration: 0.01ms; }
}
body.is-docked {
  /* Closed cover's outer corners — top-right and bottom-right; the spine side is
     already 0. Two 10% steps up from the source's 11.2px (11.2 -> 12.32 -> 13.55). */
  --cover-radius-closed: 13.55px;
}

body.is-docked #stage {
  transform: translate(var(--dock-tx, 0px), var(--dock-ty, 0px)) scale(var(--dock-scale, 1));
  transform-origin: center center;
  /* Returning home after the cover has flipped back: the book shrinks from the
     centre down into the footer slot. Longer than --modal-exit so the travel
     actually reads, on the same curve as the rest of the modal motion. */
  transition: transform 480ms var(--modal-ease);
}

/* Nothing but the book itself belongs on the page while docked. */
body.is-docked #message-dock,
body.is-docked #notebook-paint-warm {
  opacity: 0 !important;
  pointer-events: none !important;
}

/*
 * Closing: the frost leaves with the book rather than waiting for the cover flip
 * to finish. finishClose() only drops it at ~600ms, which left the blur hanging
 * over the page for ~300ms after the book had already gone home. Fading it from
 * the moment of dismiss lands the two together. ID selector so it outranks
 * .frost-overlay.is-active.
 */
body.is-closing-home #frost {
  opacity: 0;
  transition: opacity 300ms cubic-bezier(0.23, 1, 0.32, 1);
}

/* Touch: the host paints the page blur (globals.css, .guestbook_layer::before)
   so it can run past the frame's edges under the browser toolbar. The frost
   stays as the tap-to-dismiss target, without a second blur on top. */
/*
 * Touch: the name line reads 4px under the message (10px against 14px), but
 * iOS zooms the page into any field under 16px on focus. So the field keeps a
 * real 16px and is scaled down to 10px (0.625 = 10 / 16; update it with
 * --message-size). Width and padding are divided by the scale so it lands at
 * the same width and 6px / 8px padding as before; the negative margin takes
 * back the height the unscaled box still holds in layout.
 */
@media (pointer: coarse) {
  #name-input,
  .name-native {
    font-size: 16px;
    width: calc(100% / 0.625);
    padding: calc(6px / 0.625) 0 calc(8px / 0.625);
    transform: scale(0.625);
    transform-origin: 0 0;
    margin-bottom: calc((16px * 1.35 + 14px / 0.625) * (0.625 - 1));
  }
}

@media (pointer: coarse) {
  html.is-embed .frost-overlay {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

/* Docked, the book sits square to the page: the in-plane rotate(5deg) lean and
   the standalone -10deg resting rotateY both read as a tilt in the footer slot.
   Hover/focus are excluded so the peek below still gets its -20deg. */
body.is-docked .book-wrap.is-closed {
  transform: none;
}
body.is-docked .book-wrap.is-closed .book:not(:hover):not(:focus-visible):not(.is-peek) {
  transform: rotateX(0deg) rotateY(0deg);
}

/* Hover peek: the -20deg tilt exposes the page block, whose faces are cream
   (#F7F0EC / the paper gradient). Fill them with the flap's dark pink so the
   inner side reads as one colour instead of showing white. */
.book-wrap.is-closed .book:hover .book-pages-front,
.book-wrap.is-closed .book:focus-visible .book-pages-front,
.book-wrap.is-closed .book.is-peek .book-pages-front,
.book-wrap.is-closed .book:hover .book-pages-edge,
.book-wrap.is-closed .book:focus-visible .book-pages-edge,
.book-wrap.is-closed .book.is-peek .book-pages-edge,
.book-wrap.is-closed .book:hover .book-pages-top,
.book-wrap.is-closed .book:focus-visible .book-pages-top,
.book-wrap.is-closed .book.is-peek .book-pages-top {
  background-image: none;
  background-color: #D4008B;
  transition: background-color 0.2s ease;
}

/* Hover peek: the flap alone is the back of the book. The page block behind the
   cover is hidden so no second shape (fore-edge, top face, shelves) can show
   beside or through it. */
.book-wrap.is-closed .book:hover .book-pages,
.book-wrap.is-closed .book:focus-visible .book-pages,
.book-wrap.is-closed .book.is-peek .book-pages {
  opacity: 0;
}

/* The D4008B flap is retired: on hover the book's back is the Book Back art
   alone, with nothing pink-dark layered in front of it. */
.book-wrap.is-closed .book:hover .book-right-page,
.book-wrap.is-closed .book:focus-visible .book-right-page,
.book-wrap.is-closed .book.is-peek .book-right-page {
  opacity: 0 !important;
  visibility: hidden;
}

/* Underpaint behind the open notebook halves. The left already carries
   #FF53C4 (cover pink); the right was cream (#F8F0E8), which showed as a pale edge where the
   PNG's corners are transparent or clipped by the border radius. */
.open-right-page-bg {
  background-color: #FF53C4;
}
</style>

<body>
  <!-- Envelope-matched frost: blurs/dims background; click closes -->
  <div
    id="frost"
    class="frost-overlay"
    role="button"
    tabindex="-1"
    aria-label="Close guestbook"
    aria-hidden="true"
  ></div>

  <div id="stage">
    <!-- CLOSED: Vault-style CSS 3D book -->
    <div class="book-wrap is-closed" id="closed-book">
      <div
        class="book"
        id="css-book"
        role="button"
        tabindex="0"
        aria-label="Open guestbook"
      >

  <script>
    /* Bottom “Turn pages by pressing…” / “Tap an empty area” hint.

    var SHOW_PAGE_TURN_HINT = true;

    /* Mirror the page's light / night theme (data-theme on the host's <html>)

    (function syncHostTheme() {
      var hostRoot = null;
      try { hostRoot = window.parent !== window ? window.parent.document.documentElement : null; }
      catch (_e) { hostRoot = null; }
      if (!hostRoot) return;
      var apply = function () {
        document.body.classList.toggle('host-dark', hostRoot.dataset.theme === 'dark');

      apply();
      new MutationObserver(apply).observe(hostRoot, { attributes: true, attributeFilter: ['data-theme'] });

    /** Must match PageFlip flippingTime — open/close cover curl duration */
    var FLIPPING_TIME = 264; // 600ms -> 240ms (60% faster), then +10% slower
    /* The cover turns as soon as the book has landed — no beat before it. */
    var OPEN_FLIP_DELAY = 0;
    /**
     * Frost enter = --modal-enter (400ms).
     * Input fade-in starts at 50% → 200ms after open frost starts.
     */
    var MODAL_ENTER_MS = 400;
    // 200ms (half the frost enter) less 50ms. The bar now starts before the
    // frost is halfway in, which is as early as this can go without it
    // arriving ahead of the book.
    var INPUT_SHOW_DELAY_MS = Math.round(MODAL_ENTER_MS * 0.5) - 50; // 150
    var STORAGE_KEY = (window.GuestbookApi && GuestbookApi.STORAGE_KEY) || 'guestbook_v3';
    /* Ink = each pen's tip colour, so the note matches the pen that wrote it. */
    var PEN_INKS = [
      { id: 'black', label: 'Black', ink: '#1C1C1C' },
      { id: 'pink', label: 'Pink', ink: '#E6095B' },
      { id: 'orange', label: 'Orange', ink: '#F34102' },
      { id: 'green', label: 'Green', ink: '#3C8F02' },
      { id: 'teal', label: 'Teal', ink: '#038A93' },
      { id: 'blue', label: 'Blue', ink: '#0142B8' },
      { id: 'purple', label: 'Purple', ink: '#53109C' }

    // handwriting face cannot draw are dropped. Smart punctuation is folded to

    var ENGLISH_ONLY_RE = /[^A-Za-z0-9\u00C0-\u024F .,!?'"\-:;()&/+=@#*%_\[\]{}]/g;
    var ENGLISH_ONLY_TEST = /[^A-Za-z0-9\u00C0-\u024F .,!?'"\-:;()&/+=@#*%_\[\]{}]/;
    var UNSUPPORTED_MSG = 'This book can only letter English characters.';
    var ASSETS = {
      cover: 'Assets/Images/Cover.png?v=1789859770',
      back: 'Assets/Images/Back.png?v=1785618989',
      notebookLeft: 'Assets/Images/OpenNotebookLeft.webp?v=1785622900',
      notebookLeftPng: 'Assets/Images/OpenNotebookLeft.png',
      notebookRight: 'Assets/Images/OpenNotebookRight.webp?v=1785620413',
      notebookRightPng: 'Assets/Images/OpenNotebookRight.png'
    };

    var totalPageCount = 0;
    /** @type {'closed'|'opening'|'open'|'closing'} */
    var phase = 'closed';
    var openTimer = null;
    var inputShowTimer = null;
    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var bookSize = { pageWidth: 320, pageHeight: 425 };
    var assetsReady = false;
    var assetsPromise = null;

    var closedWrap = document.getElementById('closed-book');
    var cssBook = document.getElementById('css-book');
    var bookWrapper = document.getElementById('book-wrapper');
    var bookEl = document.getElementById('book');
    var frostEl = document.getElementById('frost');
    var messageDock = document.getElementById('message-dock');
    var messageForm = document.getElementById('message-form');
    var messageInput = document.getElementById('message-input');
    var nameInput = document.getElementById('name-input');
    var nameSlot = messageForm.querySelector('.message-name-slot');
    var messageMirror = messageForm.querySelector('.message-mirror');
    var messageMirrorText = messageForm.querySelector('.message-mirror-text');
    var messageSend = document.getElementById('message-send');
    var PLACEHOLDER = 'Write your message ...';
    /** Pause after typing before revealing optional name row */
    var NAME_HINT_MS = 750; // was 900 — name slot appears 150ms sooner
    var nameHintTimer = null;
    var nameHinted = false;

    function setFrostActive(active) {
      frostEl.classList.toggle('is-active', active);
      frostEl.setAttribute('aria-hidden', active ? 'false' : 'true');
      frostEl.tabIndex = active ? 0 : -1;
      document.body.classList.toggle('is-book-open', active);
    }

    /**
     * macOS and iOS substitute curly quotes, en/em dashes and an ellipsis while
     * you type. Those are outside the allowed set, so filtering alone quietly
     * ate them -- "I'm" came out "Im". Fold them to their ASCII equivalents
     * first, then filter.
     */
    var SMART_PUNCTUATION = [
      [/[\u2018\u2019\u201A\u201B]/g, "'"],
      [/[\u201C\u201D\u201E\u201F]/g, '"'],
      [/[\u2013\u2014\u2212]/g, '-'],
      [/\u2026/g, '...'],
      [/\u00A0/g, ' ']
    ];

    function foldPunctuation(value) {
      var out = String(value || '');
      for (var i = 0; i < SMART_PUNCTUATION.length; i++) {
        out = out.replace(SMART_PUNCTUATION[i][0], SMART_PUNCTUATION[i][1]);
      }
      return out;
    }

    function sanitizeEnglishOnly(value) {
      return foldPunctuation(value).replace(ENGLISH_ONLY_RE, '');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function loadEntries() {
      if (window.GuestbookApi) return GuestbookApi.readLocal();
      try {
        var parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (_err) {
        return [];
      }
    }

    function showMessageError(text) {
      if (messageErrorEl) messageErrorEl.textContent = text || '';
      messageDock.classList.add('is-error');
      clearTimeout(showMessageError._t);
      showMessageError._t = setTimeout(function () {
        messageDock.classList.remove('is-error');
      }, 3200);
    }

    function clearMessageError() {
      messageDock.classList.remove('is-error');
      if (messageErrorEl) messageErrorEl.textContent = '';
    }

    function getTodayStamp() {
      var now = new Date();
      var month = String(now.getMonth() + 1).padStart(2, '0');
      var day = String(now.getDate()).padStart(2, '0');
      return month + '/' + day + '/' + now.getFullYear();
    }

    function isContentPage(pageIndex) {
      var last = Math.max(0, totalPageCount - 1);
      return pageIndex > 0 && pageIndex < last;
    }

    /** Prefer the right leaf of the current open spread. */
    function getTargetPageIndex() {
      if (!pageFlip) return 1;
      var idx = pageFlip.getCurrentPageIndex();
      var last = Math.max(0, totalPageCount - 1);
      if (idx <= 0 || idx >= last) return Math.min(1, Math.max(0, last - 1));
      // showCover: odd indices are right pages (1, 3, 5…)
      if (idx % 2 === 1) return idx;
      if (idx + 1 < last) return idx + 1;
      return idx;
    }

    /**
     * Other leaf of the *same* open spread (no flip needed to show it).
     * Page indices: 1=right alone, then spreads (2|3), (4|5), …
     * Page 1 has no same-flap partner — overflow to 2 requires a flip.
     */
    function getSpreadPartner(pageIndex) {
      if (!isContentPage(pageIndex)) return null;
      if (pageIndex === 1) return null;
      if (pageIndex % 2 === 1) return pageIndex - 1; // right → left (same flap)
      return pageIndex + 1; // left → right (same flap)
    }

    /**
     * Try order on the currently open flap: current side first, then the
     * other side of the same spread (left↔right). No page turn for either.
     */
    function getSameSpreadTryOrder() {
      var preferred = getTargetPageIndex();
      var partner = getSpreadPartner(preferred);
      // On a full open spread, overflow left → right without flipping
      if (
        partner != null &&
        partner !== preferred &&
        isContentPage(partner) &&
        partner % 2 === 0 &&
        preferred % 2 === 1
      ) {
        return [partner, preferred];
      }
      var order = [preferred];
      if (partner != null && partner !== preferred && isContentPage(partner)) {
        order.push(partner);
      }
      return order;
    }

    /** Next content page after the current spread (requires a flip). */
    function getNextOverflowPage(pageIndex) {
      var right = pageIndex % 2 === 1 ? pageIndex : pageIndex + 1;
      if (pageIndex === 1) right = 1;
      var candidates = pageIndex === 1
        ? [2, 3]
        : [right + 2, right + 1, right + 3];
      for (var i = 0; i < candidates.length; i++) {
        if (isContentPage(candidates[i])) return candidates[i];
      }
      return null;
    }

    /** True when both pages are already visible on the open flap (no flip). */
    function isSameOpenSpread(pageIndex) {
      if (!pageFlip || !isContentPage(pageIndex)) return false;
      var current = pageFlip.getCurrentPageIndex();
      if (pageIndex === current) return true;
      // Open spread at even index L shows L|L+1
      if (current % 2 === 0) {
        return pageIndex === current || pageIndex === current + 1;
      }
      // At right page R (odd): alone for R===1; otherwise spread is (R-1)|R
      if (current === 1) return pageIndex === 1;
      return pageIndex === current || pageIndex === current - 1;
    }

    function getEntriesList(pageIndex) {
      if (!bookEl) return null;
      return bookEl.querySelector(
        '.entries-list[data-flip-index="' + pageIndex + '"]'
      );
    }

    /*
     * Tilt. Every note leans a random amount anywhere between -TILT_MAX and
     * TILT_MAX degrees (near-straight included), so the page reads
     * hand-written. The angle comes from the note's id, so a note keeps the
     * same lean on every load and in every browser, whatever angle older
     * saves (up to 7deg) recorded.
     */
    var TILT_MAX = 5;
    function tiltFor(key) {
      var str = String(key || '');
      var h = 2166136261;
      for (var i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      // Avalanche (murmur3 fmix32): ids that differ by one character, like
      // seed-01 / seed-02, otherwise land on nearly the same angle.
      h ^= h >>> 16;
      h = Math.imul(h, 0x85EBCA6B);
      h ^= h >>> 13;
      h = Math.imul(h, 0xC2B2AE35);
      h ^= h >>> 16;
      var unit = (h >>> 0) / 4294967296;
      return Math.round((unit * 2 - 1) * TILT_MAX * 10) / 10;
    }

    function applyPlacementToNote(note, placement) {
      note.style.left = placement.xPercent.toFixed(2) + '%';
      note.style.top = placement.yPercent.toFixed(2) + '%';
      note.dataset.rotation = String(placement.rotation);
      note.style.transform = 'rotate(' + placement.rotation + 'deg)';
    }

    function revealNote(note) {
      requestAnimationFrame(function () {
        note.classList.add('is-placed');
      });
    }

    var SMILE_RE =
      /[:;](?:\s*-?\s*)(?:\)\s*)+|=(?:\s*-?\s*)(?:\)\s*)+|[:;=](?:\s*-?\s*)D+(?![a-z])|\bx-?D+\b|\^\s*[_\-]\s*\^|\(\s*\^\s*_\s*\^\s*\)|[\u263A\u263B]|\uD83D[\uDE00-\uDE0A\uDE42\uDE0B]/gi;

    /** The smile sticker stands in for the emoticon, so the text drops it. */
    function stripSmileys(message) {
      return String(message || '')
        .replace(new RegExp(SMILE_RE.source, 'gi'), ' ')
        .replace(/\s{2,}/g, ' ')
        .replace(/\s+([.,!?])/g, '$1')
        .trim();
    }

    /**
     * Smileys, love/like, sunglasses/cool, fire/lit, and wow/amazing, in the
     * order they appear.
     */
    function stickerKindsForMessage(message) {
      var text = String(message || '');
      var smileRe = new RegExp(SMILE_RE.source, 'gi');
      var heartRe =
        /\b(?:love|loves|loved|loving|like|likes|liked|liking)\b/gi;
      // "cool" in any stretch (cooool, coolll) plus cooler / coolest.
      var sunRe = /\bsunglass(?:es)?\b|\bco{2,}l+(?:er|est)?\b/gi;
      var fireRe = /\b(?:fires|flames|flame|fire+|lit+)\b|\uD83D\uDD25/gi;
      var smile = smileRe.exec(text);
      var heart = heartRe.exec(text);
      var sun = sunRe.exec(text);
      // "wow" in any stretch (woow, wowww), amazing / amazed / amaze, and ✨.
      var sparkleRe = /\bwo+w+\b|\bamaz(?:e|ed|es|ing|ingly)\b|\u2728/gi;
      var fire = fireRe.exec(text);
      var sparkle = sparkleRe.exec(text);
      var hits = [];
      if (sparkle) hits.push({ i: sparkle.index, kind: 'sparkle' });
      if (smile) hits.push({ i: smile.index, kind: 'happy' });
      if (heart) hits.push({ i: heart.index, kind: 'heart' });
      if (sun) hits.push({ i: sun.index, kind: 'sunglasses' });
      if (fire) hits.push({ i: fire.index, kind: 'fire' });
      hits.sort(function (a, b) { return a.i - b.i; });
      return hits.map(function (hit) { return hit.kind; });
    }

    /*
     * em per Figma px, so stickers follow the message size: the heart lands at
     * about the height of an "l" in Ugly Dave. Keep in step with the fire frame
     * in .entry-sticker--fire.
     */
    var STICKER_SCALE = 0.04;
    /* Bump when the sticker SVGs change so cached masks are not reused. */
    var STICKER_V = '?v=4';

    /* Degrees; positive leans right. Hearts only lean right of upright. */
    var STICKER_TILT = { min: -30, max: 30 };
    var STICKER_TILT_BY_KIND = { heart: { min: 0, max: 30 } };

    /*
     * Seeded by note id + sticker slot so a note's stickers keep the same pose
     * every time the book re-renders.
     */
    function stickerTilt(seed, kind) {
      var range = STICKER_TILT_BY_KIND[kind] || STICKER_TILT;
      var h = 2166136261;
      for (var i = 0; i < seed.length; i++) {
        h ^= seed.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      var unit = (h >>> 0) / 4294967295;
      return Math.round(range.min + unit * (range.max - range.min));
    }

    /* A mask filled with currentColor, so the sticker takes the note's ink. */
    function stickerInk(file, w, h, cls, tilt) {
      return (
        '<span class="entry-sticker-ink' + (cls ? ' ' + cls : '') + '" style="' +
        'width:' + (w * STICKER_SCALE).toFixed(4) + 'em;' +
        'height:' + (h * STICKER_SCALE).toFixed(4) + 'em;' +
        (tilt ? 'transform:rotate(' + tilt + 'deg);' : '') +
        '-webkit-mask-image:url(stickers/' + file + STICKER_V + ');mask-image:url(stickers/' + file + STICKER_V + ')' +
        '"></span>'
      );
    }

    function stickerMarkup(kind, tilt) {
      if (kind === 'heart') {
        return stickerInk('heart.svg', 19.661, 21.6266, 'entry-sticker', tilt);
      }
      if (kind === 'sparkle') {
        return stickerInk('sparkle.svg', 15.3962, 17.4882, 'entry-sticker', tilt);
      }
      if (kind === 'sunglasses') {
        return stickerInk('sunglasses.svg', 22.774, 9.963, 'entry-sticker', tilt);
      }
      if (kind === 'fire') {
        // Tilt the frame, not its parts, so the core stays inside the flame.
        return (
          '<span class="entry-sticker entry-sticker--fire"' +
          (tilt ? ' style="transform:rotate(' + tilt + 'deg)"' : '') + '>' +
          stickerInk('fire-outer.svg', 15.4521, 19.9084) +
          stickerInk('fire-inner.svg', 8.0165, 10.4571, 'entry-sticker__fire-core') +
          '</span>'
        );
      }
      return stickerInk('happy.svg', 17.5025, 17.3666, 'entry-sticker', tilt);
    }

    /*
     * Ink: always the colour saved with the note — the pen the visitor wrote
     * with. Notes from before the pens were given a pen colour once, in the
     * saved data (scripts/migrate-guestbook-inks.mjs), so nothing is picked
     * at draw time. Anything that is not one of the pens draws in black.
     */
    function inkFor(entry) {
      var vibe = (entry && entry.vibe) || {};
      return penForInk(vibe.color) ? vibe.color : PEN_INKS[0].ink;
    }

    function createScatterNote(entry) {
      var note = document.createElement('div');
      note.className = 'scatter-note';
      note.dataset.entryId = entry.id || '';
      var vibe = entry.vibe || {};
      var rotation = tiltFor(entry.id || entry.message);
      note.dataset.rotation = String(rotation);
      if (vibe.top) note.style.top = vibe.top;
      if (vibe.left) note.style.left = vibe.left;
      note.style.transform = 'rotate(' + rotation + 'deg)';
      note.style.fontFamily = "'Ugly Dave', cursive, sans-serif";
      note.style.color = inkFor(entry);
      var displayName =
        entry.name && entry.name !== '—' ? entry.name : 'Anonymous';
      var metaParts = [escapeHtml(displayName)];
      if (entry.date) metaParts.push(escapeHtml(entry.date));
      var metaHtml =
        '<span class="entry-meta">' + metaParts.join(' ') + '</span>';
      var kinds = stickerKindsForMessage(entry.message);
      var messageText = kinds.indexOf('happy') !== -1
        ? stripSmileys(entry.message)
        : entry.message;
      var words = String(messageText || '').split(/\s+/).filter(Boolean).length;
      note.dataset.size = words < 4 ? 'lg' : words <= 12 ? 'md' : 'sm';
      var stickerHtml = kinds.length
        ? '<span class="entry-stickers">' +
          kinds.map(function (kind, i) {
            return stickerMarkup(kind, stickerTilt((entry.id || entry.message || '') + ':' + i + ':' + kind, kind));
          }).join('') +
          '</span>'
        : '';
      note.innerHTML =
        '<span class="entry-line">' +
        '<span class="entry-message-row">' +
        (messageText
          ? '<span class="entry-message">' + escapeHtml(messageText) + '</span>'
          : '') +
        stickerHtml +
        '</span>' +
        metaHtml +
        '</span>';
      return note;
    }

    function isBookCoverEntry(entry) {
      return entry && entry.source === 'book-cover' && entry.vibe;
    }

    function persistEntries(entries) {
      if (window.GuestbookApi) {
        GuestbookApi.saveAllLocal(entries);
        return;
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      } catch (_err) {
        /* ignore quota / private mode */
      }
    }

    function syncEntryToCloud(entry) {
      if (!window.GuestbookApi) return;
      GuestbookApi.createEntry(entry).catch(function (err) {
        if (err && err.code === 'PROFANITY') {
          showMessageError(err.message);
        }
      });
    }

    /** Re-measure + re-place every note on a page (rotated AABB, 16px gap). */
    function relayoutPageNotes(pageIndex, persist) {
      var NP = window.NotePlacement;
      if (!NP) return;
      var list = getEntriesList(pageIndex);
      if (!list) return;
      var notes = Array.prototype.slice.call(
        list.querySelectorAll('.scatter-note')
      );
      if (!notes.length) return;

      var cw = list.clientWidth;
      var ch = list.clientHeight;
      if (cw <= 0 || ch <= 0) return;

      var sizes = notes.map(function (n) {
        return NP.measureUnrotatedSize(n);
      });
      var rotations = notes.map(function (n) {
        var r = parseFloat(n.dataset.rotation);
        return isFinite(r) ? r : 0;
      });
      /* Where each note already sits, so a relayout keeps valid notes where they
         are instead of reshuffling the whole page. */
      var preferred = notes.map(function (n, i) {
        if (!n.style.left && !n.style.top) return null;
        var lx = parseFloat(n.style.left), ty = parseFloat(n.style.top);
        if (!isFinite(lx) || !isFinite(ty)) return null;
        return {
          cx: (lx / 100) * cw + sizes[i].width / 2,
          cy: (ty / 100) * ch + sizes[i].height / 2
        };
      });

      var placements = NP.placeNotes({
        containerWidth: cw,
        containerHeight: ch,
        sizes: sizes,
        rotations: rotations,
        strict: true,
        preferred: preferred
      });

      /*
       * Notes are never stacked on top of one another. A note that does not fit
       * here goes to the NEXT page — left page -> right page of the same spread
       * -> the next spread's left page — so overflow reads in page order. Notes
       * are placed oldest-first, so it is the newest ones that move on. Only the
       * very last page, with nowhere left to go, falls back to overlapping.
       */
      var nextPage = pageIndex + 1;
      var canEvict = isContentPage(nextPage);
      var nextList = canEvict ? getEntriesList(nextPage) : null;
      var evicted = [];

      var entries = persist ? loadEntries() : null;
      notes.forEach(function (note, i) {
        var p = placements[i];
        if (!p) return;
        if (p.fitted === false && canEvict && nextList) {
          // Cleared so the target page places it afresh when it next measures.
          note.style.left = '';
          note.style.top = '';
          note.classList.remove('is-placed');
          nextList.appendChild(note);
          evicted.push(note);
          if (entries) {
            var mid = note.dataset.entryId;
            for (var m = 0; m < entries.length; m++) {
              if (entries[m].id !== mid) continue;
              entries[m].pageIndex = nextPage;
              break;
            }
          }
          return;
        }
        applyPlacementToNote(note, p);
        note.classList.add('is-placed');
        if (!entries) return;
        var id = note.dataset.entryId;
        for (var e = 0; e < entries.length; e++) {
          if (entries[e].id !== id) continue;
          entries[e].pageIndex = pageIndex;
          entries[e].vibe = Object.assign({}, entries[e].vibe || {}, {
            top: p.yPercent.toFixed(2) + '%',
            left: p.xPercent.toFixed(2) + '%',
            rotation: p.rotation
          });
          break;
        }
      });
      if (entries) persistEntries(entries);

      // Give the page that just received notes the chance to place (or pass on)
      // what it was handed. If it is off-screen it has no size yet and simply
      // waits — it lays out the moment it is turned to.
      if (evicted.length) {
        requestAnimationFrame(function () {
          relayoutPageNotes(nextPage, persist);
        });
      }
    }

    function relayoutAllPages(persist) {
      if (!bookEl) return;
      var lists = bookEl.querySelectorAll('.entries-list');
      lists.forEach(function (list) {
        relayoutPageNotes(Number(list.dataset.flipIndex), persist);
      });
    }

    var pageResizeDisconnectors = [];

    function bindPageResizeObservers() {
      var NP = window.NotePlacement;
      pageResizeDisconnectors.forEach(function (off) { off(); });
      pageResizeDisconnectors = [];
      if (!NP || !bookEl) return;
      bookEl.querySelectorAll('.entries-list').forEach(function (list) {
        var off = NP.observeContainerResize(list, function () {
          relayoutPageNotes(Number(list.dataset.flipIndex), true);
        });
        pageResizeDisconnectors.push(off);
      });
    }

    function paintEntriesOntoPages() {
      if (!bookEl) return;
      var lists = bookEl.querySelectorAll('.entries-list');
      lists.forEach(function (list) { list.innerHTML = ''; });
      /*
       * Pack the book from the first page on every paint, ignoring whichever
       * page a note was saved on. Everything starts on page 1; the relayout
       * keeps what fits there and passes the rest to page 2, which passes its
       * overflow to page 3, and so on. So notes only spill onto a later page
       * once the earlier one is truly full — no half-empty spreads.
       * Stable sort by saved page keeps the existing reading order.
       */
      var firstList = getEntriesList(1);
      if (firstList) {
        loadEntries()
          .filter(isBookCoverEntry)
          .map(function (entry, i) { return { entry: entry, i: i }; })
          .sort(function (a, b) {
            return ((Number(a.entry.pageIndex) || 0) - (Number(b.entry.pageIndex) || 0)) || (a.i - b.i);
          })
          .forEach(function (item) {
            var note = createScatterNote(item.entry);
            // Pack fresh on every open rather than replaying saved spots: those
            // were found at some other book size and text size (often a single
            // column on a small screen), and a dense pack fits two or three
            // notes to a row at whatever size the book is now.
            note.style.left = '';
            note.style.top = '';
            firstList.appendChild(note);
          });
      }
      // Measure real sizes, place with rotated AABB, then fade in
      requestAnimationFrame(function () {
        relayoutAllPages(true);
        bindPageResizeObservers();
      });
    }

    function collectOccupiedBoxes(list) {
      var NP = window.NotePlacement;
      var cw = list.clientWidth;
      var ch = list.clientHeight;
      var notes = Array.prototype.slice.call(
        list.querySelectorAll('.scatter-note.is-placed, .scatter-note')
      );
      var sizes = [];
      var placements = [];
      notes.forEach(function (n) {
        if (!n.style.left && !n.style.top) return;
        sizes.push(NP.measureUnrotatedSize(n));
        placements.push({
          xPercent: parseFloat(n.style.left) || 0,
          yPercent: parseFloat(n.style.top) || 0,
          rotation: parseFloat(n.dataset.rotation) || 0
        });
      });
      return {
        cw: cw,
        ch: ch,
        boxes: NP.boxesFromPlacements(sizes, placements, cw, ch)
      };
    }

    /**
     * Try to fit one new note on a page using real measured size + rotated AABB.
     * Returns { note, entry, placement } or null if the page is full.
     */
    function tryFitNoteOnPage(pageIndex, draft) {
      var NP = window.NotePlacement;
      if (!NP || !isContentPage(pageIndex)) return null;
      var list = getEntriesList(pageIndex);
      if (!list) return null;

      var occupied = collectOccupiedBoxes(list);
      if (occupied.cw <= 0 || occupied.ch <= 0) return null;

      var note = createScatterNote({
        id: draft.id,
        message: draft.message,
        name: draft.name,
        date: draft.date,
        vibe: { rotation: draft.rotation, color: draft.color, pen: true }
      });
      list.appendChild(note);
      var size = NP.measureUnrotatedSize(note);

      var placed = NP.tryPlaceOneNote({
        containerWidth: occupied.cw,
        containerHeight: occupied.ch,
        size: size,
        rotation: draft.rotation,
        occupied: occupied.boxes
      });

      if (!placed) {
        list.removeChild(note);
        return null;
      }

      applyPlacementToNote(note, placed.placement);
      revealNote(note);

      var entry = {
        id: draft.id,
        message: draft.message,
        name: draft.name,
        date: draft.date,
        pageIndex: pageIndex,
        vibe: {
          font: 'Ugly Dave',
          color: draft.color,
          pen: true,
          rotation: placed.placement.rotation,
          weight: 400,
          fontSize: 14,
          top: placed.placement.yPercent.toFixed(2) + '%',
          left: placed.placement.xPercent.toFixed(2) + '%'
        },
        source: 'book-cover'
      };

      var entries = loadEntries();
      var replaced = false;
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].id === entry.id) {
          entries[i] = entry;
          replaced = true;
          break;
        }
      }
      if (!replaced) entries.push(entry);
      persistEntries(entries);
      syncEntryToCloud(entry);

      return { note: note, entry: entry, placement: placed.placement, pageIndex: pageIndex };
    }

    /** Force-place via full relayout (grid fallback) when a page must accept the note. */
    function forcePlaceOnPage(pageIndex, draft) {
      var list = getEntriesList(pageIndex);
      if (!list || !isContentPage(pageIndex)) return null;

      var note = createScatterNote({
        id: draft.id,
        message: draft.message,
        name: draft.name,
        date: draft.date,
        vibe: { rotation: draft.rotation, color: draft.color, pen: true }
      });
      list.appendChild(note);

      var entry = {
        id: draft.id,
        message: draft.message,
        name: draft.name,
        date: draft.date,
        pageIndex: pageIndex,
        vibe: {
          font: 'Ugly Dave',
          color: draft.color,
          pen: true,
          rotation: draft.rotation,
          weight: 400,
          fontSize: 14,
          top: '12%',
          left: '12%'
        },
        source: 'book-cover'
      };
      var entries = loadEntries();
      entries.push(entry);
      persistEntries(entries);
      syncEntryToCloud(entry);

      relayoutPageNotes(pageIndex, true);
      revealNote(note);
      return { note: note, entry: entry, pageIndex: pageIndex };
    }

    function ensurePageVisible(pageIndex) {
      if (!pageFlip || !isContentPage(pageIndex)) return;
      var current = pageFlip.getCurrentPageIndex();
      // For a right page R, turn to R; for left L, turn to L (shows L|L+1)
      var turnTo = pageIndex;
      if (turnTo === current) return;
      try {
        if (Math.abs(turnTo - current) === 1) {
          if (turnTo > current) pageFlip.flipNext();
          else pageFlip.flipPrev();
        } else {
          pageFlip.turnToPage(turnTo);
        }
      } catch (_e) {
        try { pageFlip.turnToPage(turnTo); } catch (_e2) {}
      }
    }

    /*
     * The two pages currently on screen.
     *
     * StPageFlip's real spreads (showCover, landscape) are (1|2), (3|4), (5|6):
     * the ODD page is the LEFT leaf and the even one the right. The earlier
     * helpers above assume the opposite (an odd page as a lone right leaf), so
     * they never tried the right leaf before turning the page. This reads the
     * spread straight from the book's current index instead.
     */
    function currentSpreadLeaves() {
      var cur = pageFlip ? pageFlip.getCurrentPageIndex() : 1;
      var left = cur % 2 === 1 ? cur : cur - 1;
      if (left < 1) left = 1;
      return [left, left + 1].filter(isContentPage);
    }

    /*
     * Put a note on the open spread: LEFT page first; if it has no room, the
     * RIGHT page; only when neither can take it, turn the page and try the next
     * spread. It keeps turning until something has space — stacking it on top of
     * existing notes is the last resort, when the book has no pages left.
     */
    /** Highest page holding any note — where the book's writing currently ends. */
    function lastFilledPage() {
      var last = 1;
      if (!bookEl) return last;
      bookEl.querySelectorAll('.entries-list').forEach(function (list) {
        var idx = Number(list.dataset.flipIndex);
        if (idx > last && list.querySelector('.scatter-note')) last = idx;
      });
      return last;
    }

    function placeOnSpreadOrFlip(draft, attempt, done) {
      done = done || function () {};
      var leaves = currentSpreadLeaves();
      /*
       * A new note continues where the writing ends, not on whatever spread the
       * visitor has flipped to — otherwise it lands on a blank spread ahead of
       * (or a full one behind) the last notes and leaves gaps in the book.
       */
      if (attempt === 0 && pageFlip) {
        var frontier = lastFilledPage();
        var frontierLeft = frontier % 2 === 1 ? frontier : frontier - 1;
        if (leaves.length && leaves[0] !== frontierLeft && isContentPage(frontierLeft)) {
          try { pageFlip.flip(frontierLeft); } catch (_e) { pageFlip.turnToPage(frontierLeft); }
          var wait = prefersReducedMotion.matches ? 0 : FLIPPING_TIME + 60;
          setTimeout(function () { placeOnSpreadOrFlip(draft, 1, done); }, wait);
          return null;
        }
      }
      for (var i = 0; i < leaves.length; i++) {
        var fitted = tryFitNoteOnPage(leaves[i], draft);
        if (fitted) { done(); return fitted; }
      }
      var nextLeft = leaves.length ? leaves[0] + 2 : null;
      if (nextLeft != null && isContentPage(nextLeft) && attempt < 40 && pageFlip) {
        try { pageFlip.flipNext(); } catch (_e) { done(); return forcePlaceOnPage(leaves[leaves.length - 1], draft); }
        var delay = prefersReducedMotion.matches ? 0 : FLIPPING_TIME + 60;
        setTimeout(function () { placeOnSpreadOrFlip(draft, attempt + 1, done); }, delay);
        return null;
      }
      done();
      return forcePlaceOnPage(leaves.length ? leaves[leaves.length - 1] : 1, draft);
    }

    /*
     * One placement at a time. A placement can wait out page turns, and two
     * running at once each turned the book on their own — notes skipped whole
     * spreads. Later notes wait for the one before them to land.
     */
    var placementQueue = [];
    var placementBusy = false;
    function runNextPlacement() {
      if (placementBusy || !placementQueue.length) return;
      placementBusy = true;
      var draft = placementQueue.shift();
      placeOnSpreadOrFlip(draft, 0, function () {
        placementBusy = false;
        runNextPlacement();
      });
    }

    /**
     * Place on the open spread (left, then right) → only flip when both sides
     * are full.
     */
    function placeEntryWithOverflow(message, name) {
      var id = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);

      var draft = {
        id: id,
        message: message,
        name: String(name || '').trim() || '—',
        date: getTodayStamp(),
        rotation: tiltFor(id),
        color: currentPen.ink
      };

      placementQueue.push(draft);
      runNextPlacement();
    }

    function clearNameHintTimer() {
      clearTimeout(nameHintTimer);
      nameHintTimer = null;
    }

    function setNameHint(on) {
      nameHinted = !!on;
      messageForm.classList.toggle('is-hinted', nameHinted);
      if (nameSlot) nameSlot.setAttribute('aria-hidden', nameHinted ? 'false' : 'true');
      if (nameInput) nameInput.tabIndex = nameHinted ? 0 : -1;
      if (!nameHinted && nameInput) nameInput.value = '';
    }

    function scheduleNameHint() {
      clearNameHintTimer();
      nameHintTimer = setTimeout(function () {
        nameHintTimer = null;
        if (phase !== 'open' && phase !== 'opening') return;
        if (!messageInput.value.trim()) return;
        setNameHint(true);
      }, NAME_HINT_MS);
    }

    var coarsePointer = window.matchMedia('(pointer: coarse)');

    function syncMessageMirror() {
      var raw = messageInput.value;
      var empty = raw.length === 0;
      var canSend = !!raw.trim();
      var focused = messageForm.classList.contains('is-focused');
      messageForm.classList.toggle('is-empty', empty);
      messageForm.classList.toggle('is-ready', canSend);
      messageMirror.classList.toggle('is-empty', empty);
      /* Placeholder only when idle+empty; hide on focus so caret is left-most.
         Touch keeps it while focused: the field is focused from the start. */
      messageMirrorText.textContent = empty
        ? (focused && !coarsePointer.matches ? '' : PLACEHOLDER)
        : raw;
      messageSend.disabled = !canSend;
      messageSend.classList.toggle('is-ready', canSend);
    }

    /** keepFocus: touch, after a send, so the keyboard stays up for the next note. */
    function resetMessageField(keepFocus) {
      clearNameHintTimer();
      setNameHint(false);
      messageInput.value = '';
      if (nameInput) nameInput.value = '';
      if (keepFocus) {
        if (document.activeElement !== messageInput) {
          try { messageInput.focus({ preventScroll: true }); } catch (_e) { messageInput.focus(); }
        }
        syncMessageMirror();
        return;
      }
      messageForm.classList.remove('is-focused');
      /* Drop real focus too, or the placeholder stays hidden (idle+empty only). */
      if (document.activeElement === messageInput) messageInput.blur();
      if (nameInput && document.activeElement === nameInput) nameInput.blur();
      syncMessageMirror();
    }

    function penForInk(ink) {
      var key = String(ink || '').toUpperCase();
      for (var i = 0; i < PEN_INKS.length; i++) {
        if (PEN_INKS[i].ink === key) return PEN_INKS[i];
      }
      return null;
    }

    function penById(id) {
      for (var i = 0; i < PEN_INKS.length; i++) {
        if (PEN_INKS[i].id === id) return PEN_INKS[i];
      }
      return null;
    }

    /* Every visit starts on the black pen; the choice lasts only while the
       book is open (hideMessageInput puts black back). */
    var currentPen = PEN_INKS[0];
    var penRack = document.getElementById('pen-rack');

    function selectPen(pen) {
      currentPen = pen;
      penRack.querySelectorAll('.pen').forEach(function (btn) {
        btn.setAttribute('aria-pressed', btn.dataset.pen === pen.id ? 'true' : 'false');
      });
      if (messageDock) messageDock.style.setProperty('--ink', pen.ink);
      syncPenPicker(pen);
    }

    function buildPenRack() {
      PEN_INKS.forEach(function (pen, i) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pen';
        btn.dataset.pen = pen.id;
        btn.style.setProperty('--i', String(i));
        btn.tabIndex = -1;
        btn.setAttribute('aria-label', pen.label + ' ink');
        btn.innerHTML =
          '<span class="pen__body"><img src="pens/pen-' + pen.id +
          '.webp" alt="" width="640" height="78" draggable="false" decoding="async"></span>';
        // Keep focus (and the caret) in the message field while picking.
        btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        btn.addEventListener('click', function () { selectPen(pen); });
        penRack.appendChild(btn);
      });
      selectPen(currentPen);
    }
    buildPenRack();

    /* ── Ink picker variants ─────────────────────────────────────────────
     * body[data-pen-ui] decides how ink is picked; the menu in the lower left
     * switches it. All of them share currentPen / selectPen(). */
    var PEN_UI_STORAGE_KEY = 'guestbook_pen_ui';
    /* The shipped ink picker. While set, every visitor gets it and the
       lower-left switcher stays hidden; set to null to bring the switcher
       (and the other variants) back for comparing. */
    var SHIPPED_PEN_UI = 'bar';
    var PEN_UIS = [
      { id: 'rack', name: 'Rack', note: 'Pens peek in from the right edge' },
      { id: 'tile', name: 'Swatches', note: 'Hover the pen beside the field' },
      { id: 'bar', name: 'Bar', note: 'The pens, held in a bar on the right' },
      { id: 'v4', name: 'Option 4', note: 'Coming soon', soon: true },
      { id: 'v5', name: 'Option 5', note: 'Coming soon', soon: true }
    ];
    var penUi = (function () {
      if (SHIPPED_PEN_UI) return SHIPPED_PEN_UI;
      try {
        var saved = localStorage.getItem(PEN_UI_STORAGE_KEY);
        for (var i = 0; i < PEN_UIS.length; i++) {
          if (PEN_UIS[i].id === saved && !PEN_UIS[i].soon) return saved;
        }
      } catch (_e) {}
      return 'rack';
    })();
    document.body.dataset.penUi = penUi;

    function penUiUsesRack() {
      return penUi === 'rack' || penUi === 'bar';
    }

    /* ── tile: one pen beside the field; hover or tap it for swatches ── */
    /* Swatch layouts (menu > Dot layout). All are measured off the live tile,
       so they track its size and corner radius at every breakpoint:
         corner  dots ride a path parallel to the tile's outline: down its left
                 side, round the bottom-left corner on an arc concentric with
                 the tile's own corner radius, then along the bottom
         grid    two columns of three left of the tile, centred on it
         tray    a pill rising out of the tile with the dots stacked inside
       Phones have no room left of the dock, so corner and grid stack the dots
       up above the tile instead. */
    var SWATCH_LAYOUTS = [
      { id: 'corner', name: 'Corner', note: "Follow the tile's rounded corner" },
      { id: 'grid', name: 'Grid', note: 'Two columns beside the tile' },
      { id: 'tray', name: 'Tray', note: 'A pill rising out of the tile' }
    ];
    var SWATCH_LAYOUT_STORAGE_KEY = 'guestbook_swatch_layout';
    var swatchLayout = (function () {
      try {
        var saved = localStorage.getItem(SWATCH_LAYOUT_STORAGE_KEY);
        for (var i = 0; i < SWATCH_LAYOUTS.length; i++) {
          if (SWATCH_LAYOUTS[i].id === saved) return saved;
        }
      } catch (_e) {}
      return 'corner';
    })();
    document.body.dataset.swatchLayout = swatchLayout;
    var phoneQuery = window.matchMedia('(max-width: 640px)');
    var PICKER_SWATCHES = [
      { id: 'black', color: '#111111' },
      { id: 'pink', color: '#EC4C8E' },
      { id: 'orange', color: '#F2733A' },
      { id: 'green', color: '#8CC63F' },
      { id: 'blue', color: '#3B82F6' },
      { id: 'purple', color: '#9C6CF5' }
    ];

    /** n points evenly spaced along a chain of segments, ends included. */
    function spreadAlong(segs, n) {
      var total = 0;
      segs.forEach(function (sg) { total += sg.len; });
      var out = [];
      for (var i = 0; i < n; i++) {
        var d = total * i / (n - 1);
        for (var k = 0; k < segs.length; k++) {
          var sg = segs[k];
          if (d <= sg.len || k === segs.length - 1) {
            out.push(sg.at(sg.len ? Math.min(1, d / sg.len) : 0));
            break;
          }
          d -= sg.len;
        }
      }
      return out;
    }

    /** Swatch centres in px, origin at the tile's top-left. */
    function swatchPoints(layout, T, rc, n) {
      var D, pts = [], i;
      if (layout === 'tray') {
        D = T * 0.34;
        var trayGap = 8;
        var step = D + Math.round(T * 0.17);
        var pad = (T - D) / 2;
        for (i = 0; i < n; i++) pts.push([T / 2, -trayGap - pad - D / 2 - i * step]);
        return {
          D: D, pts: pts, pull: 0.05,
          tray: { gap: trayGap, h: 2 * pad + n * D + (n - 1) * (step - D) }
        };
      }
      D = T * 0.27;
      if (phoneQuery.matches) {
        for (i = 0; i < n; i++) pts.push([T / 2, -(10 + D / 2) - i * (D + 8)]);
        return { D: D, pts: pts, pull: 0.06 };
      }
      if (layout === 'grid') {
        var pitch = D + Math.round(T * 0.13);
        var right = -(Math.round(T * 0.24) + D / 2);
        for (i = 0; i < n; i++) {
          var col = i < 3 ? 0 : 1;
          pts.push([right - col * pitch, T / 2 + ((i % 3) - 1) * pitch]);
        }
        return { D: D, pts: pts, pull: 0.25 };
      }
      // corner
      var off = Math.round(T * 0.17) + D / 2;
      var R = rc + off;
      var y0 = D / 2;
      var x1 = T - D / 2;
      pts = spreadAlong([
        { len: Math.max(0, T - rc - y0), at: function (t) { return [-off, y0 + t * (T - rc - y0)]; } },
        { len: Math.PI / 2 * R, at: function (t) {
          var a = Math.PI - t * Math.PI / 2;
          return [rc + R * Math.cos(a), T - rc + R * Math.sin(a)];
        } },
        { len: Math.max(0, x1 - rc), at: function (t) { return [rc + t * (x1 - rc), T + off]; } }
      ], n);
      return { D: D, pts: pts, pull: 0.25 };
    }

    var penPicker = document.getElementById('pen-picker');
    var penPickerTile = penPicker.querySelector('.pen-picker__tile');
    var penPickerPen = penPicker.querySelector('.pen-picker__pen');
    /* The ink layer on top; a swap stacks a new one over it. */
    var penPickerInk = penPicker.querySelector('.pen-picker__ink');
    var penPickerSwatches = penPicker.querySelector('.pen-picker__swatches');
    var pickerOpen = false;
    var pickerCloseTimer = null;
    var pickerPointer = 'mouse';
    var pickerToggledAt = -Infinity;
    var penPickerTray = null;

    /* Place the dots for the current layout and size the hover bridge to
       cover them. Cheap; run whenever the picker opens or the tile resizes. */
    function layoutSwatches() {
      if (!penPicker || penUi !== 'tile') return;
      var T = penPickerTile.offsetWidth;
      if (!T) return;
      var rc = Math.min(T / 2, parseFloat(getComputedStyle(penPickerTile).borderTopLeftRadius) || 0);
      var btns = penPickerSwatches.querySelectorAll('.pen-picker__swatch');
      var lay = swatchPoints(swatchLayout, T, rc, btns.length);
      var minX = 0, minY = 0, maxX = T, maxY = T;
      btns.forEach(function (btn, i) {
        var p = lay.pts[i];
        btn.style.setProperty('--wx', (p[0] / T).toFixed(4));
        btn.style.setProperty('--wy', (p[1] / T).toFixed(4));
        minX = Math.min(minX, p[0] - lay.D / 2);
        minY = Math.min(minY, p[1] - lay.D / 2);
        maxX = Math.max(maxX, p[0] + lay.D / 2);
        maxY = Math.max(maxY, p[1] + lay.D / 2);
      });
      if (lay.tray) {
        penPicker.style.setProperty('--tray-gap', lay.tray.gap + 'px');
        penPicker.style.setProperty('--tray-h', lay.tray.h.toFixed(1) + 'px');
        minY = Math.min(minY, -lay.tray.gap - lay.tray.h);
      }
      var pad = 10;
      penPicker.style.setProperty('--swatch', lay.D.toFixed(2) + 'px');
      penPicker.style.setProperty('--pull', String(lay.pull));
      penPicker.style.setProperty('--bridge-l', (minX - pad).toFixed(1) + 'px');
      penPicker.style.setProperty('--bridge-t', (minY - pad).toFixed(1) + 'px');
      penPicker.style.setProperty('--bridge-r', (T - maxX - pad).toFixed(1) + 'px');
      penPicker.style.setProperty('--bridge-b', (T - maxY - pad).toFixed(1) + 'px');
    }
    /* Swatches variant: the first character typed in a visit fans the
       swatches out and pins them open (hover-out and outside clicks no longer
       close them) until a colour is picked or the message is sent. */
    var pickerPinned = false;
    var inkChosen = false;

    /** force: close even while pinned (book closing, variant switch, Esc). */
    function setPickerOpen(on, force) {
      if (!on && pickerPinned && !force) return;
      if (!on) pickerPinned = false;
      clearTimeout(pickerCloseTimer);
      pickerCloseTimer = null;
      if (!penPicker || pickerOpen === on) return;
      if (on) layoutSwatches();
      pickerOpen = on;
      var now = performance.now();
      penPicker.classList.toggle('is-quick', now - pickerToggledAt < 360);
      pickerToggledAt = now;
      penPicker.classList.toggle('is-open', on);
      penPickerTile.setAttribute('aria-expanded', on ? 'true' : 'false');
      penPickerSwatches.querySelectorAll('.pen-picker__swatch').forEach(function (btn) {
        btn.tabIndex = on ? 0 : -1;
      });
    }

    /* Re-ink, don't replace: the new pen fades in over the old one, settling
       up 3px out of a soft blur. Barrels match, so only the tip and collar
       visibly change. Quick repeat picks stack cleanly: any layer still
       fading out is dropped. */
    function swapPickerPen(src) {
      var old = penPickerInk;
      var next = old.cloneNode(true);
      next.querySelector('img').src = src;
      penPickerPen.querySelectorAll('.pen-picker__ink').forEach(function (layer) {
        if (layer !== old) layer.remove();
      });
      var from = parseFloat(getComputedStyle(old).opacity);
      old.getAnimations().forEach(function (a) { a.cancel(); });
      penPickerPen.appendChild(next);
      penPickerInk = next;
      next.animate(
        [
          { opacity: 0, transform: 'translateY(3px)', filter: 'blur(2px)' },
          { opacity: 1, transform: 'none', filter: 'blur(0px)' }
        ],
        { duration: 240, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }
      );
      var fade = old.animate(
        [
          { opacity: isNaN(from) ? 1 : from, filter: 'blur(0px)' },
          { opacity: 0, filter: 'blur(2px)' }
        ],
        { duration: 200, easing: 'ease', fill: 'forwards' }
      );
      fade.onfinish = function () { old.remove(); };
    }

    function syncPenPicker(pen) {
      if (!penPicker) return;
      penPickerSwatches.querySelectorAll('.pen-picker__swatch').forEach(function (btn) {
        btn.setAttribute('aria-pressed', btn.dataset.pen === pen.id ? 'true' : 'false');
      });
      var src = 'pens/pen-' + pen.id + '.webp';
      if (penPickerInk.querySelector('img').getAttribute('src') === src) return;
      var shown = penUi === 'tile' && messageDock.classList.contains('is-visible');
      if (!shown || prefersReducedMotion.matches || !penPickerInk.animate) {
        penPickerInk.querySelector('img').src = src;
        return;
      }
      swapPickerPen(src);
    }

    function buildPenPicker() {
      penPickerTray = document.createElement('span');
      penPickerTray.className = 'pen-picker__tray';
      penPickerTray.setAttribute('aria-hidden', 'true');
      penPickerSwatches.appendChild(penPickerTray);
      PICKER_SWATCHES.forEach(function (spot, i) {
        var pen = penById(spot.id);
        if (!pen) return;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pen-picker__swatch';
        btn.dataset.pen = pen.id;
        btn.tabIndex = -1;
        btn.setAttribute('aria-label', pen.label + ' ink');
        btn.style.setProperty('--i', String(i));
        btn.style.setProperty('--swatch-c', spot.color);
        btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        btn.addEventListener('click', function () {
          var wasPinned = pickerPinned;
          inkChosen = true;
          pickerPinned = false;
          selectPen(pen);
          // Touch has no hover-out, and a pinned picker was opened by typing
          // rather than hover: let the swap play, then fold away. A mouse
          // still over the picker closes it on leave as usual.
          if (pickerPointer !== 'mouse' || (wasPinned && !penPicker.matches(':hover'))) {
            clearTimeout(pickerCloseTimer);
            pickerCloseTimer = setTimeout(function () { setPickerOpen(false); }, 520);
          }
        });
        penPickerSwatches.appendChild(btn);
      });

      penPicker.addEventListener('pointerdown', function (e) { pickerPointer = e.pointerType || 'mouse'; });
      penPicker.addEventListener('pointerenter', function (e) {
        if (e.pointerType !== 'mouse') return;
        setPickerOpen(true);
      });
      penPicker.addEventListener('pointerleave', function (e) {
        if (e.pointerType !== 'mouse') return;
        clearTimeout(pickerCloseTimer);
        pickerCloseTimer = setTimeout(function () { setPickerOpen(false); }, 160);
      });
      // Keep focus (and the caret) in the message field while picking.
      penPickerTile.addEventListener('mousedown', function (e) { e.preventDefault(); });
      penPickerTile.addEventListener('click', function (e) {
        // Mouse already opened it on hover; a click there should not close it.
        var viaMouse = pickerPointer === 'mouse' && e.detail > 0;
        setPickerOpen(viaMouse ? true : !pickerOpen);
      });
      document.addEventListener('pointerdown', function (e) {
        if (pickerOpen && !penPicker.contains(e.target)) setPickerOpen(false);
      });

      // First character of the visit: offer the inks and hold them open.
      messageInput.addEventListener('input', function () {
        if (penUi !== 'tile' || inkChosen || pickerPinned) return;
        if (!messageInput.value.length) return;
        setPickerOpen(true);
        pickerPinned = true;
      });
      // Sending keeps the pen in hand, which counts as the choice.
      messageForm.addEventListener('submit', function () {
        if (!pickerPinned) return;
        inkChosen = true;
        setPickerOpen(false, true);
      });

      window.addEventListener('resize', layoutSwatches);

      penPickerInk.querySelector('img').src = 'pens/pen-' + currentPen.id + '.webp';
      syncPenPicker(currentPen);
      layoutSwatches();
    }
    buildPenPicker();

    /* ── Variant menu ── */
    var penUiMenu = document.getElementById('pen-ui-menu');
    var penUiTrigger = penUiMenu.querySelector('.pen-ui-menu__trigger');
    var penUiValue = penUiMenu.querySelector('.pen-ui-menu__value');
    var penUiList = penUiMenu.querySelector('.pen-ui-menu__list');
    var penUiMenuOpen = false;

    function setPenUiMenuOpen(on) {
      penUiMenuOpen = !!on;
      penUiMenu.classList.toggle('is-open', penUiMenuOpen);
      penUiTrigger.setAttribute('aria-expanded', penUiMenuOpen ? 'true' : 'false');
      penUiList.querySelectorAll('.pen-ui-menu__item').forEach(function (btn) {
        btn.tabIndex = penUiMenuOpen && !btn.disabled ? 0 : -1;
      });
    }

    function setPenUiMenuVisible(on) {
      if (SHIPPED_PEN_UI) on = false;
      penUiMenu.classList.toggle('is-visible', on);
      penUiMenu.setAttribute('aria-hidden', on ? 'false' : 'true');
      penUiTrigger.tabIndex = on ? 0 : -1;
      if (!on) setPenUiMenuOpen(false);
    }

    function syncPenUiMenu() {
      PEN_UIS.forEach(function (ui) {
        if (ui.id === penUi) penUiValue.textContent = ui.name;
      });
      if (penUi === 'tile') {
        SWATCH_LAYOUTS.forEach(function (l) {
          if (l.id === swatchLayout) penUiValue.textContent += ' \u00B7 ' + l.name;
        });
      }
      penUiList.querySelectorAll('.pen-ui-menu__item[data-ui]').forEach(function (btn) {
        btn.setAttribute('aria-checked', btn.dataset.ui === penUi ? 'true' : 'false');
      });
      penUiList.querySelectorAll('.pen-ui-menu__item[data-layout]').forEach(function (btn) {
        btn.setAttribute('aria-checked', btn.dataset.layout === swatchLayout ? 'true' : 'false');
      });
    }

    function setSwatchLayout(id) {
      swatchLayout = id;
      document.body.dataset.swatchLayout = id;
      try { localStorage.setItem(SWATCH_LAYOUT_STORAGE_KEY, id); } catch (_e) {}
      setPickerOpen(false, true);
      layoutSwatches();
      syncPenUiMenu();
      // Fan the new layout out so it can be judged straight away; it folds
      // on the next click elsewhere or hover in-and-out, as usual.
      setTimeout(function () {
        if (penUi === 'tile' && messageDock.classList.contains('is-visible')) setPickerOpen(true);
      }, 160);
    }

    function setPenUi(id) {
      if (id === penUi) return;
      var dockShown = messageDock.classList.contains('is-visible');
      // Drop the outgoing picker at once, then let the new one make its entrance.
      penRack.classList.add('is-instant');
      setPenRackVisible(false);
      setPickerOpen(false, true);
      void penRack.offsetWidth;
      penUi = id;
      document.body.dataset.penUi = id;
      try { localStorage.setItem(PEN_UI_STORAGE_KEY, id); } catch (_e) {}
      syncPenUiMenu();
      void penRack.offsetWidth;
      penRack.classList.remove('is-instant');
      if (!dockShown) return;
      requestAnimationFrame(function () {
        if (!messageDock.classList.contains('is-visible')) return;
        setPenRackVisible(true);
        if (id === 'tile') layoutSwatches();
        if (id === 'tile' && penPicker.animate && !prefersReducedMotion.matches) {
          penPicker.animate(
            [{ opacity: 0, transform: 'scale(0.9)' }, { opacity: 1, transform: 'none' }],
            { duration: 260, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }
          );
        }
      });
    }

    PEN_UIS.forEach(function (ui, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pen-ui-menu__item';
      btn.setAttribute('role', 'menuitemradio');
      btn.dataset.ui = ui.id;
      btn.tabIndex = -1;
      btn.disabled = !!ui.soon;
      btn.innerHTML =
        '<span class="pen-ui-menu__num">' + (i + 1) + '</span>' +
        '<span class="pen-ui-menu__text"><span class="pen-ui-menu__name">' + ui.name +
        '</span><span class="pen-ui-menu__note">' + ui.note + '</span></span>';
      btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
      btn.addEventListener('click', function () {
        setPenUi(ui.id);
        setPenUiMenuOpen(false);
      });
      penUiList.appendChild(btn);
    });

    var swatchLayoutGroup = document.createElement('div');
    swatchLayoutGroup.className = 'pen-ui-menu__sub';
    swatchLayoutGroup.setAttribute('role', 'group');
    swatchLayoutGroup.setAttribute('aria-label', 'Dot layout');
    swatchLayoutGroup.innerHTML = '<p class="pen-ui-menu__heading">Dot layout</p>';
    SWATCH_LAYOUTS.forEach(function (l, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pen-ui-menu__item';
      btn.setAttribute('role', 'menuitemradio');
      btn.dataset.layout = l.id;
      btn.tabIndex = -1;
      btn.innerHTML =
        '<span class="pen-ui-menu__num pen-ui-menu__num--sub">' + String.fromCharCode(65 + i) + '</span>' +
        '<span class="pen-ui-menu__text"><span class="pen-ui-menu__name">' + l.name +
        '</span><span class="pen-ui-menu__note">' + l.note + '</span></span>';
      btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
      btn.addEventListener('click', function () {
        setPenUiMenuOpen(false);
        setSwatchLayout(l.id);
      });
      swatchLayoutGroup.appendChild(btn);
    });
    penUiList.appendChild(swatchLayoutGroup);
    syncPenUiMenu();

    penUiTrigger.addEventListener('mousedown', function (e) { e.preventDefault(); });
    penUiTrigger.addEventListener('click', function () { setPenUiMenuOpen(!penUiMenuOpen); });
    // Clicks here must not reach the frost (which closes the book).
    penUiMenu.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('pointerdown', function (e) {
      if (penUiMenuOpen && !penUiMenu.contains(e.target)) setPenUiMenuOpen(false);
    });
    // Esc folds an open popover before it closes the book.
    window.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || (!penUiMenuOpen && !pickerOpen)) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      setPenUiMenuOpen(false);
      setPickerOpen(false, true);
    }, true);

    /** Side of the viewport the rack hangs from: right if it clears the book. */
    function placePenRack() {
      var cs = getComputedStyle(penRack);
      var reach = parseFloat(cs.getPropertyValue('--pen-peek')) +
        parseFloat(cs.getPropertyValue('--pen-selected')) + 12;
      if (penUi === 'bar') {
        reach += parseFloat(cs.getPropertyValue('--bar-pad-l')) +
          parseFloat(cs.getPropertyValue('--bar-inset'));
      }
      var stageEl = document.getElementById('stage');
      var stage = stageEl.getBoundingClientRect();
      penRack.classList.toggle('is-bottom', window.innerWidth - stage.right < reach);
      document.body.classList.toggle('has-bottom-pens',
        penRack.classList.contains('is-visible') && penRack.classList.contains('is-bottom'));
      // The bar centres on the open book, not the viewport: the book sits
      // above centre to leave room for the message dock. Measured from layout
      // (offsets), not the bounding box, so the stage's open / dock transform
      // mid-flight cannot skew it. (.pen-rack's translateY(-50%) does the rest.)
      if (penUi === 'bar' && !penRack.classList.contains('is-bottom')) {
        var y = stageEl.offsetHeight / 2;
        for (var el = stageEl; el; el = el.offsetParent) y += el.offsetTop;
        penRack.style.top = y.toFixed(1) + 'px';
      } else {
        penRack.style.top = '';
      }
    }

    window.addEventListener('resize', function () {
      if (penRack.classList.contains('is-visible')) placePenRack();
    });

    function setPenRackVisible(on) {
      on = on && penUiUsesRack();
      if (on) placePenRack();
      document.body.classList.toggle('has-bottom-pens', on && penRack.classList.contains('is-bottom'));
      penRack.classList.toggle('is-visible', on);
      penRack.setAttribute('aria-hidden', on ? 'false' : 'true');
      penRack.querySelectorAll('.pen').forEach(function (btn) {
        btn.tabIndex = on ? 0 : -1;
      });
    }

    function scheduleMessageInputShow() {
      clearTimeout(inputShowTimer);
      var delay = prefersReducedMotion.matches ? 0 : INPUT_SHOW_DELAY_MS;
      inputShowTimer = setTimeout(function () {
        if (phase !== 'opening' && phase !== 'open') return;
        messageDock.classList.add('is-visible');
        messageDock.setAttribute('aria-hidden', 'false');
        document.querySelectorAll('.page-turn-hint').forEach(function (hint) {
          hint.classList.add('is-visible');
        });
        setPenRackVisible(true);
        setPenUiMenuVisible(true);
        setBookCloseVisible(true);
        handKeyboardToField();
      }, delay);
    }

    function hideMessageInput() {
      clearTimeout(inputShowTimer);
      clearNameHintTimer();
      messageDock.classList.remove('is-visible');
      messageDock.setAttribute('aria-hidden', 'true');
      document.querySelectorAll('.page-turn-hint').forEach(function (hint) {
        hint.classList.remove('is-visible');
      });
      setPenRackVisible(false);
      setPickerOpen(false, true);
      setPenUiMenuVisible(false);
      setBookCloseVisible(false);
      dropKeyboardProxy();
      resetMessageField();
      // Drop any keyboard fit before the book flies home.
      var st = document.getElementById('stage');
      if (st) { st.style.translate = ''; st.style.scale = ''; }
      var sl = messageDock.querySelector('.message-dock-slot');
      if (sl) sl.style.translate = '';
      penRack.style.bottom = '';
      document.body.classList.remove('kb-open');
      // Next visit starts fresh: black pen, and the swatches prompt again.
      inkChosen = false;
      selectPen(PEN_INKS[0]);
    }

    function commitMessage() {
      if (phase !== 'open' && phase !== 'opening') return;
      var raw = String(messageInput.value || '').trim();
      var cleaned = sanitizeEnglishOnly(messageInput.value).trim();
      if (!cleaned) {
        // Typing something the book cannot letter used to clear the field and
        // drop the message without a word. Keep the text and explain instead.
        if (raw) {
          showMessageError(UNSUPPORTED_MSG);
          return;
        }
        resetMessageField();
        return;
      }

      var name = sanitizeEnglishOnly(nameInput ? nameInput.value : '').trim();

      if (window.ProfanityFilter) {
        var gate = ProfanityFilter.checkProfanity(cleaned, name);
        if (!gate.ok) {
          showMessageError(gate.reason);
          return;
        }
      }

      clearMessageError();
      placeEntryWithOverflow(cleaned, name);
      // Touch: the keyboard stays up, ready for another note.
      resetMessageField(coarsePointer.matches);
    }

    /** Unclip stage while hard cover flaps open/closed */
    function setCoverFlipping(active) {
      document.body.classList.toggle('is-cover-flipping', active);
    }

    /** Click-open stage — right-page notebook art + spine-square radii */
    function setBookOpening(active) {
      document.body.classList.toggle('is-book-opening', active);
    }

    /**
     * Reveal/hide the split open-spread on #open-staging (is-notebook).
     * For initial open: call ONLY when the cover flap lands (see flip handler).
     * Decode is pre-warmed offscreen via warmNotebookBackground / #notebook-paint-warm.
     */
    function setNotebookVisible(on) {
      bookWrapper.classList.toggle('is-notebook', on);
      if (!on) bookWrapper.classList.remove('is-hiding-left');
    }

    /** Clear left half immediately so cover can flap closed without fighting bg */
    function hideLeftNotebook() {
      bookWrapper.classList.add('is-hiding-left');
    }

    /**
     * Cover 0→1 open just finished — show BOTH OpenNotebookLeft + Right
     * in this same callback frame (no setTimeout). Opening flag off; staging

   * frost; docked, the book has just landed in the slot, so it reads as a
   * blink. Hand over the moment PageFlip goes; the page's own timeout then
   * re-applies the same classes harmlessly.
   */
  function bindHandoff() {
    var bw = document.getElementById('book-wrapper');
    if (!bw) return;
    new MutationObserver(function () {
      if (!document.body.classList.contains('is-closing-home')) return;
      if (bw.classList.contains('is-visible')) return;
      var cw = document.getElementById('closed-book');
      if (!cw || !cw.classList.contains('is-hidden')) return;
      var bk = document.getElementById('css-book');
      var bkPrev = bk ? bk.style.transition : null;
      if (bk) bk.style.transition = 'none';
      cw.classList.remove('is-hidden', 'is-opening', 'is-swap');
      cw.classList.add('is-closed');
      if (bk) {
        /*
         * Square for the whole trip. The docked book is only squared up by
         * `body.is-docked .book-wrap.is-closed`, which does not settle until
         * part-way through the travel — so the book arrived tilted, then
         * snapped square a few frames later at a scale solved for the square
         * one, a ~13px pop right at the landing. Pinned here, it is the same
         * shape the scale was measured against from the first frame.
         */
        bk.style.transform = 'rotateX(0deg) rotateY(0deg)';
        void bk.offsetWidth;
        /*
         * Hold the easing off until the book is home and the host's refit has
         * run. Restored on the next frame instead, .book spent 0.7s easing
         * rotateY(-10deg) -> 0 *while* the shrink was measuring it: the fit
         * read a narrow, still-turning book, cached that scale, and the book
         * swelled ~13px and then got snapped back — the flicker in the footer
         * at the end of every close. Hover gets its easing back afterwards.
         */
        clearTimeout(bk.__easeTimer);
        bk.__easeTimer = setTimeout(function () {
          bk.style.transform = '';
          bk.style.transition = bkPrev || '';
        }, 900);
      }
    }).observe(bw, { attributes: true, attributeFilter: ['class'] });
  }
  if (document.body) bindHandoff();
  else document.addEventListener('DOMContentLoaded', bindHandoff);

  var mo = new MutationObserver(report);
  mo.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  function watchClosedWrap() {
    var el = document.getElementById('closed-book');
    if (el) mo.observe(el, { attributes: true, attributeFilter: ['class'] });
  }
  if (document.body) { watchClosedWrap(); rememberBook(); }
  else document.addEventListener('DOMContentLoaded', function () { watchClosedWrap(); rememberBook(); });
  post('ready');
  report();
})();
</script>
</body>
</html>
