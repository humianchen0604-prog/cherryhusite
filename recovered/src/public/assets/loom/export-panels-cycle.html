<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom — Export Panels Cycle</title>
<style>
  :root{
    --paper:#fff; --ink:#1a1a1a;
    --lime:#D1FF4A; --lime-tint:#F7FFE0;
    --purple:#C9A3F7;
    --amber:#FCE7B8; --amber-tint:#FFF8E8; --amber-ink:#8a5a00;
    --muted-bg:#FAFAFA; --line:rgba(0,0,0,.1);
    --t80:rgba(0,0,0,.8); --t60:rgba(0,0,0,.6); --t40:rgba(0,0,0,.4);
    --radius-card:24px; --radius-sec:12px;
    --shadow-card:0 4px 24px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --font:'SF Pro Text','SF Pro Display',-apple-system,BlinkMacSystemFont,Inter,'Helvetica Neue',Arial,sans-serif;
    --mono:'SF Mono',ui-monospace,'Menlo','Consolas',monospace;
    /* Emil: strong custom curves — never ease-in for UI */
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);background:#fafafa;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;-webkit-font-smoothing:antialiased;overflow:hidden;
  }

  /* ---------- Canvas ---------- */
  #canvas{display:flex;align-items:center;justify-content:center;padding:36px;min-height:100vh;width:100%}
  .card{
    background:var(--paper);border:.5px solid var(--line);border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);position:relative;overflow:hidden;
    display:flex;flex-direction:column;
    /* Scaled down to fit whatever height the host frame gives this embed —
       --fit-scale is computed in JS from the iframe's own viewport height,
       so the whole 530x640 card shrinks uniformly (both axes) instead of
       just having its height capped and its content squished. Constant, not
       part of the open/close transition, so switching panels is a pure fade
       with no zoom. transform-origin:center so it scales in place. */
    transform-origin:center center;
    transform:scale(var(--fit-scale, .8));
    opacity:0;
    transition:opacity 280ms var(--ease-out);
    will-change:opacity;
  }
  .card.is-open{opacity:1}
  .card.is-closing{
    opacity:0;
    transition:opacity 180ms var(--ease-out);
  }
  .card.narrow{width:530px;height:640px}
  /* Fixed natural size — the fit-to-frame shrinking happens entirely via the
     --fit-scale transform above, not by capping this against 100vh (that
     squished the card instead of scaling it, and fought the transform). */
  .card.a-wide{width:530px;height:640px}

  @media (prefers-reduced-motion:reduce){
    .card,.card.is-open,.card.is-closing{
      transition:opacity 160ms ease;
    }
  }

  /* Same top wash as the live export panel (Figma ellipse positions) */
  .blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .blob{position:absolute;border-radius:50%;pointer-events:none}
  .blob.l{
    width:772px;height:127px;left:-354.5px;top:-126.5px;
    background:radial-gradient(ellipse at 60% 80%,#c7a2ff 0%,#ddc4ff 50%,transparent 75%);
    filter:blur(40px);opacity:.7
  }
  .blob.r{
    width:418px;height:127px;right:-165.5px;left:auto;top:-126.5px;
    background:radial-gradient(ellipse at 40% 80%,#d5ff3c 0%,#e8ffaa 50%,transparent 75%);
    filter:blur(36px);opacity:.6
  }

  .head{position:relative;z-index:2;padding:26px 16px 14px 24px;background:transparent;display:flex;align-items:flex-start;gap:10px}
  .head-copy{flex:1;min-width:0}
  .head .title{font-size:18px;font-weight:600;letter-spacing:-.2px}
  .head .subtitle{font-size:12.5px;color:var(--t60);margin-top:7px;line-height:1.5}
  .head .meta{font-size:11px;color:var(--t60);margin-top:6px;display:flex;align-items:center;gap:6px}
  .head-close{
    width:28px;height:28px;flex-shrink:0;margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;border-radius:8px;
    color:rgba(0,0,0,.38);cursor:pointer;
    transition:background-color .15s ease,color .15s ease
  }
  .head-close:hover{background:rgba(0,0,0,.05);color:rgba(0,0,0,.7)}
  .head-close:active{transform:scale(.96)}

  /* Mask the wrap — not the scroller. Top fade stays off until the user
     scrolls; then content dissolves into the blob wash instead of cropping. */
  .body-wrap{
    flex:1;min-height:0;position:relative;overflow:hidden;z-index:1;
    --mask-top:1;--mask-bot:0;
    -webkit-mask-image:linear-gradient(to bottom,
      rgb(0 0 0 / var(--mask-top)) 0,
      #000 48px,
      #000 calc(100% - 40px),
      rgb(0 0 0 / var(--mask-bot)) 100%);
    mask-image:linear-gradient(to bottom,
      rgb(0 0 0 / var(--mask-top)) 0,
      #000 48px,
      #000 calc(100% - 40px),
      rgb(0 0 0 / var(--mask-bot)) 100%);
  }
  .body{
    height:100%;overflow-y:auto;overflow-x:hidden;padding:4px 16px 16px;
    display:flex;flex-direction:column;gap:12px;
    overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none
  }
  .body::-webkit-scrollbar{display:none}

  .footer{display:flex;padding:14px 24px 20px;background:linear-gradient(0deg,#fff 60%,rgba(255,255,255,0));position:relative;z-index:2}
  .btn{
    width:100%;height:42px;border:0;border-radius:100px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
    transition:transform 160ms var(--ease-out);
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--ink);color:#fff}

  /* ---------- stat cards — stacked, each a full-width row: value top, label+visual bottom ---------- */
  .stat-cards{display:flex;flex-direction:column;gap:12px}
  .stat-card{background:var(--muted-bg);border-radius:8px;padding:14px 17px;display:flex;flex-direction:column;height:82px;box-sizing:border-box}
  .stat-card .val{font-size:24px;font-weight:600;letter-spacing:-.3px;line-height:1;color:#1b1b1b}
  .stat-card .val.mono{font-family:var(--mono);font-size:20px}
  .stat-card .stat-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:auto;min-height:28px}
  .stat-card .lbl{font-size:14px;color:#1b1b1b;opacity:.6;margin:0;line-height:1.2;white-space:nowrap;flex:1;min-width:0}
  .stat-card .vis{flex:none;display:flex;align-items:flex-end;min-height:28px}

  .vis-bar{width:69px;height:8px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden}
  .vis-bar-fill{height:100%;border-radius:4px}

  .vis-dots{display:flex;gap:6px}
  .vd{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.13);flex:none}

  .vis-ic{width:28px;height:28px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center}
  .vis-ic svg{width:17px;height:17px;color:var(--t60);stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tone-amber .vis-ic{background:#FBE9A6}
  .tone-amber .vis-ic svg{color:var(--amber-ink)}

  .st-week{display:flex;gap:3px}
  .week-seg{width:15px;height:15px;border-radius:4px;background:rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:700;color:var(--t40);flex:none}

  /* Concept A: two-column top row */
  .a-top{display:flex;gap:16px;align-items:stretch}
  .a-top-left{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px}
  .a-top-right{flex:1 1 0;min-width:0;display:flex}
  .ci-panel{background:var(--muted-bg);border-radius:16px;overflow:hidden;flex:1;min-height:0;height:100%;display:flex;flex-direction:column}
  .ci-month{padding:12px 16px 8px}
  .ci-row{display:flex;justify-content:space-between;gap:4px}
  .ci-day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--t40);flex:1;min-width:0}
  .ci-day .n{font-size:12px;font-weight:600;color:var(--ink);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .ci-day.today .n{background:var(--ink);color:#fff}
  .ci-day.event .n{background:#C9A3F7;color:#fff}
  .ci-list{padding:0 14px 8px;flex:1;display:flex;flex-direction:column;justify-content:center}
  .ci-item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
  .ci-item:last-child{border-bottom:0}
  .ci-mark{width:3px;height:24px;border-radius:2px;flex:none}
  .ci-item .t{font-size:12px;font-weight:600}
  .ci-item .d{font-size:10.5px;color:var(--t40);margin-top:1px}

  /* ---------- section primitives (Concept A) ---------- */
  .sec{background:#fafafa;border-radius:12px;padding:16px 12px 12px}
  .sec.dashed{background:#fafafa;border:0}
  .sec-head{display:flex;gap:8px;align-items:flex-start}
  .sec-icon{flex:none;width:16.5px;height:16.5px;color:#D079F2;display:block;margin-top:0}
  .sec-text{flex:1;min-width:0}
  .sec-title{font-size:16px;font-weight:500;color:#000;letter-spacing:0;line-height:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variation-settings:'wdth' 100}
  .sec-desc{font-size:13px;font-weight:400;color:rgba(0,0,0,.45);margin-top:4px;margin-bottom:0;line-height:1.35;font-variation-settings:'wdth' 100}
  .ai-tag{font-size:10px;font-weight:500;color:rgba(0,0,0,.4);border:1px dashed rgba(0,0,0,.2);border-radius:100px;padding:1px 7px}

  .swrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .sec-head + .hexgrid,.sec-head + .spec-table,.sec-head + .textblock,.sec-head + .cklist,.sec-head + .conflict,.sec-head + .pills,.sec-head + .swrow{margin-top:12px}
  .sw{width:100px}
  .sw .box{width:100px;height:100px;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.06)}
  .sw video.box{object-fit:cover;object-position:center;display:block}
  .sw .cap{font-size:12px;color:rgba(0,0,0,.4);margin-top:6px;line-height:1.3;font-variation-settings:'wdth' 100}
  .sw-img{width:100px;height:100px;border-radius:8px;object-fit:cover;background:#f0eeec;flex:none;display:block}

  .hexgrid{display:grid;grid-template-columns:repeat(var(--hex-cols,3),minmax(0,1fr));gap:8px;margin-top:12px}
  .hexcard{border-radius:10px;padding:10px 11px 11px;min-height:58px;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;gap:3px}
  .hexcard .name{font-size:12px;font-weight:600;letter-spacing:-.2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variation-settings:'wdth' 100}
  .hexcard .code{font-size:10px;font-weight:400;margin-top:0;line-height:1.2;letter-spacing:.01em;font-variant-numeric:tabular-nums;font-variation-settings:'wdth' 100}

  .cklist{display:flex;flex-direction:column;gap:16px;margin-top:12px}
  .ckitem{display:flex;gap:10px;align-items:flex-start}
  .ckbox{
    flex:none;width:16px;height:16px;border-radius:5px;
    border:1.5px solid rgba(0,0,0,.18);background:#fff;margin-top:2px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s;user-select:none
  }
  .ckbox.checked{background:#000;border-color:#000}
  .ckbox .ck-mark{display:none;width:10px;height:10px}
  .ckbox.checked .ck-mark{display:block}
  .cktext .l{font-size:15px;font-weight:400;color:#000;line-height:1.4;margin-top:-1px;font-variation-settings:'wdth' 100}
  .cktext .d{font-size:12px;color:rgba(0,0,0,.4);margin-top:2px;font-variation-settings:'wdth' 100}

  /* Body content lines up with the title, not the icon (16.5 + 8) */
  .spec-table,.cklist,.pills,.textblock,.hexgrid,.swrow,.conflict{
    margin-left:24.5px
  }
  .spec-table{margin-top:12px;border-top:0}
  .spec-row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid rgba(0,0,0,.06);border-bottom:0;font-size:13px}
  .spec-row:first-child{border-top:0}
  .spec-row .k{color:rgba(0,0,0,.45);font-weight:400}
  .spec-row .v{font-weight:500;color:#000;text-align:right}

  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .pill{background:#eeeeee;border:0;outline:0;box-shadow:none;border-radius:100px;padding:6px 12px;font-size:13px;color:#000}

  .textblock{font-size:13px;line-height:1.5;margin-top:12px;color:rgba(0,0,0,.85);font-variation-settings:'wdth' 100}

  .conflict{border-radius:10px;padding:10px 11px;background:#fff;margin-top:12px}
  .conflict:first-of-type{margin-top:12px}
  .conflict .parties{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
  .chip{font-size:12px;background:#fafafa;border-radius:100px;padding:3px 9px 3px 4px;font-weight:500;display:flex;align-items:center;gap:5px}
  .conflict .issue{font-size:15px;font-weight:400;color:#000;margin-bottom:2px;line-height:1.4;font-variation-settings:'wdth' 100}
  .conflict .note{font-size:12px;color:rgba(0,0,0,.4);line-height:1.4;font-variation-settings:'wdth' 100}
  .status-badge{font-size:10px;font-weight:600;border-radius:100px;padding:2px 9px;flex:none;margin-left:auto}
  .status-badge.resolved{background:#D8EE8C;color:#4a5c00}
  .status-badge.open{background:var(--amber-tint);color:var(--amber-ink)}

  .avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(0,0,0,.55)}

  .status-banner{display:flex;gap:11px;align-items:center;border-radius:16px;padding:14px}
  .status-banner .ib{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
  .status-banner .ib .sec-icon{width:18px;height:18px;margin-top:0;color:inherit}
  .status-banner.lime{background:var(--lime-tint)} .status-banner.lime .ib{background:var(--lime)} .status-banner.lime .ib svg{color:#4a5c00}
  .status-banner.amber{background:#fafafa} .status-banner.amber .ib{background:#eeeeee} .status-banner.amber .ib svg{color:var(--t60)}
  .status-banner .l{font-size:13px;font-weight:600}
  .status-banner .d{font-size:11.5px;color:var(--t60);margin-top:1px}

  .notes-row{display:flex;align-items:center;gap:8px;background:#fafafa;border-radius:12px;padding:14px 12px}
  .notes-row .sec-icon{margin-top:0}
  .notes-row span{font-size:14px;line-height:20px;color:rgba(0,0,0,.35);font-variation-settings:'wdth' 100}

</style>
</head>
<body>

<div id="canvas"></div>

<script>

function secHead(ic,title,desc,tag){
  return `<div class="sec-head">${icon(ic)}<div class="sec-text"><div class="sec-title">${title}${tag?`<span class="ai-tag">${tag}</span>`:''}</div>${desc?`<div class="sec-desc">${desc}</div>`:''}</div></div>`;
}
const swatches = ({icon:ic,title,desc,items}) => `<div class="sec">${secHead(ic,title,desc)}<div class="swrow">${items.map(i=>{
  const media = i.video
    ? `<video class="box" src="${i.video}" muted loop playsinline autoplay></video>`
    : `<div class="box" style="background:${i.color}"></div>`;
  return `<div class="sw">${media}<div class="cap">${i.label}</div></div>`;
}).join('')}</div></div>`;
const imageRow = ({icon:ic,title,desc,images}) => `<div class="sec">${secHead(ic,title,desc)}<div class="swrow">${images.map(src=>`<img class="sw-img" src="${src}" alt="" />`).join('')}</div></div>`;
function hexToHsl(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min;
  let h = 0, s = 0, l = (max+min)/2;
  if (d){
    s = l > .5 ? d/(2-max-min) : d/(max+min);
    if (max===r) h = ((g-b)/d + (g<b?6:0))/6;
    else if (max===g) h = ((b-r)/d + 2)/6;
    else h = ((r-g)/d + 4)/6;
  }
  return {h:h*360, s:s*100, l:l*100};
}
function hslCss(h,s,l){ return `hsl(${Math.round(h)} ${Math.round(s)}% ${Math.round(l)}%)`; }
function swatchInk(hex){
  const {h,s,l} = hexToHsl(hex);
  if (l < 55) return {name:hslCss(h, Math.min(s,28), 92), code:hslCss(h, Math.min(s,18), 80)};
  return {name:hslCss(h, Math.min(s+8, 42), 22), code:hslCss(h, Math.min(s, 28), 36)};
}
const hexSwatch = ({icon:ic,title,desc,items,cols}) => `<div class="sec">${secHead(ic,title,desc)}<div class="hexgrid" style="--hex-cols:${cols||items.length}">${items.map(i=>{
  const ink = i.ink ? {name:i.ink, code:i.inkSoft||i.ink} : swatchInk(i.hex);
  return `<div class="hexcard" style="background:${i.hex}"><div class="name" style="color:${ink.name}">${i.name}</div><div class="code" style="color:${ink.code}">${i.hex}</div></div>`;
}).join('')}</div></div>`;

const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri'];
const TODAY_IDX = 2; // Wednesday — the shared "today" reference across every panel
function weekStrip(value, tone, roleColor, size){
  let filled = [];
  const wdIdx = WEEKDAYS.findIndex(d=>value.startsWith(d));
  if (wdIdx !== -1){
    filled = [wdIdx];
  } else {
    const m = String(value).match(/^(\d+)d$/);
    const n = m ? parseInt(m[1],10) : 1;
    for (let i=0;i<n;i++) filled.push(Math.max(0, TODAY_IDX-i));
  }
  const fillColor = roleColor;
  const cls = size==='lg' ? ' lg' : '';
  return `<div class="st-week${cls}">${WEEKDAYS.map((d,i)=>`<span class="week-seg${cls}${i===TODAY_IDX?' today':''}" style="${filled.includes(i)?`background:${fillColor};color:#fff`:''}">${d[0]}</span>`).join('')}</div>`;
}
const FILL_PURPLE = '#C9A3F7';
function statCard(t, roleColor){
  const tone = t.tone==='amber' ? ' tone-amber' : '';
  let vis, val = t.type==='percent' ? `${t.value}%` : t.value, valCls = '';
  if (t.type==='percent'){
    vis = `<div class="vis-bar"><div class="vis-bar-fill" style="width:${t.value}%;background:${FILL_PURPLE}"></div></div>`;
  } else if (t.type==='fraction'){
    const [a,b] = String(t.value).split('/').map(Number);
    vis = `<div class="vis-dots">${Array.from({length:b}).map((_,i)=>`<span class="vd" style="${i<a?`background:${FILL_PURPLE}`:''}"></span>`).join('')}</div>`;
  } else if (t.type==='day'){
    vis = weekStrip(t.day||t.value, t.tone, FILL_PURPLE);
  } else if (t.type==='badge'){
    valCls = ' mono';
    vis = `<div class="vis-ic${tone}">${rawIcon(t.icon)}</div>`;
  } else {
    vis = `<div class="vis-ic${tone}">${rawIcon(t.icon)}</div>`;
  }
  return `<div class="stat-card${tone}"><div class="val${valCls}">${val}</div><div class="stat-row"><div class="lbl">${t.l}</div><div class="vis">${vis}</div></div></div>`;
}
const statCards = (tiles, roleColor) => `<div class="stat-cards">${tiles.map(t=>statCard(t,roleColor)).join('')}</div>`;

/* ============================================================
   CYCLE — Maya → Sable (Emil motion)
   open → 1s pause → scroll bottom → 1s pause → close → next
   ============================================================ */
const ORDER = Object.keys(ROLES); // maya, jin, priya, ren, leo, sable
const PAUSE_MS = 1000;
const OPEN_MS = 320;
const CLOSE_MS = 200;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const wait = ms => new Promise(r => setTimeout(r, reduceMotion ? Math.min(ms, 80) : ms));

function bindEdgeFades(){
  const scroll = canvas.querySelector('.body');
  const wrap = canvas.querySelector('.body-wrap');
  if (!scroll || !wrap) return;
  const RANGE = 28;
  const update = () => {
    const top = scroll.scrollTop;
    const max = Math.max(0, scroll.scrollHeight - scroll.clientHeight);
    const topFade = max === 0 ? 0 : Math.min(1, top / RANGE);
    const botFade = max === 0 ? 0 : Math.min(1, (max - top) / RANGE);
    wrap.style.setProperty('--mask-top', String(1 - topFade));
    wrap.style.setProperty('--mask-bot', String(1 - botFade));
  };
  scroll.addEventListener('scroll', update, {passive:true});
  update();
  return { scroll, wrap, update };
}

function openPanel(key){
  renderA(key);
  const card = canvas.querySelector('.card');
  const fades = bindEdgeFades();
  // Force layout, then open (CSS transition — interruptible)
  void card.offsetWidth;
  card.classList.add('is-open');
  return { card, ...fades };
}

function closePanel(card){
  return new Promise(resolve => {
    if (!card){ resolve(); return; }
    const done = () => {
      card.removeEventListener('transitionend', onEnd);
      resolve();
    };
    const onEnd = e => {
      if (e.target !== card) return;
      if (e.propertyName !== 'opacity' && e.propertyName !== 'transform') return;
      done();
    };
    card.addEventListener('transitionend', onEnd);
    card.classList.remove('is-open');
    card.classList.add('is-closing');
    setTimeout(done, CLOSE_MS + 40);
  });
}

/** Scroll body to bottom with ease-in-out (on-screen movement). */
function scrollToBottom(scroll, update){
  return new Promise(resolve => {
    if (!scroll){ resolve(); return; }
    const max = Math.max(0, scroll.scrollHeight - scroll.clientHeight);
    if (max <= 1 || reduceMotion){
      scroll.scrollTop = max;
      if (update) update();
      resolve();
      return;
    }
    // Soft & slow — longer distance-based duration, gentle ease-in-out
    const duration = Math.min(2800, Math.max(1600, max * 2.4));
    const start = scroll.scrollTop;
    const delta = max - start;
    const t0 = performance.now();
    // Softer ease-in-out (closer to ease): slow start, soft middle, soft land
    const ease = t => t * t * (3 - 2 * t);
    const tick = now => {
      const p = Math.min(1, (now - t0) / duration);
      scroll.scrollTop = start + delta * ease(p);
      if (update) update();
      if (p < 1) requestAnimationFrame(tick);
      else resolve();
    };
    requestAnimationFrame(tick);
  });
}

/** Keeps the card scaled to fit whatever height this iframe is actually
 *  given (matches #canvas's own 36px padding on every side) instead of
 *  fighting the card's fixed 530x640 size — recomputed on resize so it
 *  still fits if the host frame's aspect ratio changes at a breakpoint. */
function computeFitScale(){
  const availH = window.innerHeight - 72;
  const scale = Math.min(1, availH / 640);
  document.documentElement.style.setProperty('--fit-scale', scale.toFixed(4));
}
window.addEventListener('resize', computeFitScale);
computeFitScale();

/** Embedded in the case study page as a full-width "video" — loops forever
 *  instead of stopping after one pass, and announces whichever person's
 *  panel is currently open so the host page can update the caption below it.
 *  The frame is shorter than the card's natural height, so each panel
 *  auto-scrolls to reveal the rest before closing. */
async function playCycle(){
  while (true){
    for (const key of ORDER){
      window.parent.postMessage({ source: 'loom-export-cycle', person: key }, '*');
      const { card, scroll, update } = openPanel(key);
      await wait(OPEN_MS);

      // Initial pause before scrolling
      await wait(PAUSE_MS);

      await scrollToBottom(scroll, update);

      // Ending pause before close
      await wait(PAUSE_MS);

      await closePanel(card);
      canvas.innerHTML = '';
      await wait(120);
    }
  }
}

playCycle();
