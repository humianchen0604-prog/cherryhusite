<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dot field</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      /*
        Same as Footer DotField:
        dotRadius = 1.485px, dotSpacing = 21px
      */
      body {
        min-height: 100vh;
        background-color: #ffffff;
        background-image: radial-gradient(
          circle,
          #d8d8d8 1.485px,
          transparent 1.485px
        );
        background-size: 21px 21px;
        background-position: 0 0;
      }
    </style>
  </head>
  <body></body>
</html>
