<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tulip Twinkle</title>
  <!--
    Dot tulip from the hero, traced from tulip-source.png (280×416).
    Each dot keeps its original centre + halftone radius; region 0 = right
    tulip head, 1 = left tulip head, 2 = stems/leaves.

    Sequence: grey → Twinkle (dots flicker on in Blush) while the petals
    bloom open → petals gently breathe at full colour → fade back to grey.
  -->
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1c1c1c;
      --muted: #8e8e8e;
      --line: #eeeeee;
      --card: #fcfcfc;
      --chip: #f3f3f3;
      --chip-on: #1c1c1c;
      --chip-on-fg: #ffffff;
      --dot: #c8c8c8; /* resting tulip grey, matches hero */
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f0f0f;
        --fg: #ececec;
        --muted: #7c7c7c;
        --line: #212121;
        --card: #141414;
        --chip: #1e1e1e;
        --chip-on: #ececec;
        --chip-on-fg: #111111;
        --dot: #3c3c3c;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f0f0f;
      --fg: #ececec;
      --muted: #7c7c7c;
      --line: #212121;
      --card: #141414;
      --chip: #1e1e1e;
      --chip-on: #ececec;
      --chip-on-fg: #111111;
      --dot: #3c3c3c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Switzer", "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 56px 16px 80px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
      margin: 20px 0 24px;
    }

    .seg {
      display: inline-flex;
      padding: 3px;
      gap: 2px;
      border-radius: 999px;
      background: var(--chip);
    }
    .seg button, .btn {
      font: inherit;
      font-size: 13px;
      border: 0;
      border-radius: 999px;
      padding: 6px 12px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease, transform 120ms ease;
    }
    .seg button[aria-pressed="true"] {
      background: var(--chip-on);
      color: var(--chip-on-fg);
    }
    .btn { background: var(--chip); }
    .btn:active, .seg button:active { transform: scale(0.97); }

    .stage {
      all: unset;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      width: 100%;
      padding: 40px 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      cursor: pointer;
    }
    .stage:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

    .stage canvas {
      display: block;
      width: 100%;
      max-width: 260px;
      aspect-ratio: 304 / 440;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>03 Twinkle, with bloom</h1>
      <p>The dots flicker on in Blush while the petals bloom open. At full colour the petals gently breathe, then it fades back to grey. Hover the tulip to play it, or tap it on a phone.</p>
    </header>
    <div class="controls">
      <div class="seg" id="mode">
        <button type="button" data-v="loop" aria-pressed="true">Loop</button>
        <button type="button" data-v="hover" aria-pressed="false">Hover</button>
      </div>
      <button type="button" class="btn" id="replay">Replay</button>
      <button type="button" class="btn" id="theme">Theme</button>
    </div>

    <button type="button" class="stage" id="stage" aria-label="Dot tulip. Play the twinkle and bloom animation">
      <canvas aria-hidden="true"></canvas>
    </button>
  </main>

      return () => {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const seeded = mulberry32(11);
    const dots = RAW.map(([x, y, r, reg]) => ({ x, y, r, h: (r * Math.sqrt(Math.PI)) / 2, reg, j: seeded() }));
    const N = dots.length;

    // ---------- Blush colours: [deep, light] per region ----------
    const BLUSH = { r: ["#F4A3BA", "#FCD9E3"], l: ["#F7B399", "#FDE0D2"], g: ["#8CC79A", "#D2EDCB"] };

    // Each head opens around its base, fanning out along its own axis.
    const HEADS = [
      { base: { x: 190, y: 152 }, tip: { x: 192, y: 28 } },   // right, upright
      { base: { x: 108, y: 214 }, tip: { x: 52, y: 118 } },   // left, tilted
    ];

    dots.forEach((d) => {
      let t;
      if (d.reg === 2) t = 1 - clamp((d.y - 150) / 250);        // greens deepen toward the root
      else t = clamp(dist(d, HEADS[d.reg].base) / (d.reg ? 135 : 125)); // petals deepen at the cup
      t = clamp(t + (d.j - 0.5) * 0.3);
      const pair = [BLUSH.r, BLUSH.l, BLUSH.g][d.reg];
      d.col = mix(hex(pair[0]), hex(pair[1]), t);
      d.cs = rgb(d.col);

      // Bloom displacement at full open: petals flare sideways more toward
      // the tips (like a tulip cup opening) and lift a touch along the axis.
      d.bx = d.by = 0;
      d.br = 1;
      if (d.reg !== 2) {
        const { base, tip } = HEADS[d.reg];
        const len = dist(base, tip);
        const ux = (tip.x - base.x) / len, uy = (tip.y - base.y) / len;
        const nx = -uy, ny = ux;
        const vx = d.x - base.x, vy = d.y - base.y;
        const along = Math.max(0, vx * ux + vy * uy);
        const lat = vx * nx + vy * ny;
        const reach = clamp(along / len);
        const dLat = lat * 0.3 * reach;
        const dAlong = along * 0.06;
        d.bx = nx * dLat + ux * dAlong;
        d.by = ny * dLat + uy * dAlong;
        d.br = 1 + 0.1 * reach;
      }
    });

    // ---------- twinkle ----------
    // Each dot starts at a random time, flickers on/off with a white-ish
    // sparkle, then settles on its colour.
    let sched = null;
    function prepTwinkle() {
      sched = {
        d: dots.map(() => Math.random() * TW_SPREAD),
        ph: dots.map(() => (Math.random() * 3) | 0),
      };
      sched.dur = TW_SPREAD + TW_LEN;
    }
    const st = { a: 0, s: 1, c: null };
    function twinkle(i, t) {
      st.a = 0; st.s = 1; st.c = null;
      const k = clamp((t - sched.d[i]) / TW_LEN);
      if (k <= 0) return;
      if (k > 0.8) { st.a = 1; return; }
      const on = (Math.floor(k * TW_STEPS) + sched.ph[i]) % 2 === 0;
      st.a = on ? 0.45 + 0.55 * k : 0.1;
      st.s = on ? 1.1 : 0.7;
      st.c = mix(dots[i].col, WHITE, 0.45 * (1 - k));
    }

    // Bloom amount for time since the twinkle began: opens with a soft overshoot,
    // then breathes between ~88% and 100% open.
    function bloomAt(tb) {
      const open = backOut(clamp(tb / BLOOM_IN));
      const breath = tb > BLOOM_IN ? (1 - Math.cos(((tb - BLOOM_IN) / BREATHE) * Math.PI * 2)) / 2 : 0;
      return open - 0.12 * breath;
    }

    // ---------- rendering ----------
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const stage = document.getElementById("stage");
    const canvas = stage.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    let scale = 0;
    let grey = "#c8c8c8";
    const readGrey = () => (grey = getComputedStyle(document.documentElement).getPropertyValue("--dot").trim() || grey);

    let mode = "loop";
    let phase = "rest";   // rest → in → full (hover) | hold (loop) → out → rest
    let t0 = 0;
    let frozenT = 0;      // twinkle time when "out" began
    let frozenB = 0;      // bloom amount when "out" began
    let playT0 = 0;       // twinkle start; the bloom clock runs from here

    function play(now = performance.now()) {
      prepTwinkle();
      if (reducedMotion.matches) sched.dur = 400;
      phase = "in";
      t0 = playT0 = now;
      wake();
    }

    function leave(now = performance.now()) {
      if (phase === "rest" || phase === "out") return;
      frozenT = phase === "in" ? now - t0 : sched.dur;
      frozenB = reducedMotion.matches ? 0 : bloomAt(now - playT0);
      phase = "out";
      t0 = now;
      wake();
    }

    function tick(now) {
      const t = now - t0;
      if (phase === "in" && t >= sched.dur) {
        phase = mode === "loop" ? "hold" : "full";
        t0 = now;
      } else if (phase === "hold" && t >= HOLD) {
        leave(now);
      } else if (phase === "out" && t >= OUT) {
        phase = "rest";
        t0 = now;
      } else if (phase === "rest" && mode === "loop" && t >= REST) {
        play(now);
      }
      paint(now);
      // "full" keeps animating for the breathing; only a hover-mode rest is idle
      return !(phase === "rest" && mode === "hover") && !(reducedMotion.matches && phase === "full");
    }

    function paint(now) {
      if (!scale) return;
      const c = ctx;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, canvas.width, canvas.height);
      c.setTransform(scale, 0, 0, scale, PAD * scale, PAD * scale);
      c.globalAlpha = 1;

      if (phase === "rest") {
        c.fillStyle = grey;
        c.beginPath();
        for (const d of dots) square(c, d.x, d.y, d.h);
        c.fill();
        return;
      }

      if (phase === "full" || phase === "hold") {
        const b = reducedMotion.matches ? 0 : bloomAt(now - playT0);
        for (const d of dots) drawDot(c, d, d.cs, 1, 1, b);
        return;
      }

      // "in" plays the twinkle; "out" freezes it and crossfades to grey
      const inPhase = phase === "in";
      const t = inPhase ? now - t0 : frozenT;
      const e = inPhase ? 0 : easeInOut(clamp((now - t0) / OUT));
      const b = inPhase ? (reducedMotion.matches ? 0 : bloomAt(t)) : frozenB * (1 - e);
      const dim = lerp(1, GHOST, clamp(t / 120));
      for (let i = 0; i < N; i++) {
        const d = dots[i];
        if (reducedMotion.matches) { st.a = clamp(t / 400); st.s = 1; st.c = null; }
        else twinkle(i, t);
        const g0 = dim * (1 - st.a);
        const g = g0 + (1 - g0) * e;
        if (g > 0.003) {
          c.globalAlpha = g;
          c.fillStyle = grey;
          c.beginPath();
          square(c, d.x, d.y, d.h);
          c.fill();
        }
        const a = st.a * (1 - e);
        if (a > 0.003) drawDot(c, d, st.c ? rgb(st.c) : d.cs, a, lerp(st.s, 1, e), b);
      }
      c.globalAlpha = 1;
    }

    // Pixels are squares with the same area as the traced halftone dot
    // (half-side h = r·√π/2), so density and weight match the original.
    // Corners are softened by CORNER screen px, capped so the smallest
    // pixels stay square instead of turning into circles.
    let corner = 1;          // CORNER converted to canvas units in resize()
    function square(c, x, y, h) {
      const rad = Math.min(corner, h * 0.4);
      if (c.roundRect) c.roundRect(x - h, y - h, h * 2, h * 2, rad);
      else c.rect(x - h, y - h, h * 2, h * 2);
    }

    function drawDot(c, d, fill, a, s, b) {
      const h = d.h * s * lerp(1, d.br, b);
      c.globalAlpha = a;
      c.fillStyle = fill;
      c.beginPath();
      square(c, d.x + d.bx * b, d.y + d.by * b, h);
      c.fill();
    }

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = canvas.clientWidth;
      if (!w) return;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round((w * VH / VW) * dpr);
      scale = (w / VW) * dpr;
      corner = (CORNER * VW) / w;
      paint(performance.now());
    }

    let raf = 0;
    function wake() { if (!raf) raf = requestAnimationFrame(frame); }
    function frame(now) {
      raf = 0;
      if (tick(now)) wake();
    }

    // ---------- interaction ----------
    stage.addEventListener("pointerenter", (e) => {
      if (e.pointerType === "mouse" && mode === "hover" && (phase === "rest" || phase === "out")) play();
    });
    stage.addEventListener("pointerleave", (e) => {
      if (e.pointerType === "mouse" && mode === "hover") leave();
    });
    stage.addEventListener("click", () => play());
    stage.addEventListener("focus", () => { if (mode === "hover" && stage.matches(":focus-visible")) play(); });
    stage.addEventListener("blur", () => { if (mode === "hover") leave(); });

    const modeEl = document.getElementById("mode");
    const setPressed = () =>
      modeEl.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === mode)));
    modeEl.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b || b.dataset.v === mode) return;
      mode = b.dataset.v;
      setPressed();
      if (mode === "loop") play();
      else leave();
      wake();
    });

    document.getElementById("replay").addEventListener("click", () => play());

    const themeBtn = document.getElementById("theme");
    const isDark = () => {
      const t = document.documentElement.dataset.theme;
      return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    };
    const syncTheme = () => {
      themeBtn.textContent = isDark() ? "Light" : "Dark";
      readGrey();
      paint(performance.now());
    };
    try {
      const saved = localStorage.getItem("tulip-theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
    themeBtn.addEventListener("click", () => {
      const next = isDark() ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("tulip-theme", next); } catch (e) {}
      syncTheme();
    });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme);

    new ResizeObserver(resize).observe(canvas);
    syncTheme();
    if (reducedMotion.matches) {
      mode = "hover";
      setPressed();
    } else {
      play();
    }
  </script>
</body>
</html>
